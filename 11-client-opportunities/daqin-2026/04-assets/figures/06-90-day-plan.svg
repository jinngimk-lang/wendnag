<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="257" viewBox="0 0 1080 257" role="img"><rect x="0" y="0" width="1080" height="257" rx="0" fill="#FFFFFF" stroke="none"/><rect x="10" y="35" width="253" height="168" rx="13" fill="#EFF6F9" stroke="#D8E5ED"/><text x="24" y="76" fill="#168E94" font-family="Noto Sans CJK SC,Microsoft Yahei,sans-serif" font-weight="800" font-size="26" text-anchor="start">D0–15</text><text x="24" y="123" fill="#14354D" font-family="Noto Sans CJK SC,Microsoft Yahei,sans-serif" font-weight="700" font-size="22" text-anchor="start">事实与系统访谈</text><text x="24" y="166" fill="#637989" font-family="Noto Sans CJK SC,Microsoft Yahei,sans-serif" font-weight="500" font-size="18" text-anchor="start">找到真实损失</text><rect x="279" y="35" width="253" height="168" rx="13" fill="#EFF6F9" stroke="#D8E5ED"/><text x="293" y="76" fill="#168E94" font-family="Noto Sans CJK SC,Microsoft Yahei,sans-serif" font-weight="800" font-size="26" text-anchor="start">D16–30</text><text x="293" y="123" fill="#14354D" font-family="Noto Sans CJK SC,Microsoft Yahei,sans-serif" font-weight="700" font-size="22" text-anchor="start">选一个POC</text><text x="293" y="166" fill="#637989" font-family="Noto Sans CJK SC,Microsoft Yahei,sans-serif" font-weight="500" font-size="18" text-anchor="start">定义样本及退出</text><rect x="548" y="35" width="253" height="168" rx="13" fill="#F1F8F7" stroke="#D8E5ED"/><text x="562" y="76" fill="#168E94" font-family="Noto Sans CJK SC,Microsoft Yahei,sans-serif" font-weight="800" font-size="26" text-anchor="start">D31–60</text><text x="562" y="123" fill="#14354D" font-family="Noto Sans CJK SC,Microsoft Yahei,sans-serif" font-weight="700" font-size="22" text-anchor="start">受控实施与对照</text><text x="562" y="166" fill="#637989" font-family="Noto Sans CJK SC,Microsoft Yahei,sans-serif" font-weight="500" font-size="18" text-anchor="start">核查增量价值</text><rect x="817" y="35" width="253" height="168" rx="13" fill="#F1F8F7" stroke="#D8E5ED"/><text x="831" y="76" fill="#168E94" font-family="Noto Sans CJK SC,Microsoft Yahei,sans-serif" font-weight="800" font-size="26" text-anchor="start">D61–90</text><text x="831" y="123" fill="#14354D" font-family="Noto Sans CJK SC,Microsoft Yahei,sans-serif" font-weight="700" font-size="22" text-anchor="start">共同验收/商定</text><text x="831" y="166" fill="#637989" font-family="Noto Sans CJK SC,Microsoft Yahei,sans-serif" font-weight="500" font-size="18" text-anchor="start">扩展或终止</text><text x="540" y="236" fill="#637989" font-family="Noto Sans CJK SC,Microsoft Yahei,sans-serif" font-weight="400" font-size="18" text-anchor="middle">日期为拟定的推进框架，并非客户承诺的进度</text></svg>