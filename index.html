function bindCards(){ $$('[data-open]').forEach(x=>x.onclick=()=>projectDetails(+x.dataset.open));$$('[data-members]').forEach(x=>x.onclick=()=>members(+x.dataset.members));$$('[data-menu]').forEach(x=>x.onclick=(e)=>{e.stopPropagation();$$('.project-card .popup').forEach(n=>{if(n.id!==`menu-${x.dataset.menu}`)n.classList.add('hidden')});$('#menu-'+x.dataset.menu).classList.toggle('hidden')});$$('[data-rename]').forEach(x=>x.onclick=()=>rename(+x.dataset.rename));$$('[data-archive]').forEach(x=>x.onclick=()=>{projects=projects.filter(p=>p.id!==+x.dataset.archive);render();toast('项目已归档（原型演示）')})}
function closeModal(){const m=$('#modalContainer');m.innerHTML='';modal=null;document.body.style.overflow=''}
function showModal(title,body,foot=''){modal=title;document.body.style.overflow='hidden';$('#modalContainer').innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="modal-header"><h2>${escapeHtml(title)}</h2><button class="close" id="modalClose" aria-label="关闭">×</button></div>${body}<div class="modal-foot">${foot}</div></section></div>`;$('#modalClose').onclick=closeModal;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()}}
function createProject(){showModal('新建项目',`<form id="createForm"><label for="pname">项目名称 <span style="color:#ef421c">*</span></label><input class="field" id="pname" required maxlength="60" placeholder="例如：新产品研发" autofocus/><label for="pkey">项目标识</label><input class="field" id="pkey" maxlength="8" placeholder="例如：NEW"/><label for="pdesc">项目描述</label><textarea class="field textarea" id="pdesc" placeholder="简要介绍项目目标及范围"></textarea><div class="info">项目创建后，可以进入项目邀请成员和管理任务。</div><div class="modal-foot"><button class="secondary" type="button" id="cancelForm">取消</button><button class="primary" type="submit">创建项目</button></div></form>`);$('#cancelForm').onclick=closeModal;$('#createForm').onsubmit=e=>{e.preventDefault();const name=$('#pname').value.trim();if(!name)return;const key=($('#pkey').value.trim()||name.slice(0,3)).toUpperCase();const colors=['purple','green','sky','orange'];projects.push({id:nextId++,name,label:key,initial:name[0].toUpperCase(),color:colors[projects.length%4],desc:$('#pdesc').value.trim()||'暂无项目描述',more:0,people:1});closeModal();render();toast('项目创建成功（仅限当前原型）')};$('#pname').focus()}
function projectDetails(id){const p=projects.find(p=>p.id===id);if(!p)return;showModal(p.name,`<div style="display:flex;gap:16px;align-items:center"><div class="project-badge ${p.color}">${p.initial}</div><div><strong style="font-size:19px">${escapeHtml(p.name)}</strong><div style="color:#7486b1">${escapeHtml(p.label)} · Ada (管理员)</div></div></div><div class="info">${escapeHtml(p.desc)}</div><div class="board-columns" style="margin-top:15px"><div class="board-col" style="min-width:120px">待处理<div style="font-size:25px;font-weight:700">8</div></div><div class="board-col" style="min-width:120px">进行中<div style="font-size:25px;font-weight:700">4</div></div><div class="board-col" style="min-width:120px">已完成<div style="font-size:25px;font-weight:700">12</div></div></div>`,`<button class="secondary" id="viewMembers">查看成员</button><button class="primary" id="enterProject">进入项目</button>`);$('#viewMembers').onclick=()=>members(id);$('#enterProject').onclick=()=>{closeModal();sub='需求看板';render();toast('已打开 '+p.name+' 项目看板')}}
function members(id){const p=projects.find(p=>p.id===id);if(!p)return;showModal(`${p.name} · 成员`,`<div class="info">成员与权限示例，可继续扩展邀请、移除和角色授权。</div>${[['A','Ada','管理员'],['李','李明','项目成员'],['王','王芳','开发成员'],['张','张伟','项目成员']].map(([a,n,r])=>`<div class="member-row"><span style="display:flex;align-items:center;gap:12px"><span class="owner-avatar">${a}</span><strong>${n}</strong></span><small>${r}</small></div>`).join('')}`,`<button class="secondary" id="mCancel">关闭</button><button class="primary" id="invite">邀请成员</button>`);$('#mCancel').onclick=closeModal;$('#invite').onclick=()=>{showModal('邀请成员',`<label>成员邮箱</label><input class="field" id="inviteEmail" type="email" placeholder="name@example.com"/><div class="info">原型模式：仅展示邀请确认，不会发送真实邮件。</div>`,`<button class="secondary" id="inviteCancel">取消</button><button class="primary" id="inviteSubmit">发送邀请</button>`);$('#inviteCancel').onclick=closeModal;$('#inviteSubmit').onclick=()=>{if(!$('#inviteEmail').value.includes('@')){toast('请输入有效的邮箱');return}closeModal();toast('邀请已记录（原型演示）')}}}
function rename(id){let p=projects.find(p=>p.id===id);showModal('重命名项目',`<label>项目名称</label><input class="field" id="newName" value="${escapeHtml(p.name)}"/>`,`<button class="secondary" id="rCancel">取消</button><button class="primary" id="rSave">保存</button>`);$('#rCancel').onclick=closeModal;$('#rSave').onclick=()=>{let t=$('#newName').value.trim();if(t){p.name=t;closeModal();render();toast('名称已更新')}}}
$$('[data-area]').forEach(b=>b.onclick=()=>{area=b.dataset.area;sub=menus[area][0][0];if(area==='团队')teamUi.query='';searchText='';$('#search').value='';render()});$('#search').addEventListener('input',e=>{searchText=e.target.value;if(area==='团队')teamUi.query=e.target.value;render()});$('#createBtn').onclick=()=>area==='团队'?openTeamCreate():createProject();$('#theme').onclick=()=>document.body.classList.toggle('dark');$('#notice').onclick=()=>{$('#accountMenu').classList.add('hidden');$('#noticeMenu').classList.toggle('hidden')};$('#account').onclick=()=>{$('#noticeMenu').classList.add('hidden');$('#accountMenu').classList.toggle('hidden')};$$('#noticeMenu button,#accountMenu button').forEach(b=>b.onclick=()=>{b.closest('.popup').classList.add('hidden');toast(`${b.textContent}：原型操作演示`)});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}});document.addEventListener('click',e=>{if(!e.target.closest('.more')&&!e.target.closest('.project-card .popup'))$$('.project-card .popup').forEach(el=>el.classList.add('hidden'))});render();
</script><script>
/* Team workspace: local-first interaction prototype, no remote API, no actual invitations. */
const TEAM_STORAGE_KEY='aragonteam.team-prototype.v1';
const TEAM_TYPE_OPTIONS=['内部团队','产品团队','研发团队','设计团队','市场团队','研究团队'];
const TEAM_PALETTE=[['#fff0f0','#ff4c22'],['#e8f2ff','#2685df'],['#e6f9f2','#06996b'],['#f2eaff','#8157de'],['#fff1e8','#f47230'],['#eff2ff','#6e51d4']];
const teamSeedNames=['Ada','李明','张伟','王芳','陈磊','刘洋','赵敏','周杰','孙悦','林琳','何帆','张晨','王莉','郭峰','陈希','唐雪','郑磊','徐静','吴越','杜鹃','江涛','郭悦','许佳','蒋鑫','董博','苏青','叶辰','韩露','余华','林舟','贾宁','程琳','胡凯','姜颖','魏然','丁睿','罗敏','顾凡','郝宇','谢菲','马会','夏明'];
function seedTeamData(){
 const members=teamSeedNames.map((name,i)=>({id:i+1,name,email:`member${i+1}@example.com`,department:['产品','研发','设计','市场','运营'][i%5]}));
 const defs=[
 ['AragonTeam Platform','AI 时代的团队协作与研发管理平台。','内部团队','活跃',[1,2,3,4],Array.from({length:9},(_,i)=>i+1),3,0],
 ['Legallens','法律 AI 助手与知识管理产品团队。','产品团队','活跃',[2,5,6],Array.from({length:7},(_,i)=>i+9),1,1],
 ['Marketing','品牌、市场与用户增长团队。','市场团队','活跃',[7,8,9,10,11],Array.from({length:6},(_,i)=>i+15),2,2],
 ['Research','前沿技术研究与创新探索团队。','研究团队','空闲',[12,13],Array.from({length:5},(_,i)=>i+20),7,3],
 ['Design','产品设计与用户体验团队。','设计团队','活跃',[1,8,14],Array.from({length:8},(_,i)=>i+23),1,4],
 ['Engineering','核心研发与基础设施团队。','研发团队','活跃',[3,5,15,16,17,18],Array.from({length:11},(_,i)=>i+30),0,5],
 ['Operations','跨部门协作与日常运营支持。','内部团队','活跃',[4,11],[1,2,41,42],1,1],
 ['Growth Lab','小规模增长实验与策略验证。','研究团队','空闲',[13],[4,13,26,34,41],14,3]
 ];
 return {version:1, members,teams:defs.map((d,i)=>({id:i+1,name:d[0],description:d[1],type:d[2],status:d[3],projectIds:d[4],memberIds:d[5],days:d[6],colorIndex:d[7],archived:false,roles:Object.fromEntries(d[5].map((id,k)=>[id,k===0?'管理员':'成员']))})),invites:[],nextTeamId:9,nextMemberId:43,nextInviteId:1};
}
function loadTeamData(){try{const raw=localStorage.getItem(TEAM_STORAGE_KEY);if(!raw)return seedTeamData();const data=JSON.parse(raw);if(data.version===1 && Array.isArray(data.teams)&&Array.isArray(data.members)&&Array.isArray(data.invites))return data;}catch(e){/* session-only fallback */}return seedTeamData()}
let teamData=loadTeamData();
const teamUi={query:'',status:'all',type:'all',sort:'default',view:'cards',showArchived:false,menuId:null,detailId:null,detailTab:'members'};
function persistTeams(){try{localStorage.setItem(TEAM_STORAGE_KEY,JSON.stringify(teamData));}catch(e){toast('浏览器未允许本地保存，本次修改仅在当前页面有效。')}}
function teamOf(id){return teamData.teams.find(t=>t.id===Number(id))}
function memberOf(id){return teamData.members.find(m=>m.id===Number(id))}
function allLiveTeams(){return teamData.teams.filter(t=>!t.archived)}
function teamMemberIds(){return [...new Set(allLiveTeams().flatMap(t=>t.memberIds))]}
function teamStat(){const ts=allLiveTeams();return {teams:ts.length,members:teamMemberIds().length,projects:new Set(ts.flatMap(t=>t.projectIds)).size,active:ts.filter(t=>t.status==='活跃').length}}
function teamIdentity(t){const [bg,fg]=TEAM_PALETTE[t.colorIndex%TEAM_PALETTE.length];return `<span class="team-avatar" style="--team-avatar-bg:${bg};--team-avatar-fg:${fg}" aria-hidden="true">${escapeHtml(t.name.slice(0,1).toUpperCase())}</span>`}
function teamPeers(t){return `<span class="team-peers" aria-label="${t.memberIds.length} 名成员">${t.memberIds.slice(0,4).map(id=>`<span class="team-peer" title="${escapeHtml(memberOf(id)?.name||'成员')}" aria-hidden="true">${escapeHtml((memberOf(id)?.name||'·').slice(0,1).toUpperCase())}</span>`).join('')}${t.memberIds.length>4?`<span class="team-peer-rest">+${t.memberIds.length-4}</span>`:''}</span>`}
function teamMobileNav(){return `<nav class="team-mobile-tabs" aria-label="团队二级导航">${menus['团队'].map(([label])=>`<button type="button" data-team-nav="${escapeHtml(label)}" class="${label===sub?'active':''}" ${label===sub?'aria-current="page"':''}>${escapeHtml(label)}</button>`).join('')}</nav>`}
function teamKicker(){return `<div class="team-kicker"><span>工作空间</span><span class="sep"></span><span>团队协作</span><span class="team-demo" title="本页面是本地可交互样例，没有连接真实组织数据">演示数据 · 仅本机保存</span></div>`}
function teamMetrics(){const s=teamStat();const vals=[['团队总数',s.teams,'users',''],['团队成员',s.members,'user',''],['关联项目',s.projects,'folder','amber'],['活跃团队',s.active,'board','sky']];return `<section class="team-stats" aria-label="团队概览">${vals.map(([label,n,ico,cls])=>`<div class="team-stat"><span class="team-stat-icon ${cls}">${icon(ico)}</span><div><div class="team-stat-label">${label}</div><div class="team-stat-value">${n}</div><div class="team-stat-note">${label==='活跃团队'?'当前标记为活跃':label==='团队成员'?'跨团队成员去重':'基于当前演示数据'}</div></div></div>`).join('')}</section>`}
function teamSearchToolbar(){return `<div class="team-filterbar" role="search" aria-label="团队列表筛选"><label class="team-filter-search">${icon('search')}<input id="teamQuery" type="search" aria-label="搜索团队名称、描述或成员" placeholder="搜索团队名称、描述或成员..." value="${escapeHtml(teamUi.query)}" autocomplete="off"/>${teamUi.query?'<button type="button" class="clear-search" data-team-action="clear-search" aria-label="清除搜索">×</button>':''}</label><select id="teamStatusFilter" aria-label="按团队状态筛选"><option value="all">全部状态</option><option value="活跃">活跃</option><option value="空闲">空闲</option></select><select id="teamTypeFilter" aria-label="按团队类型筛选"><option value="all">所有类型</option>${TEAM_TYPE_OPTIONS.map(t=>`<option value="${t}">${t}</option>`).join('')}</select><select id="teamSort" aria-label="团队排序"><option value="default">默认排序</option><option value="name">名称 A–Z</option><option value="members">成员最多</option><option value="recent">最近活跃</option></select><div class="team-view-toggle" role="group" aria-label="视图切换"><button data-team-view="cards" aria-pressed="${teamUi.view==='cards'}">▦ 卡片</button><button data-team-view="list" aria-pressed="${teamUi.view==='list'}">☷ 列表</button></div><label class="team-checklabel team-toggle-wrap"><input id="teamArchivedToggle" type="checkbox" ${teamUi.showArchived?'checked':''}/> 包含已归档</label></div>`}
function matchTeam(t){const hay=`${t.name} ${t.description} ${t.type} ${t.memberIds.map(i=>(memberOf(i)?.name||'')+' '+(memberOf(i)?.email||'')).join(' ')}`.toLocaleLowerCase();return (teamUi.showArchived||!t.archived)&&(!t.archived||teamUi.status==='all')&&(teamUi.status==='all'||teamUi.status===t.status)&&(teamUi.type==='all'||teamUi.type===t.type)&&(!teamUi.query||hay.includes(teamUi.query.trim().toLocaleLowerCase()))}
function visibleTeams(){const ts=teamData.teams.filter(matchTeam);if(teamUi.sort==='name')ts.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));if(teamUi.sort==='members')ts.sort((a,b)=>b.memberIds.length-a.memberIds.length);if(teamUi.sort==='recent')ts.sort((a,b)=>a.days-b.days);return ts}
function teamCard(t){return `<article class="team-card" data-team-id="${t.id}"><div class="team-card-header">${teamIdentity(t)}<div class="team-card-info"><button type="button" class="team-name" title="${escapeHtml(t.name)}" data-team-action="details" data-id="${t.id}">${escapeHtml(t.name)}</button><p class="team-descr" title="${escapeHtml(t.description)}">${escapeHtml(t.description)}</p><div class="team-badges"><span class="team-type">${escapeHtml(t.type)}</span><span class="team-status ${t.archived?'archived':t.status==='空闲'?'idle':''}"><i></i>${t.archived?'已归档':t.status}</span></div></div></div><button type="button" class="team-more" data-team-action="toggle-menu" data-id="${t.id}" aria-label="${escapeHtml(t.name)} 更多操作" aria-expanded="${teamUi.menuId===t.id}">${icon('more')}</button>${teamUi.menuId===t.id?`<div class="team-context-menu" role="menu"><button data-team-action="details" data-id="${t.id}">查看团队详情</button><button data-team-action="edit" data-id="${t.id}">编辑团队信息</button><button data-team-action="invite" data-id="${t.id}" ${t.archived?'disabled':''}>邀请成员</button><button class="${t.archived?'':'danger'}" data-team-action="${t.archived?'restore':'archive'}" data-id="${t.id}">${t.archived?'恢复团队':'归档团队'}</button></div>`:''}<div class="team-card-meta"><span>${icon('users')}${t.memberIds.length} 名成员</span><span>${icon('folder')}${t.projectIds.length} 个项目</span><span>${icon('board')}${t.archived?'已归档':t.days===0?'4 小时前活跃':`${t.days} 天前活跃`}</span></div><div class="team-card-foot">${teamPeers(t)}<button type="button" class="team-card-open" data-team-action="details" data-id="${t.id}">查看团队 →</button></div></article>`}
function teamTable(ts){return `<div class="team-plain-table"><table><thead><tr><th scope="col">团队</th><th scope="col">类型</th><th scope="col">状态</th><th scope="col">成员</th><th scope="col">项目</th><th scope="col">最近活跃</th><th scope="col">操作</th></tr></thead><tbody>${ts.map(t=>`<tr><td><button data-team-action="details" data-id="${t.id}">${escapeHtml(t.name)}</button></td><td>${escapeHtml(t.type)}</td><td><span class="team-status ${t.archived?'archived':t.status==='空闲'?'idle':''}">${t.archived?'已归档':t.status}</span></td><td>${t.memberIds.length}</td><td>${t.projectIds.length}</td><td>${t.days===0?'4 小时前':t.days+' 天前'}</td><td><button data-team-action="${t.archived?'restore':'details'}" data-id="${t.id}">${t.archived?'恢复':'查看'}</button></td></tr>`).join('')}</tbody></table></div>`}
function teamResults(){const ts=visibleTeams();return `<section class="team-results"><div class="team-listhead"><strong>所有团队 <span style="color:#7e91b6">(${ts.length})</span></strong><span>点击团队名称查看成员、权限与项目</span></div>${ts.length?(teamUi.view==='cards'?`<div class="team-card-grid">${ts.map(teamCard).join('')}</div>`:teamTable(ts)):`<div class="team-empty">${icon('search')}<h3>未找到符合条件的团队</h3><p>调整关键词或筛选条件，也可以创建新团队。</p><button type="button" data-team-action="reset-filters">清除筛选</button></div>`}</section>`}
function teamRightRail(){return `<aside class="team-side" aria-label="团队快捷信息"><section class="team-side-card"><h3>快捷操作</h3><button class="team-quick" data-team-action="create"><span class="quick-icon">${icon('plus')}</span>新建团队</button><button class="team-quick" data-team-action="invite"><span class="quick-icon">${icon('user')}</span>邀请成员</button><button class="team-quick" data-team-nav="成员管理"><span class="quick-icon">${icon('users')}</span>成员管理</button><button class="team-quick" data-team-nav="邀请记录"><span class="quick-icon">${icon('page')}</span>邀请记录 <span style="margin-left:auto;color:#f15c2f">${teamData.invites.filter(i=>i.status==='待接受').length||''}</span></button></section><section class="team-side-card"><h3>团队概况</h3><div class="team-info-entry"><span>当前活跃团队</span><strong>${teamStat().active} / ${teamStat().teams}</strong></div><div class="team-info-entry"><span>待处理邀请</span><strong>${teamData.invites.filter(i=>i.status==='待接受').length}</strong></div><div class="team-info-entry"><span>已归档团队</span><strong>${teamData.teams.filter(t=>t.archived).length}</strong></div><button class="team-side-link" data-team-nav="角色权限">查看角色权限说明 →</button></section><section class="team-side-card"><h3>需要帮助？</h3><p style="color:#7789ae;font-size:12px;line-height:1.8;margin:0">快速了解团队成员、权限和邀请流程。操作仅保存在当前浏览器。</p><button class="team-side-link" data-team-action="help">了解团队管理 →</button></section></aside>`}
function teamOverview(){return teamMetrics()+teamSearchToolbar()+`<div class="team-workspace"><div id="teamResults">${teamResults()}</div>${teamRightRail()}</div>`}
function teamMembersPage(){const ids=teamMemberIds().filter(id=>{const m=memberOf(id);return !teamUi.query||`${m?.name||''} ${m?.email||''} ${allLiveTeams().filter(t=>t.memberIds.includes(id)).map(t=>t.name).join(' ')}`.toLocaleLowerCase().includes(teamUi.query.toLocaleLowerCase())});const rows=ids.map(id=>{const m=memberOf(id);if(!m)return '';const ts=allLiveTeams().filter(t=>t.memberIds.includes(id));return `<tr><td><span class="team-mini-avatar">${escapeHtml(m.name.charAt(0))}</span>${escapeHtml(m.name)}</td><td>${escapeHtml(m.email)}</td><td>${ts.length} 个团队</td><td>${escapeHtml(ts.slice(0,3).map(t=>t.name).join('、'))}${ts.length>3?'…':''}</td><td><button data-team-action="member-detail" data-id="${id}">查看归属</button></td></tr>`}).join('');return `<div class="team-subpage"><div class="team-section-head"><div><h3>成员管理 <span style="font-size:13px;color:#7086b1">(${ids.length})</span></h3><p>跨团队去重，点击成员查看团队归属和角色。</p></div><button class="team-small-btn" data-team-action="invite">＋ 邀请成员</button></div><div class="team-plain-table team-table-scroll"><table><thead><tr><th>成员</th><th>邮箱</th><th>加入团队</th><th>团队归属</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
function teamRolesPage(){const roles=[['管理员','管理团队资料、成员与邀请；可调整其他成员权限','完整管理'],['成员','查看团队内容，参与团队项目和协作','日常协作'],['访客','仅限被授予的团队信息（原型说明）','只读访问']];return `<div class="team-subpage"><div class="team-section-head"><div><h3>角色与权限</h3><p>权限最小化：先明确角色，再邀请成员。</p></div><button class="team-small-btn" data-team-action="help">查看使用建议</button></div><div class="team-plain-table"><table><thead><tr><th>角色</th><th>团队管理</th><th>成员与邀请</th><th>浏览团队</th></tr></thead><tbody><tr><td><strong>管理员</strong></td><td>可管理</td><td>可管理</td><td>可查看</td></tr><tr><td><strong>成员</strong></td><td>不可管理</td><td>不可管理</td><td>可查看</td></tr><tr><td><strong>访客</strong></td><td>不可管理</td><td>不可管理</td><td>有限查看</td></tr></tbody></table></div><div class="team-type-guide">${roles.map(r=>`<h4>${r[0]} · ${r[2]}</h4><p>${r[1]}</p>`).join('')}<div class="team-modal-summary">这是产品设计原型中的权限定义。真实产品还需要服务端鉴权、审计日志和细粒度资源授权，不能仅依赖页面控制。</div></div></div>`}
function teamInvitesPage(){const matched=teamData.invites.filter(i=>!teamUi.query||`${i.email} ${teamOf(i.teamId)?.name||''} ${i.role}`.toLocaleLowerCase().includes(teamUi.query.toLocaleLowerCase()));return `<div class="team-subpage"><div class="team-section-head"><div><h3>邀请记录 <span style="font-size:13px;color:#7086b1">(${matched.length})</span></h3><p>所有记录保存在本机，未实际发送邮件。</p></div><button class="team-small-btn" data-team-action="invite">＋ 新建邀请</button></div>${matched.length?matched.slice().reverse().map(i=>`<article class="team-inv-card"><div><strong>${escapeHtml(i.email)}</strong> <span class="team-role-pill">${escapeHtml(i.role)}</span><div class="team-message">${escapeHtml(teamOf(i.teamId)?.name||'已归档团队')} · ${escapeHtml(i.status)} · ${new Date(i.createdAt).toLocaleDateString('zh-CN')}</div></div><div class="team-inv-actions">${i.status==='待接受'?`<button class="team-small-btn" data-team-action="resend-invite" data-id="${i.id}">重新记录</button><button class="team-small-btn" data-team-action="cancel-invite" data-id="${i.id}">取消邀请</button>`:'<span class="team-role-pill">已取消</span>'}</div></article>`).join(''):`<div class="team-empty"><h3>还没有邀请记录</h3><p>邀请成员后可以在这里查看和取消。</p><button data-team-action="invite">邀请第一位成员</button></div>`}</div>`}
function teamSettingsPage(){return `<div class="team-subpage"><div class="team-section-head"><div><h3>团队设置</h3><p>仅影响本机演示数据与当前浏览器。</p></div></div><div class="team-info-entry"><div><strong>下载团队数据</strong><div style="margin-top:4px">导出当前团队、成员与邀请的 JSON 备份。</div></div><button class="team-small-btn" data-team-action="export">导出 JSON</button></div><div class="team-info-entry"><div><strong>恢复演示数据</strong><div style="margin-top:4px">清空本机的团队修改并恢复初始样例，需二次确认。</div></div><button class="team-small-btn" data-team-action="reset-data">恢复初始数据</button></div><div class="team-modal-summary">本页没有连接真实组织后端，不会实际发送邀请、修改账号权限或更新项目数据库。</div></div>`}
function renderTeamSection(){
 $('#pageTitle').textContent=sub==='团队管理'?'团队':sub;
 $('#pageSubtitle').textContent=sub==='团队管理'?'组织你的成员，分配他们到项目中，高效协作。':({成员管理:'集中查看成员与所属团队',角色权限:'清晰的职责边界与权限设计',邀请记录:'管理待处理的团队邀请',团队设置:'管理团队原型和演示数据'}[sub]||'团队协作与成员管理');
 $('#createBtn').style.display='inline-flex';$('#createText').textContent='新建团队';
 $('#search').placeholder='搜索团队、成员或项目...';$('#search').setAttribute('aria-label','搜索团队或成员');
 const sections={'团队管理':teamOverview,'成员管理':teamMembersPage,'角色权限':teamRolesPage,'邀请记录':teamInvitesPage,'团队设置':teamSettingsPage};
 $('#content').innerHTML=`<div class="team-page">${teamMobileNav()}${teamKicker()}${(sections[sub]||teamOverview)()}</div>`;
 const s=$('#teamStatusFilter'),t=$('#teamTypeFilter'),o=$('#teamSort');if(s)s.value=teamUi.status;if(t)t.value=teamUi.type;if(o)o.value=teamUi.sort;
}
function repaintTeamResults(){const el=$('#teamResults');if(el)el.innerHTML=teamResults();const c=$('.team-filter-search .clear-search');if(!c && teamUi.query){const inp=$('#teamQuery');if(inp){const b=document.createElement('button');b.type='button';b.className='clear-search';b.dataset.teamAction='clear-search';b.setAttribute('aria-label','清除搜索');b.textContent='×';inp.parentElement.appendChild(b)}}else if(c&&!teamUi.query)c.remove()}
function resetTeamFilters(){teamUi.query='';teamUi.type='all';teamUi.status='all';teamUi.sort='default';teamUi.showArchived=false;teamUi.menuId=null;searchText='';$('#search').value='';renderTeamSection();toast('已清除团队筛选条件')}
function teamDialog(title,html,{wide=false}={}){if(!$('#modalContainer [role="dialog"]'))teamModalReturnFocus=document.activeElement;showModal(title,html);if(wide){const d=$('.modal');if(d)d.classList.add('team-modal-wide')}setTimeout(()=>{const focus=$('#modalContainer input:not([type="hidden"]),#modalContainer select,#modalContainer button');if(focus)focus.focus()},0)}
function openTeamCreate(){const memberOptions=teamData.members.slice(1,10).map(m=>`<label class="team-checklabel"><input type="checkbox" name="initialMembers" value="${m.id}"/> ${escapeHtml(m.name)}</label>`).join('');teamDialog('新建团队',`<form id="teamCreateForm"><label class="team-form-label" for="newTeamName">团队名称 *</label><input id="newTeamName" class="field" name="name" required maxlength="64" placeholder="例如：产品体验团队" autocomplete="off"/><label class="team-form-label" for="newTeamType">团队类型</label><select id="newTeamType" class="field" name="type">${TEAM_TYPE_OPTIONS.map(t=>`<option>${t}</option>`).join('')}</select><label class="team-form-label" for="newTeamDescription">团队简介</label><textarea class="field textarea" name="description" id="newTeamDescription" maxlength="160" placeholder="一句话说明团队的工作目标"></textarea><p class="team-form-subtitle">初始成员（可选） · 管理员 Ada 自动加入</p><div class="team-choice-group" style="gap:11px 14px">${memberOptions}</div><div class="team-modal-summary">创建后可以调整成员、关联项目与团队状态。这里仅保存到当前浏览器。</div><div class="team-error" id="teamCreateError" role="alert"></div><div class="modal-foot"><button class="secondary" type="button" data-team-action="close">取消</button><button class="primary" type="submit">创建团队</button></div></form>`,{wide:true})}
function teamEdit(id){const t=teamOf(id);if(!t)return;teamDialog('编辑团队',`<form id="teamEditForm" data-id="${id}"><label class="team-form-label" for="editTeamName">团队名称 *</label><input class="field" id="editTeamName" required maxlength="64" value="${escapeHtml(t.name)}"/><label class="team-form-label" for="editTeamType">团队类型</label><select class="field" id="editTeamType">${TEAM_TYPE_OPTIONS.map(o=>`<option ${o===t.type?'selected':''}>${o}</option>`).join('')}</select><label class="team-form-label" for="editTeamDesc">团队简介</label><textarea class="field textarea" id="editTeamDesc" maxlength="160">${escapeHtml(t.description)}</textarea><label class="team-form-label" for="editTeamStatus">团队状态</label><select class="field" id="editTeamStatus"><option ${t.status==='活跃'?'selected':''}>活跃</option><option ${t.status==='空闲'?'selected':''}>空闲</option></select><div class="team-error" id="teamEditError" role="alert"></div><div class="modal-foot"><button class="secondary" type="button" data-team-action="close">取消</button><button class="primary" type="submit">保存修改</button></div></form>`)}
function detailPane(t){const tab=teamUi.detailTab;const tabs=`<div class="team-choice-group" role="tablist" aria-label="团队详情"><button type="button" role="tab" data-team-action="detail-tab" data-tab="members" aria-selected="${tab==='members'}" aria-pressed="${tab==='members'}">成员 (${t.memberIds.length})</button><button type="button" role="tab" data-team-action="detail-tab" data-tab="projects" aria-selected="${tab==='projects'}" aria-pressed="${tab==='projects'}">关联项目 (${t.projectIds.length})</button><button type="button" role="tab" data-team-action="detail-tab" data-tab="access" aria-selected="${tab==='access'}" aria-pressed="${tab==='access'}">权限</button></div>`;
 let body='';if(tab==='members')body=`<div class="team-plain-table"><table style="min-width:430px"><thead><tr><th>成员</th><th>身份</th><th>操作</th></tr></thead><tbody>${t.memberIds.map(id=>{const m=memberOf(id);const role=t.roles[id]||'成员';return `<tr><td><span class="team-mini-avatar">${escapeHtml(m?.name[0]||'?')}</span>${escapeHtml(m?.name||'成员')}</td><td><span class="team-role-pill">${escapeHtml(role)}</span></td><td><span class="team-member-controls"><select data-team-role="${id}" data-team-id="${t.id}" aria-label="调整 ${escapeHtml(m?.name||'成员')} 的角色">${['管理员','成员','访客'].map(x=>`<option ${x===role?'selected':''}>${x}</option>`).join('')}</select><button type="button" data-team-action="remove-member" data-id="${t.id}" data-mid="${id}">移除</button></span></td></tr>`}).join('')}</tbody></table></div>`;else if(tab==='projects')body=`<div class="team-plain-table"><table style="min-width:380px"><thead><tr><th>项目编号</th><th>协作状态</th></tr></thead><tbody>${t.projectIds.map(id=>`<tr><td>项目 #${id}</td><td>已关联（演示关系）</td></tr>`).join('')||'<tr><td colspan="2">暂未关联项目</td></tr>'}</tbody></table></div><p class="team-field-help">项目编号是演示占位，不代表已经关联真实项目数据。</p>`;else body=`<div class="team-type-guide"><h4>团队权限规则</h4><p>管理员可管理团队资料、成员和邀请；成员可参与团队工作；访客仅有基本查看权限。</p><p style="margin-top:9px">调整成员角色会更新当前原型状态，不涉及服务端权限。</p></div>`;
 return tabs+body}
function teamDetails(id){const t=teamOf(id);if(!t)return;teamUi.detailId=t.id;teamUi.menuId=null;teamDialog(t.name,`<div style="display:flex;gap:14px;align-items:center">${teamIdentity(t)}<div><strong style="font-size:16px">${escapeHtml(t.name)}</strong><p class="team-modal-info">${escapeHtml(t.description)}</p><div class="team-badges"><span class="team-type">${escapeHtml(t.type)}</span><span class="team-status ${t.archived?'archived':t.status==='空闲'?'idle':''}">${t.archived?'已归档':t.status}</span></div></div></div><div id="teamDetailPane">${detailPane(t)}</div><div class="modal-foot"><button class="secondary" data-team-action="edit" data-id="${t.id}">编辑资料</button><button class="secondary" data-team-action="add-member" data-id="${t.id}" ${t.archived?'disabled':''}>添加成员</button><button class="primary" data-team-action="invite" data-id="${t.id}" ${t.archived?'disabled':''}>邀请成员</button></div>`,{wide:true})}
function addTeamMemberDialog(id){const t=teamOf(id);if(!t)return;const available=teamData.members.filter(m=>!t.memberIds.includes(m.id));if(!available.length){toast('现有成员已全部加入，可通过邀请增加新成员');return}teamDialog('添加现有成员',`<form id="teamAddMemberForm" data-id="${id}"><label class="team-form-label" for="addMemberSelect">选择成员</label><select class="field" id="addMemberSelect">${available.map(m=>`<option value="${m.id}">${escapeHtml(m.name)} · ${escapeHtml(m.email)}</option>`).join('')}</select><label class="team-form-label" for="addMemberRole">团队角色</label><select class="field" id="addMemberRole"><option>成员</option><option>管理员</option><option>访客</option></select><div class="modal-foot"><button class="secondary" type="button" data-team-action="details" data-id="${id}">取消</button><button class="primary" type="submit">添加到团队</button></div></form>`)}
function teamInvite(id){const eligible=allLiveTeams(),selected=Number(id)||eligible[0]?.id;if(!eligible.length){toast('请先创建团队');openTeamCreate();return}const t=teamOf(selected);teamDialog('邀请成员',`<form id="teamInviteForm"><label class="team-form-label" for="inviteTeam">所属团队</label><select class="field" name="teamId" id="inviteTeam">${eligible.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select><label class="team-form-label" for="teamInviteEmail">成员邮箱 *</label><input id="teamInviteEmail" class="field" required type="email" autocomplete="email" placeholder="name@example.com" maxlength="150"/><label class="team-form-label" for="teamInviteRole">邀请角色</label><select id="teamInviteRole" class="field"><option>成员</option><option>访客</option><option>管理员</option></select><p class="team-modal-summary">演示模式：此操作只会创建一条本地邀请记录，不会发送邮件或授予真实权限。</p><div class="team-error" id="teamInviteError" role="alert"></div><div class="modal-foot"><button type="button" class="secondary" data-team-action="close">取消</button><button type="submit" class="primary">记录邀请</button></div></form>`)}
function archiveTeam(id){const t=teamOf(id);if(!t||t.archived)return;teamDialog('归档团队',`<p class="team-modal-info">确定归档「${escapeHtml(t.name)}」吗？归档后默认列表将隐藏该团队。成员资料不会删除，你可以勾选“包含已归档”随时恢复。</p><div class="modal-foot"><button class="secondary" data-team-action="close">返回</button><button class="primary team-danger-btn" data-team-action="confirm-archive" data-id="${id}">确认归档</button></div>`)}
function confirmRemoveMember(id,mid){const t=teamOf(id),m=memberOf(mid);if(!t||!m)return;if((t.roles[mid]||'成员')==='管理员'&&t.memberIds.filter(k=>t.roles[k]==='管理员').length<=1){toast('至少保留一位管理员，无法移除最后的管理员');return}teamDialog('移除成员',`<p class="team-modal-info">从「${escapeHtml(t.name)}」移除 ${escapeHtml(m.name)}？其他团队中的成员身份不会改变。</p><div class="modal-foot"><button class="secondary" data-team-action="details" data-id="${id}">取消</button><button class="primary team-danger-btn" data-team-action="confirm-remove-member" data-id="${id}" data-mid="${mid}">确认移除</button></div>`)}
function teamHelp(){teamDialog('如何管理团队',`<div class="team-type-guide"><h4>1. 创建团队</h4><p>填写名称、类型和说明，管理员会默认加入。可以一次选入常用成员。</p><h4>2. 分配角色</h4><p>在团队详情中修改成员身份；最后一位管理员不能被移除或降级。</p><h4>3. 邀请成员</h4><p>原型将邀请记录留在本机，不会实际发信。邀请记录可查看与取消。</p><h4>4. 归档与恢复</h4><p>归档不会删除成员资料；勾选“包含已归档”后可恢复。</p><p class="team-modal-summary">这是验证体验的单文件原型：没有连接正式服务端。不同设备和浏览器之间的数据不会同步。</p></div><div class="modal-foot"><button class="primary" data-team-action="close">知道了</button></div>`,{wide:true})}
function showMemberDetails(mid){const m=memberOf(mid);if(!m)return;const ts=allLiveTeams().filter(t=>t.memberIds.includes(mid));teamDialog(m.name,`<div class="team-modal-info">邮箱：${escapeHtml(m.email)}</div><div class="team-plain-table" style="margin-top:13px"><table style="min-width:360px"><thead><tr><th>所属团队</th><th>角色</th></tr></thead><tbody>${ts.map(t=>`<tr><td><button data-team-action="details" data-id="${t.id}">${escapeHtml(t.name)}</button></td><td>${escapeHtml(t.roles[mid]||'成员')}</td></tr>`).join('')}</tbody></table></div><div class="modal-foot"><button class="primary" data-team-action="close">完成</button></div>`,{wide:true})}
function downloadTeamExport(){const content=JSON.stringify({exportedAt:new Date().toISOString(),note:'AragonTeam local demo data, not production records',...teamData},null,2);const blob=new Blob([content],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='aragonteam-team-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('已导出演示数据')}
function teamResetDialog(){teamDialog('恢复初始数据',`<p class="team-modal-info">此操作会覆盖本机的全部团队演示更改（含邀请和自建团队）。建议先导出备份。</p><div class="modal-foot"><button class="secondary" data-team-action="close">取消</button><button class="primary team-danger-btn" data-team-action="confirm-reset">确认恢复</button></div>`)}
const teamActions={
 'create':()=>openTeamCreate(),'close':()=>closeModal(),'help':()=>teamHelp(),'details':el=>teamDetails(el.dataset.id),'edit':el=>teamEdit(el.dataset.id),'invite':el=>teamInvite(el.dataset.id),
 'toggle-menu':el=>{const id=Number(el.dataset.id);teamUi.menuId=teamUi.menuId===id?null:id;repaintTeamResults()},
 'archive':el=>archiveTeam(el.dataset.id),'restore':el=>{const t=teamOf(el.dataset.id);if(!t)return;t.archived=false;persistTeams();teamUi.menuId=null;renderTeamSection();toast('团队已恢复')},
 'confirm-archive':el=>{const t=teamOf(el.dataset.id);if(!t)return;t.archived=true;teamUi.menuId=null;persistTeams();closeModal();renderTeamSection();toast('团队已归档，可从“包含已归档”恢复')},
 'clear-search':()=>{teamUi.query='';searchText='';$('#search').value='';const q=$('#teamQuery');if(q){q.value='';q.focus()}repaintTeamResults()},
 'reset-filters':()=>resetTeamFilters(),
 'detail-tab':el=>{teamUi.detailTab=el.dataset.tab;const t=teamOf(teamUi.detailId);if(t)$('#teamDetailPane').innerHTML=detailPane(t)},
 'add-member':el=>addTeamMemberDialog(el.dataset.id),
 'remove-member':el=>confirmRemoveMember(Number(el.dataset.id),Number(el.dataset.mid)),

$('#modalContainer').addEventListener('submit',e=>{
 const f=e.target;if(!['teamCreateForm','teamEditForm','teamInviteForm','teamAddMemberForm'].includes(f.id))return;
 e.preventDefault();

 }
 if(f.id==='teamInviteForm'){

 }
});
// Escape/backdrop behavior is shared with existing project dialogs; prevent focus from leaving active team modal.

function rdDetailMarkup(t){const opts=RD_STATUS.map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('');return `<div class="rd-detail-mask" id="rdDetailMask"><aside class="rd-detail" role="dialog" aria-modal="true" aria-label="${rdSafe(t.title)}" tabindex="-1"><div class="rd-detail-header"><div><span class="rd-pill blue">${t.type==='需求'?'REQ':'BUG'}-${t.id}</span><span class="rd-pill gray">${rdSafe(rdProjectName(t.projectId))}</span><h2>${rdSafe(t.title)}</h2></div><button class="rd-close" data-rd="close-detail" aria-label="关闭任务详情">×</button></div><div class="rd-dl"><div class="rd-field"><label for="rdStatus">阶段</label><select class="rd-select" id="rdStatus" data-id="${t.id}">${opts}</select></div><div class="rd-field"><label for="rdPriority">优先级</label><select class="rd-select" id="rdPriority" data-id="${t.id}">${['高','中','低'].map(s=>`<option ${t.priority===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="rd-field"><label for="rdOwner">阶段负责人</label><select class="rd-select" id="rdOwner" data-id="${t.id}">${[...new Set([...rd.tasks.map(x=>x.owner),'Ada'])].map(s=>`<option ${t.owner===s?'selected':''}>${rdSafe(s)}</option>`).join('')}</select></div><div class="rd-field"><label for="rdDue">截止日期</label><input class="rd-input" id="rdDue" data-id="${t.id}" type="date" value="${rdSafe(t.due)}"/></div></div><div class="rd-field"><label for="rdPlan">所属计划</label><select class="rd-select" id="rdPlan" data-id="${t.id}">${['未归属','当前迭代','下个迭代','待排期'].map(s=>`<option ${t.plan===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="rd-field"><label for="rdDescription">任务说明 / 完成标准</label><textarea class="rd-input" id="rdDescription" data-id="${t.id}" maxlength="800">${rdSafe(t.description)}</textarea></div><div class="rd-section"><h3>项目 Agent</h3><div class="rd-note">指定 1 个主 Agent、可选协作 Agent。界面仅演示指派关系，不会向真实 Agent 下发任务。</div><div class="rd-agent-compact"><div><strong>主 Agent</strong><div class="rd-muted">${rdSafe(rdAgent(t.agent)?.name||'未指派')}</div></div><button class="rd-btn" data-rd="pick-agents" data-id="${t.id}">${t.agent?'重新指派':'指派 Agent'}</button></div><div class="rd-agent-compact"><div><strong>协作 Agent</strong><div class="rd-muted">${t.collabs.map(id=>rdAgent(id)?.name).filter(Boolean).map(rdSafe).join('、')||'暂无协作 Agent'}</div></div></div><div class="rd-inline-actions" style="margin-top:12px"><button class="rd-btn ghost" data-rd="agent-suggest" data-id="${t.id}">✧ 分析需求</button><button class="rd-btn ghost" data-rd="agent-suggest" data-id="${t.id}">✧ 生成方案</button><button class="rd-btn ghost" data-rd="agent-suggest" data-id="${t.id}">✧ 拆分任务</button></div><div class="rd-section"><h3>快速讨论 <span class="rd-muted">(${t.comments.length})</span></h3><div id="rdComments">${t.comments.map(c=>`<div class="rd-comment"><strong>${rdSafe(c.author)}</strong><small>${rdSafe(c.time)}</small><p>${rdSafe(c.text)}</p></div>`).join('')||'<div class="rd-note">还没有讨论。可以留下进展、问题或验收说明。</div>'}</div><form id="rdCommentForm" class="rd-comment-form"><textarea class="rd-input" id="rdCommentText" maxlength="300" placeholder="记录进展或提出问题…" required aria-label="讨论内容"></textarea><button class="rd-btn primary" type="submit">发送</button></form><div class="rd-subhint">Ctrl / ⌘ + Enter 快速发送 · 内容仅存本机</div></div><div class="rd-section"><h3>关联 BUG / 文档</h3><div class="rd-note">${rdSafe(t.type==='需求'?'可在 BUG 看板追踪相关缺陷，在文档中查看研发规范。':'可在需求看板查看对应需求，在文档中追踪修复说明。')}</div><div class="rd-inline-actions" style="margin-top:10px"><button class="rd-btn ghost" data-rd="goto-related" data-sub="${t.type==='需求'?'BUG看板':'需求看板'}">查看${t.type==='需求'?'BUG':'需求'}</button><button class="rd-btn ghost" data-rd="goto-related" data-sub="文档">查看文档</button></div></div></aside></div>`}

rPrimary)?.name||'未指定')} · 协作 Agent ${rdUi.pickerCollabs.length} 个</div><div class="modal-foot"><button class="rd-btn ghost" data-rd="close-picker">取消</button><button class="rd-btn primary" data-rd="save-picker">确认指派</button></div></section></div>`;rdRoot().insertAdjacentHTML('beforeend',html);rdRoot().querySelector('#rdAgentPickMask [role="dialog"]')?.focus()}

function rdSimpleContent(){const cat=sub;const list=cat==='文档'?rd.docs.filter(d=>!rdUi.project||d.projectId===Number(rdUi.project)):cat==='建议'?rd.ideas.filter(d=>!rdUi.project||d.projectId===Number(rdUi.project)):[];const query=searchText.toLocaleLowerCase();const filtered=list.filter(v=>(v.name||v.title||'').toLocaleLowerCase().includes(query));let inner='';if(cat==='文档'){inner=`<div class="rd-entity-grid">${filtered.map(d=>`<article class="rd-panel rd-entity"><span class="rd-pill blue">▤ 文档</span><h3>${rdSafe(d.name)}</h3><p>${rdSafe(d.content.slice(0,90))}</p><div class="rd-entity-actions"><button class="rd-btn ghost" data-rd="doc-open" data-id="${d.id}">查看 / 编辑</button></div></article>`).join('')||'<div class="rd-zero">没有匹配的文档</div>'}</div>`}else if(cat==='代码仓'){inner=`<div class="rd-panel" style="padding:22px"><h3 style="margin:0 0 12px">代码仓</h3><p class="rd-muted">用一个入口快速查看仓库概况、分支与提交记录。这里是前端交互示意，不连接 Git。</p><div class="rd-entity-grid"><div class="rd-panel rd-entity"><span class="rd-pill blue">主分支</span><h3>main</h3><p>用于稳定版本 · 变更先通过审核</p><button class="rd-btn ghost" data-rd="code-info">查看分支说明</button></div><div class="rd-panel rd-entity"><span class="rd-pill green">工作分支</span><h3>feature / research</h3><p>开发中的任务与代码协作</p><button class="rd-btn ghost" data-rd="code-info">查看近期提交</button></div></div><div class="rd-note" style="margin-top:16px">研发版真实仓库权限、PR/CI 状态未被验证；此处不展示虚构的提交记录。</div></div>`}else if(cat==='建议'){inner=`<div class="rd-entity-grid">${filtered.map(i=>`<article class="rd-panel rd-entity"><span class="rd-pill ${i.status==='已采纳'?'green':'orange'}">${rdSafe(i.status)}</span><h3>${rdSafe(i.title)}</h3><p>${rdSafe(rdProjectName(i.projectId))} · ${i.votes} 人支持（演示）</p><div class="rd-entity-actions"><button class="rd-btn ghost" data-rd="upvote" data-id="${i.id}">♧ 支持 ${i.votes}</button></div></article>`).join('')||'<div class="rd-zero">尚无符合条件的建议</div>'}</div>`}else if(cat==='版本'){inner=`<div class="rd-entity-grid">${rd.updates.map(x=>`<article class="rd-panel rd-entity"><span class="rd-pill green">版本记录</span><h3>${rdSafe(x.name)}</h3><small>${rdSafe(x.date)}</small><p>${rdSafe(x.desc)}</p></article>`).join('')}</div><div class="rd-note" style="margin-top:16px">以上为设计演示数据，不代表线上已发布的实际版本。</div>`};const toolbar=['文档','建议'].includes(cat)?`<div class="rd-actionbar"><select class="rd-select" id="rdProjectSelect"><option value="0">全部项目</option>${projects.map(p=>`<option value="${p.id}" ${p.id===Number(rdUi.project)?'selected':''}>${rdSafe(p.name)}</option>`).join('')}</select><span class="rd-muted" style="font-size:12px">可通过顶部搜索栏查找${cat}</span></div>`:'';return `<div class="rd-page">${rdMobileNav()}${rdCrumb(cat)}${toolbar}${inner}</div>`}
function rdAgentView(){const a=rdAgent(rdUi.agentId)||rd.agents[0];const visible=rd.agents.filter(x=>`${x.name} ${x.role}`.toLocaleLowerCase().includes(searchText.toLocaleLowerCase()));const tabs=['Agent 范围配置','成员授权','使用策略','运行审计','配置模板'];const content=rdUi.agentTab==='Agent 范围配置'?`<div class="rd-agent-group"><div class="rd-statline"><div><strong>MCP 厂商选择</strong><div class="rd-muted" style="font-size:12px">选择可供 ${rdSafe(a.name)} 调用的 MCP 服务</div></div><span class="rd-pill orange">已选择 ${a.mcps.length} / ${RD_MCP.length}</span></div><div class="rd-picker-filter" style="margin-bottom:12px">${['全部','AI 大模型','开发工具','协同办公','云服务','设计工具','自动化'].map(x=>`<button class="${rdUi.mcpFilter===x?'active':''}" data-rd="mcp-filter" data-value="${x}">${x}</button>`).join('')}</div><div class="rd-provider-grid">${RD_MCP.filter(x=>rdUi.mcpFilter==='全部'||x[1]===rdUi.mcpFilter).map(([name,type])=>`<button class="rd-provider ${a.mcps.includes(name)?'active':''}" data-rd="toggle-mcp" data-value="${rdSafe(name)}" aria-pressed="${a.mcps.includes(name)}"><span><strong>${rdSafe(name)}</strong><small>${rdSafe(type)}</small></span><span class="rd-check">✓</span></button>`).join('')}</div></div><div class="rd-section rd-agent-group"><div class="rd-statline"><div><strong>Skill 能力勾选</strong><div class="rd-muted" style="font-size:12px">控制该 Agent 在演示中可用的工具能力</div></div><span class="rd-pill orange">已选择 ${a.skills.length} / ${RD_SKILL.length}</span></div><div class="rd-picker-filter" style="margin-bottom:12px">${['全部','信息获取','内容处理','数据与计算','协作与沟通','流程与自动化','其他'].map(x=>`<button class="${rdUi.skillFilter===x?'active':''}" data-rd="skill-filter" data-value="${x}">${x}</button>`).join('')}</div><div class="rd-provider-grid">${RD_SKILL.filter(x=>rdUi.skillFilter==='全部'||x[1]===rdUi.skillFilter).map(([name,type])=>`<button class="rd-provider ${a.skills.includes(name)?'active':''}" data-rd="toggle-skill" data-value="${rdSafe(name)}" aria-pressed="${a.skills.includes(name)}"><span><strong>${rdSafe(name)}</strong><small>${rdSafe(type)}</small></span><span class="rd-check">✓</span></button>`).join('')}</div></div>`:rdUi.agentTab==='成员授权'?`<div class="rd-note"><strong>成员授权 · 原型说明</strong><p>允许管理员为 Agent 设定可见范围，当前仅提供 UI 演示，不在客户端执行真实权限判定。</p></div><div class="rd-entity-grid" style="margin-top:15px">${['所有团队','指定团队','仅管理员'].map((x,i)=>`<label class="rd-panel rd-entity" style="min-height:94px"><span><input type="radio" name="rdScope" value="${x}" ${((a.scope||'所有团队')===x)?'checked':''}/> ${x}</span><small>上线后须由服务端强制鉴权</small></label>`).join('')}</div>`:rdUi.agentTab==='使用策略'?`<div class="rd-note"><h3>使用策略</h3><p>可按风险设定需要人工确认的 Agent 操作、调用限额和审计要求。</p></div><div class="rd-field" style="max-width:320px;margin-top:20px"><label>外部发布类动作</label><select class="rd-select" id="rdStrategy"><option ${!a.strategy||a.strategy==='始终需要人工确认'?'selected':''}>始终需要人工确认</option><option ${a.strategy==='仅管理员可确认'?'selected':''}>仅管理员可确认</option></select></div>`:rdUi.agentTab==='运行审计'?`<div class="rd-zero"><strong>暂无可显示的真实运行记录</strong>此原型不连接服务端，不伪造 Agent 执行成功或审计日志。</div>`:`<div class="rd-note"><h3>配置模板</h3><p>从常用能力组合快速开始，再逐项调整。</p></div><div class="rd-inline-actions" style="margin-top:14px"><button class="rd-btn ghost" data-rd="preset" data-value="研发">研发模板</button><button class="rd-btn ghost" data-rd="preset" data-value="文档">文档模板</button><button class="rd-btn ghost" data-rd="preset" data-value="数据">分析模板</button></div>`;return `<div class="rd-page">${rdCrumb('Agent 管理')}<div class="rd-agent-layout"><aside class="rd-panel rd-agent-list" aria-label="Agent 列表"><div class="rd-statline"><strong>已配置 Agent ${rd.agents.length} 个</strong><button class="rd-btn primary" data-rd="new-agent">+ 新建</button></div>${visible.map(x=>`<button class="rd-agent-list-entry ${x.id===a.id?'active':''}" data-rd="select-agent" data-id="${x.id}"><span class="rd-agent-avatar">✦</span><span style="min-width:0"><strong>${rdSafe(x.name)}</strong><small>${rdSafe(x.role)}</small><small>${rdSafe(x.status)}</small></span></button>`).join('')||'<div class="rd-zero">没有符合条件的 Agent</div>'}</aside><section class="rd-panel rd-agent-main"><div class="rd-statline"><div><h2 style="font-size:20px;margin:0">${rdSafe(a.name)} <span class="rd-pill ${a.status==='草稿'?'orange':'green'}">${rdSafe(a.status)}</span></h2><p class="rd-muted" style="margin:7px 0 0;font-size:12px">${rdSafe(a.role)}</p></div></div><div class="rd-tabs" role="tablist">${tabs.map(x=>`<button role="tab" aria-selected="${rdUi.agentTab===x}" class="${rdUi.agentTab===x?'active':''}" data-rd="agent-tab" data-value="${x}">${x}</button>`).join('')}</div>${content}<div class="rd-agent-bottom"><span class="rd-muted" style="font-size:12px;margin-right:auto">${a.mcps.length} 个 MCP · ${a.skills.length} 个 Skill</span><button class="rd-btn ghost" data-rd="test-agent">测试配置</button><button class="rd-btn ghost" data-rd="save-agent">保存配置</button><button class="rd-btn primary" data-rd="publish-agent">${a.status==='草稿'?'发布到团队':'更新发布'}</button></div></section></div></div>`}
function rdAgentTasks(){return `<div class="rd-page">${rdCrumb('智能体任务')}<div class="rd-panel" style="padding:20px"><h3 style="margin-top:0">Agent 协作任务</h3><p class="rd-muted">查看已经指派 Agent 的研发事项。点击任务进入同一详情抽屉。</p><div class="rd-table-wrap"><table class="rd-table"><thead><tr><th>任务</th><th>Agent</th><th>阶段</th><th>协作数</th></tr></thead><tbody>${rd.tasks.filter(t=>t.agent).map(t=>`<tr><td><button class="rd-link" data-rd="detail" data-id="${t.id}">${rdSafe(t.title)}</button></td><td>${rdSafe(rdAgent(t.agent)?.name||'—')}</td><td>${rdSafe(t.status)}</td><td>${t.collabs.length}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function rdAgentMarket(){return `<div class="rd-page">${rdCrumb('对话')}<div class="rd-entity-grid">${rd.agents.filter(a=>a.status==='已发布').map(a=>`<article class="rd-panel rd-entity"><span class="rd-agent-avatar">✦</span><h3>${rdSafe(a.name)}</h3><p>${rdSafe(a.role)}</p><span class="rd-pill green">已发布</span><div class="rd-entity-actions"><button class="rd-btn ghost" data-rd="open-agent" data-id="${a.id}">查看配置</button></div></article>`).join('')}</div></div>`}
const rdOriginalRender=render;
render=function(){if(area==='项目'&&sub!=='项目管理'){if(sub==='需求看板'||sub==='BUG看板'){rdSetHead(sub,'拖动思维，点击卡片即可查看详情与 Agent 协作',sub==='需求看板'?'新建需求':'新建 BUG');$('#content').innerHTML=rdBoard()}else{rdSetHead(sub,'聚焦当前工作内容，减少不必要操作',sub==='文档'?'新建文档':sub==='建议'?'新建建议':null);$('#content').innerHTML=rdSimpleContent()}return}if(area==='智能体'){rdSetHead(sub,sub==='智能体设置'?'配置可用能力、授权和发布策略':'查看和使用团队可用的智能体',sub==='智能体设置'?'新建 Agent':null);$('#content').innerHTML=sub==='智能体设置'?rdAgentView():sub==='智能体任务'?rdAgentTasks():rdAgentMarket();return}rdOriginalRender()};
const rdOriginalDetails=projectDetails;
projectDetails=function(id){rdOriginalDetails(id);const btn=$('#enterProject');if(btn){const old=btn.onclick;btn.onclick=()=>{rdUi.project=id;rdSave();old?.()}}};
const rdOriginalCreate=createProject;
$('#createBtn').onclick=()=>{if(area==='团队'){openTeamCreate();return}if(area==='项目'){if(sub==='项目管理')rdOriginalCreate();else if(sub==='需求看板'||sub==='BUG看板')rdCreateTask();else if(sub==='文档')rdCreateDocument();else if(sub==='建议')rdCreateIdea()}else if(area==='智能体'&&sub==='智能体设置')rdCreateAgent()};
function rdCreateDocument(){rdShowModal('新建文档',`<div class="rd-field"><label for="rdDocName">名称 *</label><input id="rdDocName" class="rd-input" required maxlength="80" placeholder="例如：验收清单"/></div><div class="rd-field"><label for="rdDocContent">正文</label><textarea id="rdDocContent" class="rd-input" maxlength="6000" placeholder="填写文档内容…"></textarea></div><div class="rd-note">编辑仅保存在本机原型，不会上传到研发服务器。</div>`,'rdCreateDocForm','创建文档')}
function rdCreateIdea(){rdShowModal('新建建议',`<div class="rd-field"><label for="rdIdeaTitle">建议内容 *</label><input id="rdIdeaTitle" class="rd-input" required maxlength="100" placeholder="例如：让看板过滤条件保留到下次进入"/></div><div class="rd-note">只在本地新增一条建议示例。</div>`,'rdCreateIdeaForm','提交建议')}
function rdCreateAgent(){rdShowModal('新建 Agent',`<div class="rd-field"><label for="rdAgentName">名称 *</label><input id="rdAgentName" class="rd-input" required maxlength="60" placeholder="例如：测试助手"/></div><div class="rd-field"><label for="rdAgentRole">用途描述</label><input id="rdAgentRole" class="rd-input" maxlength="100" placeholder="说明这个 Agent 擅长做什么"/></div>`,'rdCreateAgentForm','创建草稿')}
function rdEditDoc(id){const d=rd.docs.find(x=>x.id===Number(id));if(!d)return;rdShowModal('查看 / 编辑文档',`<div class="rd-field"><label for="rdDocName">名称 *</label><input id="rdDocName" class="rd-input" required maxlength="80" value="${rdSafe(d.name)}"/></div><div class="rd-field"><label for="rdDocContent">正文</label><textarea id="rdDocContent" class="rd-input" maxlength="6000">${rdSafe(d.content)}</textarea></div><input type="hidden" id="rdDocId" value="${d.id}"/>`,'rdEditDocForm','保存修改')}
function rdCloseForm(){rdRoot().querySelector('#rdFormMask')?.remove();rdUi.modal=null;rdUi.focusReturn?.isConnected&&rdUi.focusReturn.focus({preventScroll:true})}
function rdRerender(){render();if(rdUi.selectedTask)rdRefreshDetail()}
const rdHandlers={
 'go-sub':el=>{sub=el.dataset.sub;searchText='';$('#search').value='';rdUi.status='all';rdUi.priority='all';rdUi.owner='all';render()},
 'reset-filters':()=>{rdUi.status='all';rdUi.priority='all';rdUi.owner='all';searchText='';$('#search').value='';render()},
 'board-view':()=>{rdUi.view='board';render()},'list-view':()=>{rdUi.view='list';render()},
 'detail':el=>rdOpenDetail(el.dataset.id),'close-detail':()=>rdCloseDetail(),
 'pick-agents':el=>rdAgentChooser(el.dataset.id),
 'picker-filter':el=>{rdUi.pickerFilter=el.dataset.value;rdShowPicker()},
 'picker-main':el=>{const id=Number(el.dataset.id);rdUi.pickerPrimary=rdUi.pickerPrimary===id?null:id;rdUi.pickerCollabs=rdUi.pickerCollabs.filter(x=>x!==id);rdShowPicker()},
 'picker-collab':el=>{const id=Number(el.dataset.id);if(rdUi.pickerPrimary===id)return toast('主 Agent 无需重复选择为协作 Agent');if(rdUi.pickerCollabs.includes(id))rdUi.pickerCollabs=rdUi.pickerCollabs.filter(x=>x!==id);else if(rdUi.pickerCollabs.length<3)rdUi.pickerCollabs.push(id);else return toast('最多选择 3 个协作 Agent');rdShowPicker()},
 'close-picker':()=>rdRoot().querySelector('#rdAgentPickMask')?.remove(),
 'save-picker':()=>{const t=rdTask(rdUi.pickerTask);if(!t)return;if(rdUi.pickerPrimary && rdAgent(rdUi.pickerPrimary)?.status!=='已发布')return toast('主 Agent 需要先发布');if(rdUi.pickerCollabs.some(id=>rdAgent(id)?.status!=='已发布'))return toast('协作 Agent 需要先发布');t.agent=rdUi.pickerPrimary;t.collabs=rdUi.pickerCollabs;rdSave();rdRoot().querySelector('#rdAgentPickMask')?.remove();rdRerender();toast('本机 Agent 指派已保存')},
 'close-form':()=>rdCloseForm(),
 'agent-suggest':()=>toast('这是 Agent 操作入口演示；未连接真实模型，不生成虚构执行结果'),
 'goto-related':el=>{rdCloseDetail();sub=el.dataset.sub;rdUi.status='all';rdUi.priority='all';render()},
 'doc-open':el=>rdEditDoc(el.dataset.id),'code-info':()=>toast('真实 Git/PR/CI 数据需接入服务器后展示'),
 'upvote':el=>{const i=rd.ideas.find(t=>t.id===Number(el.dataset.id));if(i){i.votes++;rdSave();render();toast('已在本机记录支持')}} ,
 'select-agent':el=>{rdUi.agentId=Number(el.dataset.id);rdUi.agentTab='Agent 范围配置';render()},
 'agent-tab':el=>{rdUi.agentTab=el.dataset.value;render()},
 'mcp-filter':el=>{rdUi.mcpFilter=el.dataset.value;render()},'skill-filter':el=>{rdUi.skillFilter=el.dataset.value;render()},
 'toggle-mcp':el=>{const a=rdAgent(rdUi.agentId),v=el.dataset.value;if(!a)return;a.mcps=a.mcps.includes(v)?a.mcps.filter(x=>x!==v):[...a.mcps,v];rdSave();render()},
 'toggle-skill':el=>{const a=rdAgent(rdUi.agentId),v=el.dataset.value;if(!a)return;a.skills=a.skills.includes(v)?a.skills.filter(x=>x!==v):[...a.skills,v];rdSave();render()},
 'save-agent':()=>{rdSave();toast('Agent 配置已保存至本机（未同步服务器）')},
 'publish-agent':()=>{const a=rdAgent(rdUi.agentId);if(!a)return;if(!a.mcps.length||!a.skills.length)return toast('至少配置 1 个 MCP 和 1 个 Skill 才能进行发布演示');a.status='已发布';rdSave();render();toast('已更新本机发布状态（未对真实成员开放）')},
 'test-agent':()=>toast('当前仅为 UI 原型：不调用真实模型或 MCP 服务'),
 'preset':el=>{const a=rdAgent(rdUi.agentId);if(!a)return;const map={研发:[['OpenAI','GitHub'],['代码执行','API 调用','工作流编排']],文档:[['OpenAI','Notion'],['知识库检索','文件解析','OCR']],数据:[['DeepSeek','OpenAI'],['数据分析','表格处理']]};[a.mcps,a.skills]=map[el.dataset.value].map(x=>[...x]);rdSave();rdUi.agentTab='Agent 范围配置';render();toast('模板已应用到本机配置')},
 'new-agent':()=>rdCreateAgent(),
 'open-agent':el=>{area='智能体';sub='智能体设置';rdUi.agentId=Number(el.dataset.id);searchText='';$('#search').value='';render()}
};
$('#content').addEventListener('click',e=>{const el=e.target.closest('[data-rd]');if(!el)return;const f=rdHandlers[el.dataset.rd];if(f){e.preventDefault();f(el)}});
rdRoot().addEventListener('click',e=>{const el=e.target.closest('[data-rd]');if(el&&rdHandlers[el.dataset.rd]){e.preventDefault();rdHandlers[el.dataset.rd](el)}else if(e.target.id==='rdDetailMask')rdCloseDetail();else if(e.target.id==='rdAgentPickMask')rdHandlers['close-picker']();else if(e.target.id==='rdFormMask')rdCloseForm()});
$('#content').addEventListener('change',e=>{const el=e.target;if(el.id==='rdProjectSelect'){rdUi.project=Number(el.value);rdSave();render();return}const prop={rdStatusSelect:'status',rdPrioritySelect:'priority',rdOwnerSelect:'owner'}[el.id];if(prop){rdUi[prop]=el.value;render()}});
$('#content').addEventListener('change',e=>{if(e.target.name==='rdScope'){const a=rdAgent(rdUi.agentId);if(a){a.scope=e.target.value;rdSave();toast('Agent 授权范围已保存至本机')}}if(e.target.id==='rdStrategy'){const a=rdAgent(rdUi.agentId);if(a){a.strategy=e.target.value;rdSave();toast('Agent 使用策略已保存至本机')}}});
rdRoot().addEventListener('change',e=>{const el=e.target;const field={rdStatus:'status',rdPriority:'priority',rdOwner:'owner',rdDue:'due',rdPlan:'plan'}[el.id];const t=rdTask(el.dataset.id);if(field&&t){t[field]=el.value;rdSave();rdRerender();toast('任务已保存至本机')} });
rdRoot().addEventListener('focusout',e=>{if(e.target.id==='rdDescription'){const t=rdTask(e.target.dataset.id);if(t&&t.description!==e.target.value){t.description=e.target.value.trim();rdSave();toast('任务说明已保存至本机')}}});
rdRoot().addEventListener('input',e=>{if(e.target.id==='rdAgentSearch'){const pos=e.target.selectionStart;rdUi.pickerSearch=e.target.value;rdShowPicker();const x=$('#rdAgentSearch');x?.focus();x?.setSelectionRange(pos,pos)}});
rdRoot().addEventListener('submit',e=>{const f=e.target;e.preventDefault();if(f.id==='rdCommentForm'){const t=rdTask(rdUi.selectedTask),v=$('#rdCommentText')?.value.trim();if(!t||!v)return;t.comments.push({author:'Ada',time:new Date().toLocaleString('zh-CN'),text:v});rdSave();rdRefreshDetail();toast('讨论已记录在本机');return}if(f.id==='rdCreateTaskForm'){const title=$('#rdNewTitle')?.value.trim();if(!title)return;const type=sub==='BUG看板'?'BUG':'需求';const n=rd.nextTaskId++;const task={id:n,projectId:Number($('#rdNewProject').value),type,title,status:'新建',priority:$('#rdNewPriority').value,owner:'Ada',due:'',plan:'未归属',description:$('#rdNewDetail').value.trim(),agent:null,collabs:[],comments:[]};rd.tasks.unshift(task);rdUi.project=task.projectId;rdSave();rdCloseForm();render();rdOpenDetail(n);toast(`${type}已加入本机看板`);return}if(f.id==='rdCreateDocForm'){const name=$('#rdDocName').value.trim();if(!name)return;rd.docs.push({id:rd.nextDocId++,projectId:Number(rdUi.project)||1,name,type:'文档',content:$('#rdDocContent').value});rdSave();rdCloseForm();render();toast('文档已创建（本机）');return}if(f.id==='rdEditDocForm'){const d=rd.docs.find(x=>x.id===Number($('#rdDocId').value));if(d){d.name=$('#rdDocName').value.trim()||d.name;d.content=$('#rdDocContent').value;rdSave()}rdCloseForm();render();toast('文档已保存');return}if(f.id==='rdCreateIdeaForm'){const title=$('#rdIdeaTitle').value.trim();if(!title)return;rd.ideas.unshift({id:rd.nextIdeaId++,projectId:Number(rdUi.project)||1,title,votes:0,status:'待评估'});rdSave();rdCloseForm();render();toast('建议已记录在本机');return}if(f.id==='rdCreateAgentForm'){const name=$('#rdAgentName').value.trim();if(!name)return;if(rd.agents.some(a=>a.name.toLocaleLowerCase()===name.toLocaleLowerCase()))return toast('Agent 名称已存在');const id=Math.max(...rd.agents.map(a=>a.id),0)+1;rd.agents.push({id,name,role:$('#rdAgentRole').value.trim()||'自定义助手',status:'草稿',categories:['自定义'],mcps:[],skills:[]});rdUi.agentId=id;rdSave();rdCloseForm();render();toast('Agent 草稿已创建（本机）')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#rdAgentPickMask')){rdHandlers['close-picker']();e.stopImmediatePropagation();return}if($('#rdFormMask')){rdCloseForm();e.stopImmediatePropagation();return}if(rdUi.selectedTask){rdCloseDetail();e.stopImmediatePropagation();return}}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&document.activeElement?.id==='rdCommentText'){$('#rdCommentForm')?.requestSubmit()}const dlg=rdRoot().querySelector('#rdAgentPickMask [role="dialog"],#rdFormMask [role="dialog"],#rdDetailMask [role="dialog"]');if(e.key==='Tab'&&dlg){const arr=[...dlg.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])')].filter(x=>x.getClientRects().length);if(arr.length){if(e.shiftKey&&document.activeElement===arr[0]){e.preventDefault();arr.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===arr.at(-1)){e.preventDefault();arr[0].focus()}}}});
render();

</script>

function ux5Personal(){const all=rd.tasks;const pending=all.filter(t=>t.status!=='已完成');const mine=all.filter(t=>t.owner==='Ada');const high=pending.filter(t=>t.priority==='高');const bugs=all.filter(t=>t.type==='BUG'&&t.status!=='已完成');const finished=all.filter(t=>t.status==='已完成').length;const progress=Math.round(finished/(all.length||1)*100);const ready=ux5Tasks();const events=ux5Events();const buttons=[['pending',`待处理 ${pending.length}`],['mine',`与我有关 ${mine.length}`],['high',`高优先级 ${high.length}`],['all','全部事项']];const projOpts=projects.map(p=>`<option value="${p.id}" ${ux5.project===String(p.id)?'selected':''}>${uxText(p.name)}</option>`).join('');return `<section class="ux5-home"><div class="ux5-hello"><div><span class="ux-demo">个人工作台 · 本机演示</span><h2>下午好，Ada <span class="ux5-wave">✳</span></h2><p>查看需要你关注的事项，并快速回到正在进行的项目。</p></div><button class="ux-button primary" data-ux5="quick-task">＋ 新建需求</button></div><div class="ux5-stats">${[['待处理',pending.length,'orange','需要跟进的事项'],['与我有关',mine.length,'blue','负责人为 Ada'],['高优先级',high.length,'orange','尚未完成'],['本轮完成',finished,'green','示例数据完成项']].map(([name,num,col,desc])=>`<div class="ux5-stat"><span class="ux-tile ${col}">${col==='orange'?'▤':col==='blue'?'♙':'✓'}</span><div><p>${name}</p><strong>${num}</strong><small>${desc}</small></div></div>`).join('')}</div><div class="ux5-columns"><div class="ux5-left"><section class="ux-surface ux5-focus"><div class="ux5-sectiontop"><div><h3>待办聚焦 <span class="ux5-count">${ready.length} 项</span></h3><p>先处理重要的事，再处理其余工作</p></div><button class="ux-button" data-ux5="jump-board">打开需求看板 ›</button></div><div class="ux5-filterrow">${buttons.map(([id,label])=>`<button class="ux5-filter ${ux5.focus===id?'active':''}" data-ux5="focus" data-value="${id}" aria-pressed="${ux5.focus===id}">${label}</button>`).join('')}<span class="ux5-spacer"></span><select aria-label="筛选项目" data-ux5-change="project" class="ux-select"><option value="all">全部项目</option>${projOpts}</select><select aria-label="筛选类型" data-ux5-change="taskType" class="ux-select"><option value="all" ${ux5.taskType==='all'?'selected':''}>需求 + BUG</option><option value="需求" ${ux5.taskType==='需求'?'selected':''}>需求</option><option value="BUG" ${ux5.taskType==='BUG'?'selected':''}>BUG</option></select><select aria-label="排序" data-ux5-change="taskSort" class="ux-select"><option value="due" ${ux5.taskSort==='due'?'selected':''}>到期优先</option><option value="priority" ${ux5.taskSort==='priority'?'selected':''}>优先级优先</option><option value="new" ${ux5.taskSort==='new'?'selected':''}>最近创建</option></select></div>${ux5TaskTable(ready)}</section><section class="ux5-trends"><div class="ux5-sectiontop"><div><h3>交付概览</h3><p>根据当前本地演示事项计算</p></div><span class="ux-demo">非线上统计</span></div><div class="ux5-bars"><div><strong>需求事项</strong><span>${all.filter(t=>t.type==='需求').length}</span><div class="ux5-track"><i style="width:${Math.round(100*all.filter(t=>t.type==='需求').length/all.length)}%"></i></div></div><div><strong>BUG 事项</strong><span>${all.filter(t=>t.type==='BUG').length}</span><div class="ux5-track red"><i style="width:${Math.round(100*all.filter(t=>t.type==='BUG').length/all.length)}%"></i></div></div></div></section></div><aside class="ux5-right"><section class="ux-surface ux5-health"><div class="ux5-sectiontop"><h3>项目健康度</h3><button class="ux5-textlink" data-ux5="projects">查看项目 ›</button></div><div class="ux5-healthrow"><div class="ux5-ring" style="--pct:${progress}%"><div><strong>${progress}%</strong><small>事项完成率</small></div></div><div class="ux5-healthstats"><span><i class="green"></i>已完成 <b>${finished}</b></span><span><i class="blue"></i>进行中 <b>${all.filter(t=>t.status==='开发中'||t.status==='待验收').length}</b></span><span><i class="orange"></i>其他待处理 <b>${all.filter(t=>['新建','已搁置'].includes(t.status)).length}</b></span></div></div><p class="ux5-subnote">这里只是演示数据的完成比例，不代表真实项目风险评分。</p></section><section class="ux-surface ux5-activity"><div class="ux5-sectiontop"><h3>最近动态</h3><button class="ux5-textlink" data-ux5="notifications">查看全部 ›</button></div><div class="ux5-activitylist">${events.slice(0,6).map((e,i)=>`<button data-ux5="activity" data-id="${uxText(e.id)}" class="ux5-activity-item"><span class="ux5-dot ${i%3===0?'orange':i%3===1?'blue':'green'}"></span><span><strong>${uxText(e.title)}</strong><small>${uxText(e.detail)}</small></span><span class="ux5-arrow">›</span></button>`).join('')}</div></section></aside></div></section>`}
function ux5Notifications(){const list=ux5Events().filter(e=>ux5.noticeTab==='unread'?!ux5.read.includes(e.id):true);return `<section class="rd-page ux5-home"><div class="ux5-hello"><div><span class="ux-demo">消息仅为本机演示</span><h2>消息通知</h2><p>集中查看与你的项目、文档及 Agent 有关的动态。</p></div><button class="ux-button" data-ux5="mark-all-read">全部标记已读</button></div><div class="ux-surface ux5-notifications"><div class="ux5-filterrow"><button class="ux5-filter ${ux5.noticeTab==='all'?'active':''}" data-ux5="notice-tab" data-value="all">全部 ${ux5Events().length}</button><button class="ux5-filter ${ux5.noticeTab==='unread'?'active':''}" data-ux5="notice-tab" data-value="unread">未读 ${ux5Events().filter(e=>!ux5.read.includes(e.id)).length}</button></div>${list.map(e=>`<button class="ux5-notice ${ux5.read.includes(e.id)?'read':''}" data-ux5="activity" data-id="${uxText(e.id)}"><span class="ux5-unread"></span><span><strong>${uxText(e.title)}</strong><small>${uxText(e.detail)}</small></span><span>查看 ›</span></button>`).join('')||'<div class="ux5-empty">没有未读消息，所有事项都已处理。</div>'}</div></section>`}
function ux5Templates(){const data=UX5_TEMPLATES.filter(t=>ux5.templateFilter==='全部'||t.type===ux5.templateFilter);return `<section class="rd-page ux-workspace ux5-templates"><div class="ux-hero"><div class="ux-hero-leading"><span class="ux-tile orange">✦</span><div><h2>智能体模板</h2><p>从任务出发，不必从空白配置。选择模板，再调整能力。</p></div></div><button class="ux-button" data-ux5="settings">我的 Agent ›</button></div><div class="ux5-filterrow ux5-templatefilters">${['全部','研发','产品','知识','协作','数据'].map(x=>`<button class="ux5-filter ${ux5.templateFilter===x?'active':''}" data-ux5="template-filter" data-value="${x}">${x}</button>`).join('')}</div><div class="ux5-template-grid">${data.map(t=>`<article class="ux-surface ux5-template-card"><div class="ux5-template-top"><span class="ux-tile ${t.color}">${t.icon}</span><span class="ux-tag">${uxText(t.type)}场景</span></div><h3>${uxText(t.name)}</h3><p>${uxText(t.desc)}</p><div class="ux5-template-skills">${t.skills.slice(0,2).map(s=>`<span>${uxText(s)}</span>`).join('')}</div><button class="ux-button" data-ux5="template" data-value="${t.id}">查看模板与能力 <span>›</span></button></article>`).join('')}</div><div class="ux5-inline-note">模板仅生成本机的 Agent 草稿，不会实际调用第三方服务，也不会发布或消费模型额度。</div></section>`}
function ux5TemplateDialog(id){const t=UX5_TEMPLATES.find(t=>t.id===id);if(!t)return;uxDialog(`<div class="ux-dialogbar"><span class="ux-demo">智能体模板预览 · 本机演示</span><button class="ux-iconbtn" aria-label="关闭模板" data-ux="close">×</button></div><div class="ux5-template-details"><span class="ux-tile ${t.color}" style="width:76px;height:76px">${t.icon}</span><div><h2>${uxText(t.name)}</h2><p>${uxText(t.desc)}</p></div></div><div class="ux5-template-groups"><div><h3>建议使用的 MCP</h3><div class="ux-chips">${t.mcps.map(x=>`<span class="ux-tag blue">${uxText(x)}</span>`).join('')}</div></div><div><h3>建议具备的 Skills</h3><div class="ux-chips">${t.skills.map(x=>`<span class="ux-tag green">${uxText(x)}</span>`).join('')}</div></div></div><div class="ux5-inline-note">从模板创建后，默认是未发布的草稿；可前往「智能体设置」进一步调整权限与能力。</div><div class="ux-modal-foot"><button class="ux-button" data-ux="close">暂不使用</button><button class="ux-button primary" data-ux5="use-template" data-value="${t.id}">使用此模板创建草稿</button></div>`,{small:true,title:`${t.name} 模板`})}
function ux5UseTemplate(id){const t=UX5_TEMPLATES.find(t=>t.id===id);if(!t)return;const nextId=Math.max(0,...rd.agents.map(a=>a.id))+1;const name=t.name+' · 草稿';rd.agents.push({id:nextId,name,role:t.role,status:'草稿',categories:[t.type],mcps:[...t.mcps],skills:[...t.skills]});rdUi.agentId=nextId;rdUi.agentTab='Agent 范围配置';rdSave();uxClose();area='智能体';sub='智能体设置';render();toast('已根据模板创建草稿，可继续编辑（本机）')}
// Existing v4 project screen is preserved; augment the right column with non-production demonstration of usage.
const ux5ProjectOriginal=uxProject;
uxProject=function(id){ux5ProjectOriginal(id);const dialog=document.getElementById('uxOverlay');if(!dialog)return;const aside=dialog.querySelector('.ux-project-activity aside');if(aside&&!aside.querySelector('.ux5-token')){const el=document.createElement('section');el.className='ux-surface ux5-token';el.innerHTML=`<div class="ux5-sectiontop"><div><h3>Token 使用概览</h3><small>示例数据 · 最近 7 天</small></div><span class="ux-tag orange">UI 演示</span></div><div class="ux5-token-number"><strong>128,560</strong><span>↓ 12% <small>对比上周期</small></span></div><div class="ux5-token-bar"><span style="width:62%"></span><span style="width:18%"></span><span style="width:12%"></span><span style="width:8%"></span></div><div class="ux5-token-labels"><span>● Agent 对话 62%</span><span>● 代码生成 18%</span><span>● 文档分析 12%</span><span>● 其他 8%</span></div><button class="ux-button" data-ux5="tokens">查看明细 ›</button>`;aside.insertBefore(el,aside.firstChild)}};
function ux5TokenDialog(){uxDialog(`<div class="ux-dialogbar"><h2>Token 用量说明</h2><button class="ux-iconbtn" data-ux="close" aria-label="关闭">×</button></div><div class="ux5-inline-note">本页 128,560 tokens 与占比均为参照截图的视觉演示数据，未连接计费或日志，不支持下载真实审计记录。</div><div class="ux5-token-bar"><span style="width:62%"></span><span style="width:18%"></span><span style="width:12%"></span><span style="width:8%"></span></div><div class="ux5-token-labels"><span>Agent 对话 · 62%</span><span>代码生成 · 18%</span><span>文档分析 · 12%</span><span>其他 · 8%</span></div><div class="ux-modal-foot"><button class="ux-button primary" data-ux="close">知道了</button></div>`,{small:true,title:'Token 用量说明'})}
function ux5MobileTabs(){if(!['智能体','个人','设置'].includes(area))return '';return `<nav class="ux5-mobile-tabs" aria-label="${uxText(area)}页面导航">${menus[area].map(([name])=>`<button type="button" data-ux5="nav" data-value="${uxText(name)}" class="${sub===name?'active':''}" aria-current="${sub===name?'page':'false'}">${uxText(name)}</button>`).join('')}</nav>`}
const ux5PrevRender=render;
render=function(){if(area==='个人'){rdSetHead(sub,sub==='个人主页'?'你的工作重点、项目进度与协作动态':sub==='我的任务'?'按优先级查看与你有关的事项':'及时了解协作动态',null);$('#content').innerHTML=ux5MobileTabs()+(sub==='消息通知'?ux5Notifications():ux5Personal());return}if(area==='智能体'&&sub==='智能体模板'){rdSetHead(sub,'面向任务选择能力，而不是从空白开始',null);$('#content').innerHTML=ux5MobileTabs()+ux5Templates();return}ux5PrevRender();if(area==='智能体'&&sub==='对话'){$('#pageTitle').textContent='智能体';$('#pageSubtitle').textContent='与项目上下文连接的轻量协作入口'}if(area==='智能体'&&sub==='智能体设置'){$('#pageTitle').textContent='智能体设置'}if(area==='智能体'&&sub!=='智能体模板')$('#content').insertAdjacentHTML('afterbegin',ux5MobileTabs());};
const ux5Acts={
 'nav':el=>{sub=el.dataset.value;searchText='';$('#search').value='';render()},
 'focus':el=>{ux5.focus=el.dataset.value;ux5Save();render()},
 'reset-personal':()=>{ux5.focus='pending';ux5.project='all';ux5.taskType='all';searchText='';$('#search').value='';ux5Save();render()},
 'task':el=>rdOpenDetail(Number(el.dataset.id)),
 'activity':el=>{const found=ux5Events().find(x=>x.id===el.dataset.id);if(!found)return;ux5.read=[...new Set([...ux5.read,found.id])];ux5Save();if(found.taskId)rdOpenDetail(found.taskId);else if(found.sub==='文档')uxGo('项目','文档');else uxGo('智能体','智能体设置')},
 'quick-task':()=>{uxGo('项目','需求看板');rdCreateTask()},
 'jump-board':()=>uxGo('项目','需求看板'),
 'projects':()=>uxGo('项目','项目管理'),
 'notifications':()=>uxGo('个人','消息通知'),
 'mark-all-read':()=>{ux5.read=ux5Events().map(x=>x.id);ux5Save();render();toast('全部标记已读（本机）')},
 'notice-tab':el=>{ux5.noticeTab=el.dataset.value;ux5Save();render()},
 'template-filter':el=>{ux5.templateFilter=el.dataset.value;ux5Save();render()},
 'template':el=>ux5TemplateDialog(el.dataset.value),
 'use-template':el=>ux5UseTemplate(el.dataset.value),
 'settings':()=>uxGo('智能体','智能体设置'),
 'tokens':()=>ux5TokenDialog()
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-ux5]');if(!el)return;const handler=ux5Acts[el.dataset.ux5];if(handler){e.preventDefault();handler(el)}},true);
document.addEventListener('change',e=>{const name=e.target.dataset.ux5Change;if(name&&['project','taskType','taskSort'].includes(name)){ux5[name]=e.target.value;ux5Save();render()}});
// Existing search field remains global; personal task filtering reuses it.
render();

function ux6MakeTask(id){const c=ux6Channel(),m=c?.messages.find(x=>x.id===id);if(!m)return;uxDialog(`<div class="ux-dialogbar"><strong>将讨论整理为需求</strong><button class="ux-iconbtn" data-ux="close" aria-label="关闭">×</button></div><form class="ux6-modal-body" id="ux6TaskForm"><p>消息只是讨论；确认后才会在本机需求看板新增一条草稿。</p><label for="ux6TaskTitle">需求标题 *</label><input id="ux6TaskTitle" name="title" class="ux6-input" value="${ux6Safe(m.text.slice(0,40))}" maxlength="80" required/><label for="ux6TaskSummary">背景</label><textarea class="ux6-input" id="ux6TaskSummary" name="description" maxlength="800" rows="4">${ux6Safe(m.text)}</textarea><div class="ux6-modal-footer"><button type="button" class="ux6-btn" data-ux="close">取消</button><button type="submit" class="ux6-btn primary">创建需求草稿</button></div></form>`,{small:true,title:'转为需求'})}
function ux6CatalogView(){const skillMode=ux6.catalog==='skill';const rows=skillMode?UX6_SKILL_TEMPLATES:UX5_TEMPLATES;const categories=skillMode?['全部','项目管理','产品与研发','日常协作','数据分析']:['全部','研发','产品','知识','协作','数据'];const term=ux6.templateQuery.toLocaleLowerCase().trim();const visible=rows.filter(t=>(ux6.category==='全部'||t.category===ux6.category||t.type===ux6.category)&&(!term||`${t.name} ${t.desc} ${t.category||t.type} ${t.skills.join(' ')}`.toLocaleLowerCase().includes(term)));return `<section class="ux6-page ux6-catalog"><div class="ux6-catalog-banner"><div><span class="ux6-badge">从任务出发 · 模板仅供演示</span><h2>让每个 Agent 从合适的能力开始</h2><p>选角色或选技能组合；每个模板都可以预览，再创建本地草稿。</p></div><button class="ux6-btn" data-ux6="to-manager">查看我的 Agent →</button></div><div class="ux6-toolbar"><div class="ux6-tabrow" aria-label="模板类型"><button type="button" data-ux6="catalog-tab" data-value="agent" class="${!skillMode?'active':''}" aria-pressed="${!skillMode}">智能体模板</button><button type="button" data-ux6="catalog-tab" data-value="skill" class="${skillMode?'active':''}" aria-pressed="${skillMode}">Skill 模板</button></div><input class="ux6-input" id="ux6CatalogSearch" type="search" maxlength="80" value="${ux6Safe(ux6.templateQuery)}" placeholder="搜索模板名称、用途或技能…" aria-label="搜索模板"/></div><div class="ux6-toolbar"><div class="ux6-tabrow" aria-label="模板分类">${categories.map(k=>`<button type="button" data-ux6="catalog-category" data-value="${ux6Safe(k)}" class="${ux6.category===k?'active':''}" aria-pressed="${ux6.category===k}">${ux6Safe(k)}</button>`).join('')}</div><span class="ux6-catalog-result">共 ${visible.length} 个可选模板</span></div><div class="ux6-catalog-grid">${visible.map(t=>`<article class="ux6-catalog-card"><div class="ux6-catalog-card-head"><span class="ux6-catalog-logo ${ux6Safe(t.color)}">${ux6Safe(t.icon)}</span><div><span class="ux6-chip">${ux6Safe(t.type||t.category)}</span><h3>${ux6Safe(t.name)}</h3></div></div><p>${ux6Safe(t.desc)}</p><div class="ux6-catalog-tags">${t.skills.slice(0,3).map(s=>`<span>${ux6Safe(s)}</span>`).join('')}</div><button type="button" class="ux6-btn soft" data-ux6="catalog-preview" data-id="${ux6Safe(t.id)}">查看并使用 →</button></article>`).join('')||'<div class="ux6-empty">没有符合条件的模板。请清空搜索或切换分类。</div>'}</div><p class="ux6-visible-status">模板使用只会修改本浏览器的演示草稿，不执行 Skill、不会调用第三方 API。</p></section>`}
function ux6SkillPreview(id){const t=UX6_SKILL_TEMPLATES.find(x=>x.id===id);if(!t)return;const choices=rd.agents.map(a=>`<option value="${a.id}">${ux6Safe(a.name)}（${ux6Safe(a.status)}）</option>`).join('');uxDialog(`<div class="ux-dialogbar"><strong>Skill 模板预览</strong><button class="ux-iconbtn" data-ux="close" aria-label="关闭">×</button></div><form class="ux6-modal-body" id="ux6SkillForm"><span class="ux6-badge">${ux6Safe(t.category)}</span><h2>${ux6Safe(t.name)}</h2><p>${ux6Safe(t.desc)}</p><label>组合包含的 Skills</label><div class="ux6-catalog-tags">${t.skills.map(x=>`<span>${ux6Safe(x)}</span>`).join('')}</div><label for="ux6TargetAgent">将能力添加到</label><select id="ux6TargetAgent" class="ux6-select" name="agentId">${choices}</select><input type="hidden" name="templateId" value="${t.id}"/><p class="ux6-visible-status">仅添加到 Agent 的本地配置，不发布、不执行。需要时可在智能体管理里调整。</p><div class="ux6-modal-footer"><button type="button" class="ux6-btn" data-ux="close">取消</button><button type="submit" class="ux6-btn primary">添加到草稿配置</button></div></form>`,{small:true,title:'Skill 模板'})}

const ux6UseTemplatePrev=ux5UseTemplate;

function ux6Send(){const c=ux6Channel(),f=document.getElementById('ux6Message');const v=f?.value.trim();if(!c||!v)return;if(v.length>1600)return toast('单条消息最多 1600 字');c.messages.push({id:Date.now()+Math.floor(Math.random()*1000),who:'我',text:v,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});c.messages=c.messages.slice(-100);ux6Save();render();ux6ScrollEnd();document.getElementById('ux6Message')?.focus();toast('消息已保存在本机（未发送给真实成员）')}

document.addEventListener('click',e=>{const el=e.target.closest('[data-ux6]');if(!el)return;e.preventDefault();const action=el.dataset.ux6;
 if(action==='channel')return ux6ChangeChannel(Number(el.dataset.id));
 if(action==='new-group')return ux6NewGroup();
 if(action==='group-members')return ux6Members();
 if(action==='group-project'){const p=projects.find(x=>x.name===ux6Channel()?.project);uxGo('项目','项目管理',p?.id);if(p)uxProject(p.id);return}

 if(action==='group-docs'){const p=projects.find(x=>x.name===ux6Channel()?.project);return uxGo('项目','文档',p?.id)}
 if(action==='mention'){const i=document.getElementById('ux6Message');if(i){i.value+=(i.value?' ':'')+el.dataset.value+' ';i.focus()}return}
 if(action==='quote'){const m=ux6Channel()?.messages.find(x=>x.id===Number(el.dataset.id));const i=document.getElementById('ux6Message');if(m&&i){i.value=`> ${m.who}: ${m.text.slice(0,120)}\n\n`+i.value;i.focus()}return}

 if(action==='to-manager')return uxGo('智能体','智能体管理');
 if(action==='team-tab'){ux6.teamTab=el.dataset.value;ux6Save();render();return}
});
document.addEventListener('submit',e=>{const f=e.target;

 if(f.id==='ux6NewGroupForm'){e.preventDefault();const d=new FormData(f),name=String(d.get('name')||'').trim(),topic=String(d.get('topic')||'').trim(),project=String(d.get('project')||'').trim();if(!name)return;if(ux6.channels.some(c=>c.name.toLocaleLowerCase()===name.toLocaleLowerCase()))return toast('已有同名群聊');const id=Math.max(0,...ux6.channels.map(c=>c.id))+1;ux6.channels.push({id,name,topic:topic||'讨论项目进展和下一步行动',project,people:['Ada'],agents:[],messages:[]});ux6.channel=id;ux6Save();uxClose();render();toast('群聊已创建（本机）');return}

 if(f.id==='ux6TaskForm'){e.preventDefault();const d=new FormData(f),title=String(d.get('title')||'').trim(),description=String(d.get('description')||'').trim();if(!title)return;const c=ux6Channel(),project=projects.find(p=>p.name===c.project)||projects[0];rd.tasks.push({id:rd.nextTaskId++,type:'需求',title,description,status:'新建',priority:'中',owner:'Ada',projectId:project.id,due:'',plan:'未归属',agent:0,collabs:[],comments:[]});rdSave();uxClose();uxGo('项目','需求看板',project.id);toast('已创建需求草稿（仅本机）');return}
 if(f.id==='ux6SkillForm'){e.preventDefault();const d=new FormData(f),a=rd.agents.find(x=>x.id===Number(d.get('agentId'))),t=UX6_SKILL_TEMPLATES.find(x=>x.id===d.get('templateId'));if(!a||!t)return;a.skills=[...new Set([...(a.skills||[]),...t.skills])];rdUi.agentId=a.id;rdUi.agentTab='Agent 范围配置';rdSave();uxClose();uxGo('智能体','智能体管理');toast('技能组合已加入 Agent 配置（本机草稿）');return}
});
document.addEventListener('keydown',e=>{const id=e.target?.id;if(id==='ux6Message'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();e.target.closest('form')?.requestSubmit()}});

render();
