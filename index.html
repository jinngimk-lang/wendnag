<script id="arag-ux-v7-code">
/* AragonTeam v7 — frontend interaction ONLY; no network, mic/camera, recording or AI service. */
const V7_KEY='aragonteam.v7.ui';
function v7Fresh(){return {filter:'全部',roomMenu:false,side:'tasks',sideOpen:false,expandedRuns:[],systemOpen:false,meeting:null,meetingTab:'minutes',mic:false,camera:false,meetingMessages:[],meetingActionsDone:[],confirmEnd:false,profile:{name:'Ada',job:'团队管理员 · 项目协作者',email:'',phone:'',mobile:'',location:'',bio:'负责跨团队协作与项目推进',status:'专注工作',language:'简体中文',notify:true,agentNotify:true}}}
function v7Load(){try{let x=JSON.parse(localStorage.getItem(V7_KEY)||'null');if(!x||typeof x!=='object')return v7Fresh();const d=v7Fresh();return {...d,...x,profile:{...d.profile,...(x.profile||{})},expandedRuns:Array.isArray(x.expandedRuns)?x.expandedRuns:[],meetingMessages:Array.isArray(x.meetingMessages)?x.meetingMessages:[]}}catch{return v7Fresh()}}
let v7=v7Load();
function v7Save(){try{localStorage.setItem(V7_KEY,JSON.stringify(v7))}catch{toast('当前浏览器无法保存，本轮操作仅在页面内有效')}}
function v7Safe(s){return uxText(s==null?'':String(s))}
function v7Project(c){return projects.find(p=>p.name===c?.project)}
function v7Tasks(c){const p=v7Project(c);return p?rd.tasks.filter(t=>Number(t.projectId)===Number(p.id)).slice(0,8):[]}
function v7Tag(status){return status==='已完成'?'green':status==='开发中'?'orange':'blue'}
function v7Switch(){const c=ux6Channel();return `<div class="v7-room-switch"><button type="button" class="v7-outline" data-v7="toggle-rooms" aria-expanded="${!!v7.roomMenu}" aria-controls="v7RoomMenu"># ${v7Safe(c?.name||'选择房间')} ⌄</button>${v7.roomMenu?`<div class="v7-room-menu" id="v7RoomMenu" role="group" aria-label="选择群聊">${ux6.channels.map(g=>`<button type="button" class="${c?.id===g.id?'active':''}" data-v7="choose-room" data-id="${g.id}"># ${v7Safe(g.name)}<small>${v7Safe(g.project||'未关联项目')} · ${g.messages.length} 条讨论</small></button>`).join('')}<button type="button" data-v7="create-room">＋ 新建群聊</button></div>`:''}</div>`}
function v7DemoEvents(c){const project=c.project||'当前项目';return [
{id:'agent-'+c.id,kind:'Agent',who:'代码检查助手',time:'14:32',text:`已完成 ${project} 的模拟检查，3 项问题待人工确认。`,type:'run'},
{id:'system-'+c.id,kind:'系统',who:'系统',time:'14:20',text:'演示：项目需求状态更新为进行中，等待开发确认。'},
{id:'agent-summary-'+c.id,kind:'Agent',who:'文档助手',time:'14:12',text:'已整理项目讨论摘要草稿，可在文档页继续编辑。'},
{id:'system-2-'+c.id,kind:'系统',who:'系统',time:'13:58',text:'演示：成员加入项目房间。'}];}
function v7Feed(c){const all=[...c.messages.map(x=>({...x,kind:'讨论',type:'message'})),...v7DemoEvents(c)];const q=(searchText||'').trim().toLowerCase();let filtered=all.filter(x=>(v7.filter==='全部'||x.kind===v7.filter)&&(!q||`${x.who} ${x.text}`.toLowerCase().includes(q)));if(!v7.systemOpen&&v7.filter==='全部')filtered=filtered.filter(e=>e.kind!=='系统');return filtered.map(e=>{
const isAgent=e.kind==='Agent',isSys=e.kind==='系统',mine=e.who==='我',isRun=e.type==='run';
return `<article class="v7-feed-item ${mine?'mine':''}"><span class="v7-feed-avatar ${isAgent?'':isSys?'system':'user'}">${isAgent?'✦':isSys?'◆':v7Safe(e.who.slice(0,1))}</span><div class="v7-feed-content"><div class="v7-feed-author"><strong>${v7Safe(e.who)}</strong><span class="v7-pill ${isAgent?'green':isSys?'':'orange'}">${isAgent?'Agent':isSys?'系统':'成员'}</span><small>${v7Safe(e.time||'刚刚')} · 演示</small></div>${isRun?`<div class="v7-run-card"><strong>代码检查 · 结果待确认</strong><div class="v7-feed-bubble">${v7Safe(e.text)}</div><button type="button" class="v7-outline" data-v7="run-expand" data-id="${v7Safe(e.id)}" aria-expanded="${v7.expandedRuns.includes(e.id)}" style="margin-top:9px">${v7.expandedRuns.includes(e.id)?'收起步骤':'查看执行步骤'} ↗</button>${v7.expandedRuns.includes(e.id)?'<div class="v7-run-step">① 扫描变更范围（模拟）<br>② 汇总潜在问题（模拟）<br>③ 等待人工确认后进入需求/BUG 看板</div>':''}</div>`:`<div class="v7-feed-bubble">${v7Safe(e.text)}</div>`}${e.type==='message'?`<div class="v7-message-actions"><button type="button" data-ux6="quote" data-id="${e.id}">引用</button><button type="button" data-v7="reply" data-id="${e.id}">回复</button><button type="button" data-ux6="make-task" data-id="${e.id}">转为需求</button></div>`:''}</div></article>`}).join('')||'<div class="v7-empty">没有匹配的动态。可切换筛选，或发送第一条讨论。</div>'}
function v7Side(c){const p=v7Project(c);const tasks=v7Tasks(c);return `<aside class="v7-right ${v7.sideOpen?'is-open':''}" id="v7Side" aria-label="房间成员及任务"><div class="v7-right-title"><strong>房间信息</strong><button type="button" class="v7-outline v7-side-close" data-v7="close-side">关闭 ✕</button></div><div class="v7-room-tabs" role="group" aria-label="房间详情切换"><button type="button" class="${v7.side==='tasks'?'active':''}" data-v7="side-tab" data-value="tasks">当前任务 ${tasks.length}</button><button type="button" class="${v7.side==='members'?'active':''}" data-v7="side-tab" data-value="members">参与者 ${c.people.length+c.agents.length}</button></div>${v7.side==='members'?`<div class="v7-right-section"><div class="v7-right-title"><strong>团队成员 / Agent</strong><button class="v7-outline" data-ux6="group-members">管理</button></div>${[...c.people.map(n=>[n,'成员']),...c.agents.map(n=>[n,'Agent'])].map(([n,t])=>`<div class="v7-member"><span class="v7-circle ${t==='Agent'?'agent':''}">${t==='Agent'?'✦':v7Safe(n[0])}</span><strong>${v7Safe(n)}</strong><span class="v7-member-role">${t}</span></div>`).join('')}</div>`:`<div class="v7-right-section"><div class="v7-right-title"><strong>${v7Safe(p?.name||'当前房间')} · 待跟进</strong></div>${tasks.length?tasks.slice(0,5).map(t=>`<button class="v7-task-row" type="button" data-v7="open-task" data-id="${t.id}"><span class="v7-task-title">#${t.id} ${v7Safe(t.title)}</span><span class="v7-task-sub"><span class="v7-pill ${v7Tag(t.status)}">${v7Safe(t.status)}</span> · ${v7Safe(t.owner||'未分配')} ${t.due?'· '+v7Safe(t.due):''}</span></button>`).join(''):'<div class="v7-empty">当前房间暂无关联任务。</div>'}<button class="v7-outline" data-v7="go-board" ${p?'':'disabled'} style="margin-top:12px">查看需求看板 ↗</button></div>`}</aside>`}
// v6 group chat is retained as data/behaviour foundation; only its presentation changes.
ux6GroupView=function(){const c=ux6Channel();if(!c)return '<p class="v7-empty">暂无群聊。点击新建群聊开始讨论。</p>';const p=v7Project(c);return `<div class="v7-shell"><div class="v7-room-header"><div class="v7-header-first"><div class="v7-room-identity"><span class="v7-room-icon">⌘</span><div><h2>${v7Safe(c.name)} <span class="v7-pill green">协作中 · 演示</span></h2><p>${v7Safe(c.topic)}</p></div></div><div class="v7-heading-actions">${v7Switch()}<button type="button" class="v7-outline" data-v7="open-side" data-value="members">成员 ${c.people.length+c.agents.length}</button><button type="button" class="v7-outline primary" data-v7="open-meeting">◉ 开始演示会议</button></div></div><div class="v7-room-details"><span>👥 人类 ${c.people.length} · Agent ${c.agents.length}</span><span>▧ 关联项目：${v7Safe(c.project||'未关联')}</span><span>团队协作与 Agent 动态同屏</span></div><div class="v7-room-resources">${p?`<button type="button" class="v7-outline" data-ux6="group-project">项目概览 ↗</button><button type="button" class="v7-outline" data-ux6="group-board">需求看板 ↗</button><button type="button" class="v7-outline" data-ux6="group-docs">项目文档 ↗</button><button type="button" class="v7-outline" data-v7="go-code">代码仓 ↗</button>`:'<span class="v7-pill">普通群聊 · 无关联项目</span>'}<button type="button" class="v7-outline" data-v7="open-side" data-value="tasks">当前任务 ↗</button></div></div><div class="v7-room-layout"><section class="v7-timeline-panel" aria-label="群聊讨论与项目动态"><div class="v7-timeline-bar"><strong>讨论与工作动态</strong><div class="v7-room-tabs" role="group" aria-label="动态筛选">${['全部','讨论','Agent','系统'].map(k=>`<button type="button" class="${v7.filter===k?'active':''}" data-v7="filter" data-value="${k}" aria-pressed="${v7.filter===k}">${k==='Agent'?'Agent 动态':k}</button>`).join('')}</div></div><div class="v7-feed" id="ux6ChatFeed" aria-live="polite">${v7Feed(c)}${v7.filter==='全部'?`<button type="button" class="v7-outline" data-v7="toggle-system" style="align-self:center">${v7.systemOpen?'收起系统动态':'查看系统动态 · 2 条'}</button>`:''}</div><form class="v7-composer" id="ux6ChatForm"><label class="sr-only" for="ux6Message">发送群聊讨论消息</label><textarea id="ux6Message" maxlength="1600" required placeholder="与成员和 Agent 讨论…　@ 可提及参与者"></textarea><div class="v7-composer-foot"><div class="v7-actions"><button class="v7-outline" type="button" data-v7="mention-picker">@ 提及</button><button class="v7-outline" type="button" data-ux6="group-members">管理成员</button><small>Enter 发送 · Shift+Enter 换行</small></div><button type="submit" class="v7-outline primary">发送讨论 →</button></div></form></section>${v7Side(c)}</div><p class="v7-demo-note">界面仅演示交互：不发送真实消息、不调用 Agent、不连接音视频或项目后台。</p></div>`};
function v7RefreshRoom(){render();if(area==='智能体'&&sub==='群聊')ux6ScrollEnd()}
function v7Mentions(){const c=ux6Channel();if(!c)return;const options=[...c.people.map(n=>[n,'成员']),...c.agents.map(n=>[n,'Agent'])];uxDialog(`<div class="ux-dialogbar"><strong>提及成员或 Agent</strong><button class="ux-iconbtn" type="button" data-ux="close">✕</button></div><p class="v7-demo-note">选择一位参与者，将 @名称 插入当前输入框，不会实际通知对方。</p><div class="v7-actions" style="margin:18px 0">${options.map(([n,t])=>`<button type="button" class="v7-outline" data-v7="mention-insert" data-value="${v7Safe(n)}">${t==='Agent'?'✦':'●'} ${v7Safe(n)}</button>`).join('')}</div>`,{small:true,title:'选择提及对象'})}
function v7MeetingModel(){const c=ux6Channel();const memberNames=[...c.people.map(n=>({name:n,kind:'人类'})),...c.agents.map(n=>({name:n,kind:'Agent'}))];return {c,memberNames:memberNames.slice(0,10)}}
function v7OpenMeeting(){if(!ux6Channel())return;v7.meeting=ux6Channel().id;v7.meetingTab='minutes';v7.confirmEnd=false;v7Save();v7DrawMeeting()}
function v7DrawMeeting(){if(!v7.meeting)return;const c=ux6.channels.find(x=>x.id===v7.meeting);if(!c)return;const members=[...c.people.map(n=>({name:n,kind:'成员'})),...c.agents.map(n=>({name:n,kind:'Agent'}))];const notes=['确认核心功能的开发进度','讨论质量问题与风险分工','确定下一迭代优先级','明确上线前的验收安排'];const tasks=[['整理本轮 UI 验收清单',c.people[0]||'Ada'],['检查关联需求的优先级',c.people[1]||'成员'],['准备文档与交付说明',c.agents[0]||'成员']];const chat=v7.meetingMessages.filter(x=>x.channel===c.id);
uxDialog(`<div class="v7-meeting"><div class="v7-meeting-top"><div><strong>◉ ${v7Safe(c.name)} · 演示会议</strong><p class="v7-demo-note">本机交互演示 · 无真实语音、视频、录制或 AI 纪要生成</p></div><button type="button" class="v7-outline" data-v7="meeting-exit" aria-label="关闭会议演示">关闭 ✕</button></div><div class="v7-meeting-body"><section class="v7-meeting-stage" aria-label="会议参与者"><div class="v7-meeting-person-grid">${members.map(m=>`<div class="v7-meeting-person"><div class="v7-meeting-avatar ${m.kind==='Agent'?'agent':''}">${m.kind==='Agent'?'✦':v7Safe(m.name[0])}</div><strong>${v7Safe(m.name)}</strong><small>${m.kind==='Agent'?'Agent · 演示参与者':'团队成员 · 演示参与者'}</small></div>`).join('')}<button type="button" class="v7-meeting-person" data-v7="meeting-invite"><div class="v7-meeting-avatar" style="background:#f4f5f9;color:#7383a0">＋</div><strong>邀请成员</strong><small>添加模拟参会者</small></button></div><div class="v7-meeting-rail"><button type="button" class="${!v7.mic?'active':''}" data-v7="meeting-mic">${v7.mic?'🎙 演示麦克风开':'🔇 演示已静音'}</button><button type="button" class="${!v7.camera?'active':''}" data-v7="meeting-camera">${v7.camera?'▣ 演示视频开':'▣ 演示视频关'}</button><button type="button" data-v7="meeting-share">共享屏幕</button><button type="button" data-v7="meeting-record">录制</button><button type="button" class="danger" data-v7="meeting-ask-end">结束会议</button></div></section><aside class="v7-meeting-aside"><div class="v7-meeting-tabs" role="group" aria-label="会议侧栏">${[['minutes','AI 纪要'],['chat','会议聊天'],['people','参会者']].map(([k,n])=>`<button type="button" data-v7="meeting-tab" data-value="${k}" class="${v7.meetingTab===k?'active':''}" aria-pressed="${v7.meetingTab===k}">${n}</button>`).join('')}</div><div class="v7-meeting-scroller">${v7.meetingTab==='minutes'?`<div class="v7-pill orange">示例纪要 · 非真实 AI 实时生成</div><h4>会议要点</h4><ul>${notes.map(x=>`<li>${x}</li>`).join('')}</ul><h4>行动项 (${tasks.length})</h4>${tasks.map(([title,owner],i)=>`<label><input type="checkbox" data-v7="meeting-action" data-id="${i}" ${v7. function v7ProfileView(){const p=v7.profile;const detail=[['邮箱',p.email||'未添加'],['电话',p.phone||'未添加'],['手机',p.mobile||'未添加'],['位置',p.location||'未添加'],['工作状态',p.status],['语言',p.language]];return `<div class="v7-profile"><div class="v7-profile-header"><div><h2>个人资料</h2><p>团队协作身份与常用偏好，保留最必要的信息。</p></div><button class="v7-outline primary" data-v7="profile-edit">✎ 编辑资料</button></div><div class="v7-profile-columns"><section class="v7-surface"><div class="v7-identity"><div class="v7-bigavatar">${v7Safe(p.name.slice(0,1)||'A')}</div><div><h3>${v7Safe(p.name)}</h3><p>${v7Safe(p.job)}</p><span class="v7-pill orange">管理员 · 演示身份</span></div></div><div class="v7-info-grid">${detail.map(([name,value])=>`<div class="v7-info-item"><small>${name}</small><strong>${v7Safe(value)}</strong></div>`).join('')}</div><div class="v7-right-section" style="margin-top:25px"><h3 class="v7-section-label">个人介绍</h3><p style="font-size:13px;color:#637596;line-height:1.7">${v7Safe(p.bio||'暂无介绍')}</p></div><div class="v7-worklink"><button class="v7-outline" data-v7="profile-work">返回我的工作 ↗</button><button class="v7-outline" data-v7="profile-team">查看团队 ↗</button></div></section><section class="v7-surface"><h3 class="v7-section-label">工作状态与偏好</h3><label class="v7-pref-row"><span>当前工作状态<small>只改变界面上的状态标签</small></span><select id="v7WorkStatus" aria-label="工作状态">${['专注工作','可联系','忙碌中','暂时离开'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="v7-pref-row"><span>接收任务与评论提醒<small>本机通知演示偏好</small></span><input type="checkbox" id="v7Notify" ${p.notify?'checked':''}/></label><label class="v7-pref-row"><span>Agent 协作提醒<small>本机通知演示偏好</small></span><input type="checkbox" id="v7AgentNotify" ${p.agentNotify?'checked':''}/></label><label class="v7-pref-row"><span>语言<small>显示语言偏好，不翻译整个应用</small></span><select id="v7Language"><option ${p.language==='简体中文'?'selected':''}>简体中文</option><option ${p.language==='English'?'selected':''}>English</option></select></label><div class="v7-right-section"><h3 class="v7-section-label">账号与安全</h3><p style="font-size:12px;color:#7789a6;line-height:1.7">当前版本只做可交互 UI，不要求输入密码，也不提供真实登录会话或凭据管理。</p></div></section></div><p class="v7-demo-note">资料与偏好仅保存在此浏览器的 localStorage 中，不发送至服务器；不要填写真实敏感信息。</p></div>`}
function v7ProfileEdit(){const p=v7.profile;uxDialog(`<div class="ux-dialogbar"><strong>编辑个人资料</strong><button type="button" class="ux-iconbtn" data-ux="close" aria-label="关闭">×</button></div><form id="v7ProfileForm" class="v7-form"><p class="v7-demo-note">仅保存本机演示数据，请不要填写真实敏感信息。</p>${[['name','姓名','text',40],['job','职位或工作身份','text',80],['email','联系邮箱（演示）','email',100],['phone','工作电话','text',30],['mobile','手机（演示）','text',30],['location','所在地区','text',50]].map(([key,label,type,max])=>`<label for="v7-${key}">${label}</label><input id="v7-${key}" name="${key}" type="${type}" maxlength="${max}" value="${v7Safe(p[key])}" ${key==='name'?'required':''}/>`).join('')}<label for="v7-bio">个人介绍</label><textarea rows="3" name="bio" id="v7-bio" maxlength="300">${v7Safe(p.bio)}</textarea><div class="v7-form-actions"><button type="button" class="v7-outline" data-ux="close">取消</button><button type="submit" class="v7-outline primary">保存资料</button></div></form>`,{small:true,title:'编辑个人资料'})}
// Profile is discoverable, but work/notifications continue to be first-class entries.
menus['个人']=[['个人主页','user'],['消息通知','bell'],['个人资料','user']];
const v7OldPersonal=ux5Personal;
ux5Personal=function(){return v7OldPersonal().replace('＋ 新建需求</button>','＋ 新建需求</button><button type="button" class="v7-outline" data-v7="profile-open" style="margin-left:9px">我的资料 ↗</button>')};
const v7OldRender=render;
render=function(){if(area==='个人'&&sub==='个人资料'){rdSetHead('个人资料','身份、联系信息与偏好设置',null);$('#content').innerHTML=ux5MobileTabs()+v7ProfileView();$('#search').placeholder='搜索项目、任务或文档…';return}v7OldRender()};
// Unified click actions for new UI, without changing the project menu or v6 actions.
document.addEventListener('click',event=>{const b=event.target.closest('[data-v7]');if(!b)return;const act=b.dataset.v7,val=b.dataset.value;if(act!=='meeting-action')event.preventDefault();
if(act==='toggle-rooms'){v7.roomMenu=!v7.roomMenu;v7Save();render();return}
if(act==='choose-room'){ux6.channel=Number(b.dataset.id);v7.roomMenu=false;v7.filter='全部';v7.sideOpen=false;ux6Save();v7Save();v7RefreshRoom();return}

if(act==='run-expand'){const key=b.dataset.id;v7.expandedRuns=v7.expandedRuns.includes(key)?v7.expandedRuns.filter(x=>x!==key):[...v7.expandedRuns,key];v7Save();render();return}
if(act==='open-side'){v7.side=val||'tasks';v7.sideOpen=true;v7Save();render();return}
if(act==='close-side'){v7.sideOpen=false;v7Save();render();return}
if(act==='side-tab'){v7.side=val;v7Save();render();return}
if(act==='open-task'){v7.sideOpen=false;rdOpenDetail(Number(b.dataset.id));return}
if(act==='go-board'){const p=v7Project(ux6Channel());if(p)uxGo('项目','需求看板',p.id);return}

if(act==='reply'){const m=ux6Channel()?.messages.find(x=>x.id===Number(b.dataset.id));const textarea=document.getElementById('ux6Message');if(m&&textarea){textarea.value+=(textarea.value?'\n':'')+'@'+m.who+' ';textarea.focus()}return}
if(act==='mention-picker'){v7Mentions();return}
if(act==='mention-insert'){const who=val;uxClose();const input=document.getElementById('ux6Message');if(input){input.value+=(input.value?' ':'')+'@'+who+' ';input.focus()}return}
if(act==='open-meeting'){v7OpenMeeting();return}
if(act==='meeting-exit'){v7.meeting=null;v7Save();uxClose();return}
if(act==='meeting-tab'){v7.meetingTab=val;v7Save();v7DrawMeeting();return}
if(act==='meeting-mic'){v7.mic=!v7.mic;v7Save();v7DrawMeeting();toast('仅切换麦克风 UI 状态，不访问设备');return}
if(act==='meeting-camera'){v7.camera=!v7.camera;v7Save();v7DrawMeeting();toast('仅切换摄像头 UI 状态，不访问设备');return}
if(act==='meeting-share'||act==='meeting-record'){toast('纯交互原型：未启用屏幕共享或录音');return}
if(act==='meeting-invite'){const c=ux6.channels.find(x=>x.id===v7.meeting);v7.meeting=null;v7Save();uxClose();ux6Members();toast('修改群聊参与者后可重新打开会议演示');return}
if(act==='meeting-action'){const i=Number(b.dataset.id);v7.meetingActionsDone=b.checked?[...new Set([...v7.meetingActionsDone,i])]:v7.meetingActionsDone.filter(x=>x!==i);v7Save();return}
if(act==='meeting-copy'){const summary='示例纪要：确认核心功能开发进度；讨论质量问题与风险分工；确定下一迭代优先级；明确上线前验收安排。';navigator.clipboard?.writeText(summary).then(()=>toast('已复制示例纪要'),()=>toast('浏览器阻止复制，请手动选取文字')).catch(()=>{});return}
if(act==='meeting-ask-end'){v7.confirmEnd=true;v7DrawMeeting();return}
if(act==='meeting-cancel-end'){v7.confirmEnd=false;v7DrawMeeting();return}
if(act==='meeting-confirm-end'){v7.meeting=null;v7.confirmEnd=false;v7Save();uxClose();toast('演示会议已结束');return}
if(act==='profile-open'){uxGo('个人','个人资料');return}
if(act==='profile-edit'){v7ProfileEdit();return}
if(act==='profile-work'){uxGo('个人','个人主页');return}
if(act==='profile-team'){uxGo('团队','团队管理');return}
});
document.addEventListener('submit',event=>{const f=event.target;if(f.id==='v7ProfileForm'){event.preventDefault();const data=new FormData(f),name=String(data.get('name')||'').trim();if(!name){toast('请填写姓名');return}for(const k of ['name','job','email','phone','mobile','location','bio'])v7.profile[k]=String(data.get(k)||'').trim();v7Save();uxClose();render();toast('资料已保存到本机（演示）');return}if(f.id==='v7MeetingChat'){event.preventDefault();const msg=String(new FormData(f).get('message')||'').trim();if(!msg)return;v7.meetingMessages.push({channel:v7.meeting,who:v7.profile.name||'我',text:msg});v7.meetingMessages=v7.meetingMessages.slice(-80);v7Save();v7DrawMeeting();return}},true);
document.addEventListener('change',event=>{const el=event.target;if(!el)return;if(['v7WorkStatus','v7Notify','v7AgentNotify','v7Language'].includes(el.id)){const key={v7WorkStatus:'status',v7Notify:'notify',v7AgentNotify:'agentNotify',v7Language:'language'}[el.id];v7.profile[key]=el.type==='checkbox'?el.checked:el.value;v7Save();if(key==='status'||key==='language')render();else toast('偏好已保存到本机');}},true);
// Progressive disclosure: close the room picker when clicking elsewhere or pressing Escape.
document.addEventListener('pointerdown',e=>{
  if(!v7.roomMenu||e.target.closest('.v7-room-switch'))return;
  v7.roomMenu=false;v7Save();
  const menu=document.getElementById('v7RoomMenu');menu?.remove();
  document.querySelector('.v7-room-switch > button')?.setAttribute('aria-expanded','false');
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape'||!v7.roomMenu)return;

  const trigger=document.querySelector('.v7-room-switch > button');
  trigger?.setAttribute('aria-expanded','false');trigger?.focus();
});

render();

<script>
/* v8: project-room meeting participation model. UI ONLY: no audio, video, agents or network. */
const V8_MEET_KEY = 'aragonteam.v8.meeting';
function v8Read(){try{let x=JSON.parse(localStorage.getItem(V8_MEET_KEY)||'null');return x&&typeof x==='object'&&x.phase==='live'&&Array.isArray(x.people)?x:null}catch{return null}}
let v8Session=v8Read(),v8Setup=null,v8Inviting=false,v8EndConfirm=false;
const v8Esc=s=>uxText(String(s??''));
const v8Room=id=>ux6.channels.find(c=>c.id===id);
function v8Save(){try{if(v8Session)localStorage.setItem(V8_MEET_KEY,JSON.stringify(v8Session));else localStorage.removeItem(V8_MEET_KEY)}catch{}}
function v8Host(){return String(v7.profile?.name||'Ada').trim()||'Ada'}
function v8Candidate(c){const chosen=new Set((v8Session?.people||[]).map(x=>x.name));const pool=[...c.people.map(name=>({name,kind:'成员',room:true})),...c.agents.map(name=>({name,kind:'Agent',room:true})),...['Sophie','张伟','陈磊'].map(name=>({name,kind:'成员',room:false})),...(rd.agents||[]).map(a=>({name:a.name,kind:'Agent',room:false}))];const unique=new Map();for(const p of pool){const key=p.kind+':'+p.name;if(!unique.has(key)&&p.name!==v8Host()&&!chosen.has(p.name))unique.set(key,p)}return [...unique.values()].slice(0,20)}
function v8StatusButton(c){if(v8Session?.phase==='live'&&v8Session.channel===c.id)return '◉ 返回演示会议';return '◉ 开始演示会议'}
// Keep v7's room layout and all preexisting navigation/actions; only add a compact meeting status.
const v8OriginalGroupView=ux6GroupView;
ux6GroupView=function(){let s=v8OriginalGroupView();const c=ux6Channel();if(!c)return s;const live=v8Session?.phase==='live'&&v8Session.channel===c.id;if(live){const joined=v8Session.people.filter(p=>p.state==='joined').length,invited=v8Session.people.filter(p=>p.state==='invited').length;s=s.replace('◉ 开始演示会议','◉ 返回演示会议').replace('<div class="v7-room-layout">',`<div class="v8-room-live"><span class="v8-live-dot"></span><strong>项目会议正在演示</strong><span>已入会 ${joined} · 待加入 ${invited}（本机模拟）</span><button type="button" class="v7-outline" data-v7="open-meeting">返回会议 →</button></div><div class="v7-room-layout">`)}return s};
function v8DrawSetup(){if(!v8Setup)return;const c=v8Room(v8Setup.channel);if(!c)return;const host=v8Host();const others=c.people.filter(n=>n!==host);uxDialog(`<div class="v8-setup"><header class="v8-top"><div><span class="v8-kicker">项目房间 / 会议准备</span><h2>开始项目会议</h2><p>先确认会议内容，发起人入会后其他成员可自主加入。</p></div><button type="button" class="v8-icon" data-v8="cancel-prejoin" aria-label="取消会议准备">×</button></header><form id="v8SetupForm"><div class="v8-setup-body"><section><label class="v8-label" for="v8MeetingTitle">会议主题</label><input class="v8-input" id="v8MeetingTitle" name="title" maxlength="70" value="${v8Esc(v8Setup.title)}" required/><p class="v8-hint">来自 #${v8Esc(c.name)}，关联项目：${v8Esc(c.project||'未关联项目')}</p><div class="v8-setup-callout"><strong>谁会进入会议？</strong><p><b>${v8Esc(host)}</b> 将作为主持人进入。<b>其他群聊成员不会自动加入</b>，只有主动点击加入后才显示为参会者。</p></div><label class="v8-checkline"><input type="checkbox" name="notify" ${v8Setup.notify?'checked':''}/><span>向当前群聊的 ${others.length} 位其他成员展示加入入口 <small>仅模拟邀请状态，不发送通知</small></span></label></section><aside class="v8-agent-choose"><strong>邀请 Agent（可选）</strong><p>Agent 不会因为在群里就自动开会，须明确选择。</p>${c.agents.map((a,i)=>`<label class="v8-agent-check"><input type="checkbox" name="agent" value="${v8Esc(a)}" ${v8Setup.agents.includes(a)?'checked':''}/><span class="v8-avatar robot">✦</span><span>${v8Esc(a)}</span></label>`).join('')||'<span class="v8-hint">当前群聊没有 Agent</span>'}</aside></div><footer class="v8-setup-footer"><span>演示模式 · 无真实音视频、通知或 Agent 执行</span><button type="button" class="v7-outline" data-v8="cancel-prejoin">取消</button><button type="submit" class="v7-outline primary">开始演示会议 →</button></footer></form></div>`,{title:'会议准备'});document.getElementById('v8MeetingTitle')?.focus()}
function v8Begin(form){if(!v8Setup)return;const c=v8Room(v8Setup.channel);if(!c)return;const fd=new FormData(form),title=String(fd.get('title')||'').trim();if(!title)return toast('请输入会议主题');const host=v8Host();const extras=fd.has('notify')?c.people.filter(n=>n!==host).map(name=>({name,kind:'成员',state:'invited',source:'room'})):[];const agents=fd.getAll('agent').map(String).filter(n=>n!==host).map(name=>({name,kind:'Agent',state:'invited',source:'chosen'}));v8Session={phase:'live',channel:c.id,title,host,people:[{name:host,kind:'主持人',state:'joined',source:'self'},...extras,...agents],startedAt:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})};v8Setup=null;v8Inviting=false;v8EndConfirm=false;v7.meeting=c.id;v7.meetingTab='minutes';v7Save();v8Save();v7DrawMeeting();toast('会议已开始：仅主持人入会，其余人员待自主加入（演示）')}
function v7OpenMeeting(){const c=ux6Channel();if(!c)return;if(v8Session?.phase==='live'){if(v8Session.channel!==c.id){toast('已有其他房间的会议在进行：请先返回原房间结束会议');return}v7.meeting=c.id;v7Save();v8Inviting=false;v8EndConfirm=false;v7DrawMeeting();return}v8Setup={channel:c.id,title:c.name+' · 项目同步会',notify:true,agents:[]};v8DrawSetup()}
function v8ListPerson(p,i){const joined=p.state==='joined';return `<div class="v8-person-card ${joined?'is-joined':'is-invited'}"><div class="v8-avatar ${p.kind==='Agent'?'robot':''}">${p.kind==='Agent'?'✦':v8Esc(p.name.charAt(0))}</div><strong>${v8Esc(p.name)}</strong><small>${v8Esc(p.kind)}</small><span class="v8-state ${joined?'good':''}">${joined?'● 已入会':'◌ 待加入'}</span>${!joined?`<button type="button" class="v8-action-link" data-v8="join-person" data-id="${i}">模拟加入</button>`:''}</div>`}
function v8DrawInvite(){const c=v8Room(v8Session?.channel);const candidates=c?v8Candidate(c):[];return `<div class="v8-confirm" role="group" aria-label="邀请参会者"><div class="v8-confirm-content v8-invite"><strong>邀请参会者</strong><p>这里管理的是会议邀请，不改变群聊成员。选择后处于“待加入”，不会自动入会。</p><form id="v8InviteForm"><div class="v8-invite-list">${candidates.length?candidates.map((p,i)=>`<label><input type="checkbox" name="person" value="${i}"/><span class="v8-avatar ${p.kind==='Agent'?'robot':''}">${p.kind==='Agent'?'✦':v8Esc(p.name.charAt(0))}</span><span>${v8Esc(p.name)} <small>· ${p.kind}${p.room?' · 当前房间':''}</small></span></label>`).join(''):'<p>没有其他可邀请的成员或 Agent。</p>'}</div><footer><button type="button" class="v7-outline" data-v8="cancel-invite">返回会议</button><button type="submit" class="v7-outline primary" ${candidates.length?'':'disabled'}>添加为待加入</button></footer></form></div></div>`}
function v8TabMinutes(c){const notes=['确认核心功能的开发进度','讨论质量问题与风险分工','确定下一迭代优先级','明确上线前的验收安排'];const tasks=[['整理本轮 UI 验收清单',c.people[0]||'Ada'],['检查关联需求的优先级',c.people[1]||'成员'],['准备文档与交付说明',c.agents[0]||'成员']];return `<div class="v7-pill orange">示例纪要 · 非实时 AI 生成</div><h4>会议要点</h4><ul>${notes.map(x=>`<li>${x}</li>`).join('')}</ul><h4>行动项 (${tasks.length})</h4>${tasks.map(([title,owner],i)=>`<label><input type="checkbox" data-v7="meeting-action" data-id="${i}" ${v7.meetingActionsDone.includes(i)?'checked':''}/><span>${v8Esc(title)} <small class="v8-muted">@${v8Esc(owner)}</small></span></label>`).join('')}<button type="button" class="v7-outline" data-v7="meeting-copy">复制示例纪要</button>`}
function v8TabChat(c){const chat=v7.meetingMessages.filter(x=>x.channel===c.id);return `<div class="v7-meeting-chat"><div class="v7-meeting-msg"><strong>系统 · 演示</strong><br>会议已开始。只有参会者会出现在已入会列表。</div>${chat.map(m=>`<div class="v7-meeting-msg"><strong>${v8Esc(m.who)}</strong><br>${v8Esc(m.text)}</div>`).join('')}</div>`}
function v8TabPeople(){return `<div class="v8-people-list"><div class="v8-people-summary"><span>已入会 <strong>${v8Session.people.filter(p=>p.state==='joined').length}</strong></span><span>待加入 <strong>${v8Session.people.filter(p=>p.state==='invited').length}</strong></span></div>${v8Session.people.map((p,i)=>`<div class="v8-person-row"><span class="v8-avatar ${p.kind==='Agent'?'robot':''}">${p.kind==='Agent'?'✦':v8Esc(p.name[0])}</span><span><strong>${v8Esc(p.name)}</strong><small>${v8Esc(p.kind)} · ${p.state==='joined'?'已入会':'待加入'}</small></span>${p.state==='invited'?`<button class="v8-action-link" type="button" data-v8="join-person" data-id="${i}">模拟加入</button>`:'<span class="v8-state good">●</span>'}</div>`).join('')}<button type="button" class="v7-outline" data-v8="invite-open">＋ 邀请参会者</button></div>`}
function v7DrawMeeting(){if(v8Setup&&!v8Session)return v8DrawSetup();if(v8Session?.phase!=='live')return;const c=v8Room(v8Session.channel);if(!c)return;v7.meeting=c.id;const joined=v8Session.people.filter(p=>p.state==='joined').length,invited=v8Session.people.filter(p=>p.state==='invited').length;uxDialog(`<div class="v7-meeting v8-meeting"><header class="v7-meeting-top"><div class="v8-meeting-top-left"><div class="v8-meeting-headerline"><span class="v8-live-dot"></span><strong>${v8Esc(v8Session.title)}</strong><span class="v8-state good">演示会议中</span></div><p class="v7-demo-note"># ${v8Esc(c.name)} · 会议 ${v8Esc(v8Session.startedAt)} 开始 · 本机演示，无真实音视频</p><button class="v8-mobile-stats" type="button" data-v8="switch-people">参会 ${joined} · 待加入 ${invited} →</button></div><button type="button" class="v7-outline" data-v8="minimize" aria-label="返回项目房间，保留会议状态">返回房间 ×</button></header><div class="v7-meeting-body"><section class="v7-meeting-stage" aria-label="实际参会者"><div class="v8-stage-heading"><div><strong>已入会 ${joined} 人</strong><small>仅显示已加入者；群成员不自动入会</small></div><button type="button" class="v7-outline" data-v8="invite-open">＋ 邀请参会者</button></div><div class="v7-meeting-person-grid v8-joined-grid">${v8Session.people.filter(p=>p.state==='joined').map((p,i)=>v8ListPerson(p,i)).join('')}${joined===1?`<div class="v8-awaiting-card"><span class="v8-awaiting-icon">···</span><strong>等待其他成员加入</strong><small>${invited?`已有 ${invited} 位待加入`:'可从当前群聊邀请参会者'}</small><button type="button" class="v8-action-link" data-v8="${invited?'switch-people':'invite-open'}">${invited?'查看邀请状态 →':'邀请参会者 →'}</button></div>`:''}</div>${invited?`<div class="v8-waiting"><span>◌ 还有 ${invited} 位已邀请成员／Agent 等待加入</span><button type="button" data-v8="switch-people">查看名单 →</button></div>`:''}<nav class="v7-meeting-rail" aria-label="演示会议控制"><button type="button" data-v7="meeting-mic" class="${!v7.mic?'active':''}">${v7.mic?'🎙 麦克风开':'🔇 麦克风关'}</button><button type="button" data-v7="meeting-camera" class="${!v7.camera?'active':''}">${v7.camera?'▣ 摄像头开':'▣ 摄像头关'}</button><button type="button" data-v7="meeting-share">共享屏幕</button><button type="button" data-v7="meeting-record">录制</button><button type="button" class="danger" data-v8="ask-end">结束会议</button></nav></section><aside class="v7-meeting-aside"><div class="v7-meeting-tabs" role="group" aria-label="会议侧边内容">${[['minutes','AI 纪要'],['chat','会议聊天'],['people',`参会者 ${joined}`]].map(([k,n])=>`<button type="button" data-v7="meeting-tab" data-value="${k}" class="${v7.meetingTab===k?'active':''}" aria-pressed="${v7.meetingTab===k}">${n}</button>`).join('')}</div><div class="v7-meeting-scroller">${v7.meetingTab==='minutes'?v8TabMinutes(c):v7.meetingTab==='chat'?v8TabChat(c):v8TabPeople()}</div>${v7.meetingTab==='chat'?`<form class="v7-meeting-chat-form" id="v7MeetingChat"><label class="sr-only" for="v7MeetingText">会议演示消息</label><input type="text" id="v7MeetingText" name="message" maxlength="500" placeholder="输入本机演示消息…" required/><button type="submit" class="v7-outline primary">发送</button></form>`:''}</aside></div>${v8Inviting?v8DrawInvite():''}${v8EndConfirm?`<div class="v8-confirm" role="group" aria-label="确认结束会议"><div class="v8-confirm-content"><strong>结束当前演示会议？</strong><p>只有明确结束才会解除会议状态；返回房间不会结束会议。</p><footer><button type="button" class="v7-outline" data-v8="cancel-end">继续会议</button><button type="button" class="v7-outline primary" data-v8="confirm-end">确认结束</button></footer></div></div>`:''}</div>`,{title:'项目会议 · 演示'});}
function v8ExitSetup(){v8Setup=null;v7.meeting=null;v7Save();uxClose()}
// New controls deliberately use data-v8; legacy v7 handlers only service shared controls.
document.addEventListener('click',e=>{const btn=e.target.closest('[data-v8]');if(!btn)return;e.preventDefault();const act=btn.dataset.v8;
if(act==='cancel-prejoin')return v8ExitSetup();
if(act==='minimize'){v8Inviting=false;v8EndConfirm=false;uxClose();render();return}
if(act==='invite-open'){v8Inviting=true;v8EndConfirm=false;v7DrawMeeting();return}
if(act==='cancel-invite'){v8Inviting=false;v7DrawMeeting();return}
if(act==='switch-people'){v7.meetingTab='people';v7Save();v7DrawMeeting();return}
if(act==='join-person'){const i=Number(btn.dataset.id);const p=v8Session?.people[i];if(p&&p.state==='invited'){p.state='joined';v8Save();v7DrawMeeting();toast(p.name+' 已模拟加入会议（仅本机）')}return}
if(act==='ask-end'){v8EndConfirm=true;v8Inviting=false;v7DrawMeeting();return}
if(act==='cancel-end'){v8EndConfirm=false;v7DrawMeeting();return}
if(act==='confirm-end'){v8Session=null;v8Setup=null;v8EndConfirm=false;v8Inviting=false;v8Save();v7.meeting=null;v7Save();uxClose();render();toast('演示会议已结束，房间成员与邀请关系未改变');return}
});
document.addEventListener('submit',e=>{const f=e.target;if(f.id==='v8SetupForm'){e.preventDefault();v8Begin(f);return}if(f.id==='v8InviteForm'){e.preventDefault();const c=v8Room(v8Session?.channel),d=new FormData(f),cands=c?v8Candidate(c):[];const selected=d.getAll('person').map(Number).filter(n=>Number.isInteger(n)&&cands[n]);if(!selected.length)return toast('请选择一位成员或 Agent');for(const idx of selected){const p=cands[idx];if(!v8Session.people.some(x=>x.name===p.name))v8Session.people.push({name:p.name,kind:p.kind,state:'invited',source:'added'})}v8Inviting=false;v8Save();v7.meetingTab='people';v7Save();v7DrawMeeting();toast('已添加为待加入（仅本机模拟，未发送真实邀请）');return}},true);
// Compatibility: data-v7 meeting-invite from older content must never mutate room roster.
document.addEventListener('click',e=>{if(e.target.closest('[data-v7="meeting-invite"]')){e.preventDefault();e.stopImmediatePropagation();v8Inviting=true;v7DrawMeeting()}},true);
// If a saved session outlives its channel, discard only that stale session.
if(v8Session&&!v8Room(v8Session.channel)){v8Session=null;v8Save()}

</script>
</body></html>
