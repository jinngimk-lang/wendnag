<style>

:transparent;color:#46629c;display:flex;align-items:center;gap:20px;border-radius:10px;padding:0 18px;width:100%;text-align:left;font-weight:550;font-size:16px}.subnav button:hover{background:#f7f8fd}.subnav button.active{color:var(--coral);background:linear-gradient(90deg,#fff1ec,#fff8f6);font-weight:750}.subnav svg{width:26px;height:26px;flex-shrink:0}.main{min-width:0;flex:1;min-height:100vh}.topbar{height:59px;background:var(--light);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 25px;gap:24px}.search-wrap{position:relative;width:min(618px,58vw)}.search-wrap svg{position:absolute;left:17px;top:12px;color:#516da9;width:24px;height:24px}.search{height:43px;background:linear-gradient(105deg,#f4f6fa,#f7f8fb);border:1px solid transparent;border-radius:9px;padding:0 18px 0 50px;width:100%;color:var(--navy);font-size:17px;outline:none}.search::placeholder{color:#6d83b5}.search:focus{border-color:#aec6f6;background:white}.tools{display:flex;align-items:center;gap:28px}.iconbtn{padding:0;background:transparent;color:#41609b;width:29px;height:36px;position:relative}.iconbtn svg{width:28px;height:28px}.dot{position:absolute;top:-5px;right:-9px;min-width:20px;height:20px;background:var(--coral);color:white;border-radius:99px;font-size:12px;display:grid;place-items:center}.avatar{width:45px;height:45px;border-radius:50%;background:linear-gradient(130deg,#ff741b,#fa300a);color:white;display:grid;place-items:center;font-size:25px;flex-shrink:0}.account{display:flex;align-items:center;gap:15px;background:transparent;color:var(--navy);font-size:18px;font-weight:600;padding:0}.account svg{width:20px;height:20px;color:#315ba9}.body{padding:18px 40px 60px}.head{display:flex;align-items:start;justify-content:space-between;gap:20px;margin-bottom:20px}.head h1{font-size:31px;letter-spacing:.3px;margin:0 0 0;font-weight:760}.head p{font-size:18px;color:#5b75ad;margin:0;font-weight:580}.primary{background:linear-gradient(130deg,#ff6941,#ff4005);border-radius:10px;color:#fff;font-weight:760;box-shadow:0 3px 4px rgba(255,65,20,.09);display:inline-flex;align-items:center;justify-content:center;gap:13px;padding:0 23px;height:49px;font-size:17px}.primary svg{width:21px;height:21px}.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,416px));gap:16px;align-content:start}.project-card{height:241px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);border:1px solid #f3f4f8;padding:18px 20px 14px;position:relative}.card-top{display:flex;align-items:center;gap:22px}.project-badge{width:65px;height:65px;display:grid;place-items:center;border-radius:11px;font-size:36px;font-weight:530;flex-shrink:0}.project-badge.orange{background:#fff2f0;color:#ff4b1e}.project-badge.sky{background:#e5f3ff;color:#169ce6}.project-badge.purple{background:#f1eafe;color:#7842d5}.project-badge.green{background:#e8f8f2;color:#0d9a69}.title-area{min-width:0;flex:1}.tag{display:inline-block;color:var(--coral);background:#fff3f0;padding:5px 14px;border-radius:99px;font-size:14px;font-weight:700;line-height:1.3;margin-bottom:6px}.card-title{font-size:17px;color:#102067;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.external{border:0;background:transparent;color:#3567ce;vertical-align:middle;margin-left:8px;padding:0}.external svg{width:17px;height:17px}.more{background:transparent;color:#2455ae;position:absolute;right:18px;top:19px;padding:2px}.more svg{width:18px;height:18px}.desc{height:39px;color:#637bb4;margin:10px 0 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:16px}.divider{height:1px;background:#e6ebf3;margin:2px 0 11px}.owners{display:flex;align-items:center;justify-content:space-between;color:#6078b2;font-size:15px;height:32px}.owner{display:flex;align-items:center;gap:11px}.owner-avatar{width:31px;height:31px;border-radius:50%;background:linear-gradient(130deg,#ff681a,#fb3805);color:white;display:grid;place-items:center;font-size:14px}.face-group{display:flex;align-items:center;padding-left:8px}.face{width:28px;height:28px;border:2px solid #fff;border-radius:50%;margin-left:-8px;background:linear-gradient(135deg,#fde1c5,#e6a57e);display:grid;place-items:center;color:#475574;font-size:12px}.face:nth-child(2){background:#ecb7a9}.face:nth-child(3){background:#e5a084}.face:nth-child(4){background:#f1d2c9}.plus{margin-left:7px;color:#607cb7;font-size:14px}.actions{display:flex;gap:12px;margin-top:12px}.action{height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:15px;font-weight:720;flex:1;color:var(--navy);background:#f6f7fa}.action svg{width:18px;height:18px}.action.open{background:linear-gradient(100deg,#fff1ee,#fff5f3);color:var(--coral)}.empty{padding:30px;color:#8191b2}.popup{position:absolute;z-index:10;background:white;border:1px solid #e7eaf1;border-radius:11px;box-shadow:0 12px 32px rgba(13,25,68,.14);padding:7px;min-width:180px}.popup button{display:block;width:100%;text-align:left;padding:11px 13px;background:transparent;color:#162465;border-radius:6px}.popup button:hover{background:#f3f5fb}.hidden{display:none!important}.toolbar-popup{right:20px;top:56px}.notification{right:190px;width:260px}.modal-backdrop{position:fixed;inset:0;background:#18234280;z-index:50;display:grid;place-items:center;padding:20px}.modal{background:white;width:min(490px,95vw);max-height:90vh;overflow:auto;border-radius:16px;padding:26px 28px;box-shadow:0 25px 65px rgba(9,23,64,.26)}.modal h2{margin:0 0 18px;font-size:24px}.modal label{display:block;font-size:13px;color:#465c91;margin:15px 0 6px;font-weight:650}.field{height:43px;border:1px solid #dae2f0;border-radius:8px;padding:10px 12px;width:100%;color:#102064}.field:focus{outline:2px solid #b6d0ff;border-color:#7ea8fa}.textarea{height:85px;resize:vertical}.modal-header{display:flex;align-items:center;justify-content:space-between}.close{background:transparent;color:#7587a9;font-size:25px}.modal-foot{display:flex;justify-content:flex-end;gap:13px;margin-top:24px}.secondary{height:44px;background:#f5f6fa;color:#455c93;border-radius:9px;padding:0 19px;font-weight:650}.member-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf1f5;padding:13px 0}.member-row small{color:#8493b2}.info{background:#f6f8fc;border-radius:10px;padding:14px;color:#6176a6;margin-top:15px}.toast{position:fixed;bottom:26px;right:28px;background:#172965;color:white;border-radius:10px;padding:12px 19px;box-shadow:0 6px 18px #1729652e;z-index:100}.view-panel{background:white;border:1px solid #edf0f5;border-radius:14px;min-height:240px;padding:25px;max-width:900px;box-shadow:var(--shadow)}.view-panel h3{margin:0 0 8px}.chip{border:1px solid #e2e8f1;border-radius:99px;color:#657bac;padding:6px 12px;background:#fbfcff;display:inline-flex;margin:8px 5px 0 0}.board-columns{display:flex;gap:14px;margin-top:24px}.board-col{min-width:180px;flex:1;background:#f5f7fb;padding:16px;border-radius:12px;min-height:210px}.task{background:white;padding:13px;margin-top:12px;border-radius:8px;border:1px solid #e8ebf4}.dark{--navy:#eaf0ff;--blue:#a8c2fa;--border:#2c3551;--bg:#10172b;--light:#18213a;--card:#1d2841;--soft:#2b3853;--muted:#b4c7ea;--shadow:none;color:#f2f4ff}.dark .sidebar,.dark .rail,.dark .topbar{border-color:#2d3756}.dark .subnav button{color:#b0c3f2}.dark .subnav button.active{background:#3b2b32;color:#ff936a}.dark .project-card{border-color:#293753}.dark .card-title{color:#edf3ff}.dark .desc,.dark .head p,.dark .owners{color:#b1c0e7}.dark .divider{background:#34405b}.dark .action{background:#2b3855;color:#c8d7f2}.dark .action.open{background:#4a3032;color:#ffa88a}.dark .view-panel,.dark .modal,.dark .popup{background:#1d2841;color:#e7efff;border-color:#354365}.dark .popup button{color:#dae5ff}.dark .field{background:#192442;color:#fff;border-color:#465374}.dark .info,.dark .task,.dark .board-col{background:#293651;color:#d8e5ff}.dark .search{background:#25 <div class="app"><aside class="rail"><div class="logo" title="AragonTeam"><span></span></div><button class="rail-btn" data-area="智能体" title="智能体"><svg><use href="#i-chat"/></svg><small>智能体</small></button><button class="rail-btn active" data-area="项目" title="项目"><svg><use href="#i-folder"/></svg><small>项目</small></button><button class="rail-btn" data-area="团队" title="团队"><svg><use href="#i-users"/></svg><small>团队</small></button><button class="rail-btn" data-area="个人" title="个人"><svg><use href="#i-user"/></svg><small>个人</small></button><button class="rail-btn rail-bottom" data-area="设置" title="设置"><svg><use href="#i-settings"/></svg><small>设置</small></button></aside>

<main class="body"><div class="head"><div><h1 id="pageTitle">项目</h1><p id="pageSubtitle">研发项目管理</p></div><button class="primary" id="createBtn"><svg><use href="#i-plus"/></svg><span id="createText">新建项目</span></button></div><div id="content"><div id="cards" class="card-grid"></div></div></main></div></div>

<script>
const $=q=>document.querySelector(q), $$=q=>[...document.querySelectorAll(q)],icon=(name)=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const menus={"项目":[['项目管理','grid'],['需求看板','board'],['BUG看板','board'],['文档','page'],['代码仓','code'],['建议','bulb'],['版本','layers']],"智能体":[['智能体广场','chat'],['我的智能体','user'],['智能体任务','board']],"团队":[['团队管理','users'],['成员管理','user'],['角色权限','settings'],['邀请记录','page']],"个人":[['个人主页','user'],['我的任务','board'],['消息通知','bell']],"设置":[['基础设置','settings'],['通知设置','bell'],['权限与安全','users']]};
let projects=[{id:1,name:'AragonTeam Platform',label:'ARA',initial:'A',color:'orange',desc:'AI 时代的团队协作与研发管理平台自身。',more:13,people:17},{id:2,name:'Legallens',label:'123',initial:'L',color:'sky',desc:'Legallens',more:14,people:18}],nextId=3;
let area='项目',sub='项目管理',searchText='';let modal=null;
function toast(message){const t=$('#toast');t.textContent=message;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2400)}
function renderNav(){ $('#sideTitle').textContent=area;$$('.rail-btn').forEach(b=>b.classList.toggle('active',b.dataset.area===area));$('#subnav').innerHTML=menus[area].map(([title,ic])=>`<button class="${title===sub?'active':''}" data-sub="${title}">${icon(ic)}<span>${title}</span></button>`).join('');$$('#subnav button').forEach(b=>b.onclick=()=>{sub=b.dataset.sub;render()})}
function card(p){return `<section class="project-card" data-pid="${p.id}"><button class="more" aria-label="${p.name} 更多选项" data-menu="${p.id}">${icon('more')}</button><div class="card-top"><div class="project-badge ${p.color}">${p.initial}</div><div class="title-area"><span class="tag">${escapeHtml(p.label)}</span><div class="card-title">${escapeHtml(p.name)} <button class="external" title="项目详情" data-open="${p.id}">${icon('external')}</button></div></div></div><p class="desc">${escapeHtml(p.desc)}</p><div class="divider"></div><div class="owners"><div class="owner"><span class="owner-avatar">A</span><span>Ada (管理员)</span></div><div class="face-group"><span class="face">👨🏻</span><span class="face">👩🏻</span><span class="face">👨🏽</span><span class="face">👨🏻</span><span class="plus">+${p.more}</span></div></div><div class="actions"><button class="action open" data-open="${p.id}">${icon('folder')}打开项目</button><button class="action" data-members="${p.id}">${icon('users')}成员</button></div><div id="menu-${p.id}" class="popup hidden" style="right:12px;top:47px"><button data-open="${p.id}">查看项目详情</button><button data-members="${p.id}">管理成员</button><button data-rename="${p.id}">重命名项目</button><button data-archive="${p.id}">归档项目</button></div></section>`}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){renderNav();$('#pageTitle').textContent=(area==='项目'&&sub==='项目管理')?'项目':sub;$('#pageSubtitle').textContent=area==='项目'?(sub==='项目管理'?'研发项目管理':'项目协作与研发进展'):`${area}管理与协作`;$('#createBtn').style.display=area==='项目'&&sub==='项目管理'?'inline-flex':'none';$('#createText').textContent='新建项目';$('#search').placeholder=area==='项目'?'搜索项目、任务或文件...':`搜索${area}...`;if(area==='项目'&&sub==='项目管理'){const found=projects.filter(p=>`${p.name} ${p.desc} ${p.label}`.toLowerCase().includes(searchText.toLowerCase()));$('#content').innerHTML=`<div id="cards" class="card-grid">${found.map(card).join('')}</div>${!found.length?'<p class="empty">没有找到匹配的项目。试试其他关键词，或新建一个项目。</p>':''}`;bindCards()}else{let isBoard=sub.includes('看板')||sub==='我的任务';$('#content').innerHTML=`<section class="view-panel"><h3>${escapeHtml(sub)}</h3><p style="color:#6279af">此处是「${escapeHtml(sub)}」的交互结构示例。项目管理页面保持与原设计图一致，其余模块作为导航跳转演示。</p>${isBoard?'<div class="board-columns"><div class="board-col">待处理<div class="task">需求评审与任务拆解</div></div><div class="board-col">进行中<div class="task">完善项目管理视图</div></div><div class="board-col">已完成<div class="task">初始化项目</div></div></div>':'<span class="chip">概览</span><span class="chip">协作</span><span class="chip">近期更新</span>'}</section>`}}
function bindCards(){ $$('[data-open]').forEach(x=>x.onclick=()=>projectDetails(+x.dataset.open));$$('[data-members]').forEach(x=>x.onclick=()=>members(+x.dataset.members));$$('[data-menu]').forEach(x=>x.onclick=(e)=>{e.stopPropagation();$$('.project-card .popup').forEach(n=>{if(n.id!==`menu-${x.dataset.menu}`)n.classList.add('hidden')});$('#menu-'+x.dataset.menu).classList.toggle('hidden')});$$('[data-rename]').forEach(x=>x.onclick=()=>rename(+x.dataset.rename));$$('[data-archive]').forEach(x=>x.onclick=()=>{projects=projects.filter(p=>p.id!==+x.dataset.archive);render();toast('项目已归档（原型演示）')})}
function closeModal(){const m=$('#modalContainer');m.innerHTML='';modal=null;document.body.style.overflow=''}
function showModal(title,body,foot=''){modal=title;document.body.style.overflow='hidden';$('#modalContainer').innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="modal-header"><h2>${escapeHtml(title)}</h2><button class="close" id="modalClose" aria-label="关闭">×</button></div>${body}<div class="modal-foot">${foot}</div></section></div>`;$('#modalClose').onclick=closeModal;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()}}
function createProject(){showModal('新建项目',`<form id="createForm"><label for="pname">项目名称 <span style="color:#ef421c">*</span></label><input class="field" id="pname" required maxlength="60" placeholder="例如：新产品研发" autofocus/><label for="pkey">项目标识</label><input class="field" id="pkey" maxlength="8" placeholder="例如：NEW"/><label for="pdesc">项目描述</label><textarea class="field textarea" id="pdesc" placeholder="简要介绍项目目标及范围"></textarea><div class="info">项目创建后，可以进入项目邀请成员和管理任务。</div><div class="modal-foot"><button class="secondary" type="button" id="cancelForm">取消</button><button class="primary" type="submit">创建项目</button></div></form>`);$('#cancelForm').onclick=closeModal;$('#createForm').onsubmit=e=>{e.preventDefault();const name=$('#pname').value.trim();if(!name)return;const key=($('#pkey').value.trim()||name.slice(0,3)).toUpperCase();const colors=['purple','green','sky','orange'];projects.push({id:nextId++,name,label:key,initial:name[0].toUpperCase(),color:colors[projects.length%4],desc:$('#pdesc').value.trim()||'暂无项目描述',more:0,people:1});closeModal();render();toast('项目创建成功（仅限当前原型）')};$('#pname').focus()}
function projectDetails(id){const p=projects.find(p=>p.id===id);if(!p)return;showModal(p.name,`<div style="display:flex;gap:16px;align-items:center"><div class="project-badge ${p.color}">${p.initial}</div><div><strong style="font-size:19px">${escapeHtml(p.name)}</strong><div style="color:#7486b1">${escapeHtml(p.label)} · Ada (管理员)</div></div></div><div class="info">${escapeHtml(p.desc)}</div><div class="board-columns" style="margin-top:15px"><div class="board-col" style="min-width:120px">待处理<div style="font-size:25px;font-weight:700">8</div></div><div class="board-col" style="min-width:120px">进行中<div style="font-size:25px;font-weight:700">4</div></div><div class="board-col" style="min-width:120px">已完成<div style="font-size:25px;font-weight:700">12</div></div></div>`,`<button class="secondary" id="viewMembers">查看成员</button><button class="primary" id="enterProject">进入项目</button>`);$('#viewMembers').onclick=()=>members(id);$('#enterProject').onclick=()=>{closeModal();sub='需求看板';render();toast('已打开 '+p.name+' 项目看板')}}
function members(id){const p=projects.find(p=>p.id===id);if(!p)return;showModal(`${p.name} · 成员`,`<div class="info">成员与权限示例，可继续扩展邀请、移除和角色授权。</div>${[['A','Ada','管理员'],['李','李明','项目成员'],['王','王芳','开发成员'],['张','张伟','项目成员']].map(([a,n,r])=>`<div class="member-row"><span style="display:flex;align-items:center;gap:12px"><span class="owner-avatar">${a}</span><strong>${n}</strong></span><small>${r}</small></div>`).join('')}`,`<button class="secondary" id="mCancel">关闭</button><button class="primary" id="invite">邀请成员</button>`);$('#mCancel').onclick=closeModal;$('#invite').onclick=()=>{showModal('邀请成员',`<label>成员邮箱</label><input class="field" id="inviteEmail" type="email" placeholder="name@example.com"/><div class="info">原型模式：仅展示邀请确认，不会发送真实邮件。</div>`,`<button class="secondary" id="inviteCancel">取消</button><button class="primary" id="inviteSubmit">发送邀请</button>`);$('#inviteCancel').onclick=closeModal;$('#inviteSubmit').onclick=()=>{if(!$('#inviteEmail').value.includes('@')){toast('请输入有效的邮箱');return}closeModal();toast('邀请已记录（原型演示）')}}}
function rename(id){let p=projects.find(p=>p.id===id);showModal('重命名项目',`<label>项目名称</label><input class="field" id="newName" value="${escapeHtml(p.name)}"/>`,`<button class="secondary" id="rCancel">取消</button><button class="primary" id="rSave">保存</button>`);$('#rCancel').onclick=closeModal;$('#rSave').onclick=()=>{let t=$('#newName').value.trim();if(t){p.name=t;closeModal();render();toast('名称已更新')}}}
$$('[data-area]').forEach(b=>b.onclick=()=>{area=b.dataset.area;sub=menus[area][0][0];searchText='';$('#search').value='';render()});$('#search').addEventListener('input',e=>{searchText=e.target.value;render()});$('#createBtn').onclick=createProject;$('#theme').onclick=()=>document.body.classList.toggle('dark');$('#notice').onclick=()=>{$('#accountMenu').classList.add('hidden');$('#noticeMenu').classList.toggle('hidden')};$('#account').onclick=()=>{$('#noticeMenu').classList.add('hidden');$('#accountMenu').classList.toggle('hidden')};$$('#noticeMenu button,#accountMenu button').forEach(b=>b.onclick=()=>{b.closest('.popup').classList.add('hidden');toast(`${b.textContent}：原型操作演示`)});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}});document.addEventListener('click',e=>{if(!e.target.closest('.more')&&!e.target.closest('.project-card .popup'))$$('.project-card .popup').forEach(el=>el.classList.add('hidden'))});render();
</script></body></html>
