function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.title=`AragonTeam · ${area}管理交互原型`;renderNav();if(area==='团队'){renderTeamSection();return;}$('#pageTitle').textContent=(area==='项目'&&sub==='项目管理')?'项目':sub;$('#pageSubtitle').textContent=area==='项目'?(sub==='项目管理'?'研发项目管理':'项目协作与研发进展'):`${area}管理与协作`;$('#createBtn').style.display=area==='项目'&&sub==='项目管理'?'inline-flex':'none';$('#createText').textContent='新建项目';$('#search').placeholder=area==='项目'?'搜索项目、任务或文件...':`搜索${area}...`;if(area==='项目'&&sub==='项目管理'){const found=projects.filter(p=>`${p.name} ${p.desc} ${p.label}`.toLowerCase().includes(searchText.toLowerCase()));$('#content').innerHTML=`<div id="cards" class="card-grid">${found.map(card).join('')}</div>${!found.length?'<p class="empty">没有找到匹配的项目。试试其他关键词，或新建一个项目。</p>':''}`;bindCards()}else{let isBoard=sub.includes('看板')||sub==='我的任务';$('#content').innerHTML=`<section class="view-panel"><h3>${escapeHtml(sub)}</h3><p style="color:#6279af">此处是「${escapeHtml(sub)}」的交互结构示例。项目管理页面保持与原设计图一致，其余模块作为导航跳转演示。</p>${isBoard?'<div class="board-columns"><div class="board-col">待处理<div class="task">需求评审与任务拆解</div></div><div class="board-col">进行中<div class="task">完善项目管理视图</div></div><div class="board-col">已完成<div class="task">初始化项目</div></div></div>':'<span class="chip">概览</span><span class="chip">协作</span><span class="chip">近期更新</span>'}</section>`}}
function bindCards(){ $$('[data-open]').forEach(x=>x.onclick=()=>projectDetails(+x.dataset.open));$$('[data-members]').forEach(x=>x.onclick=()=>members(+x.dataset.members));$$('[data-menu]').forEach(x=>x.onclick=(e)=>{e.stopPropagation();$$('.project-card .popup').forEach(n=>{if(n.id!==`menu-${x.dataset.menu}`)n.classList.add('hidden')});$('#menu-'+x.dataset.menu).classList.toggle('hidden')});$$('[data-rename]').forEach(x=>x.onclick=()=>rename(+x.dataset.rename));$$('[data-archive]').forEach(x=>x.onclick=()=>{projects=projects.filter(p=>p.id!==+x.dataset.archive);render();toast('项目已归档（原型演示）')})}
function closeModal(){const m=$('#modalContainer');m.innerHTML='';modal=null;document.body.style.overflow=''}
function showModal(title,body,foot=''){modal=title;document.body.style.overflow='hidden';$('#modalContainer').innerHTML=`<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="modal-header"><h2>${escapeHtml(title)}</h2><button class="close" id="modalClose" aria-label="关闭">×</button></div>${body}<div class="modal-foot">${foot}</div></section></div>`;$('#modalClose').onclick=closeModal;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()}}
function createProject(){showModal('新建项目',`<form id="createForm"><label for="pname">项目名称 <span style="color:#ef421c">*</span></label><input class="field" id="pname" required maxlength="60" placeholder="例如：新产品研发" autofocus/><label for="pkey">项目标识</label><input class="field" id="pkey" maxlength="8" placeholder="例如：NEW"/><label for="pdesc">项目描述</label><textarea class="field textarea" id="pdesc" placeholder="简要介绍项目目标及范围"></textarea><div class="info">项目创建后，可以进入项目邀请成员和管理任务。</div><div class="modal-foot"><button class="secondary" type="button" id="cancelForm">取消</button><button class="primary" type="submit">创建项目</button></div></form>`);$('#cancelForm').onclick=closeModal;$('#createForm').onsubmit=e=>{e.preventDefault();const name=$('#pname').value.trim();if(!name)return;const key=($('#pkey').value.trim()||name.slice(0,3)).toUpperCase();const colors=['purple','green','sky','orange'];projects.push({id:nextId++,name,label:key,initial:name[0].toUpperCase(),color:colors[projects.length%4],desc:$('#pdesc').value.trim()||'暂无项目描述',more:0,people:1});closeModal();render();toast('项目创建成功（仅限当前原型）')};$('#pname').focus()}
function projectDetails(id){const p=projects.find(p=>p.id===id);if(!p)return;showModal(p.name,`<div style="display:flex;gap:16px;align-items:center"><div class="project-badge ${p.color}">${p.initial}</div><div><strong style="font-size:19px">${escapeHtml(p.name)}</strong><div style="color:#7486b1">${escapeHtml(p.label)} · Ada (管理员)</div></div></div><div class="info">${escapeHtml(p.desc)}</div><div class="board-columns" style="margin-top:15px"><div class="board-col" style="min-width:120px">待处理<div style="font-size:25px;font-weight:700">8</div></div><div class="board-col" style="min-width:120px">进行中<div style="font-size:25px;font-weight:700">4</div></div><div class="board-col" style="min-width:120px">已完成<div style="font-size:25px;font-weight:700">12</div></div></div>`,`<button class="secondary" id="viewMembers">查看成员</button><button class="primary" id="enterProject">进入项目</button>`);$('#viewMembers').onclick=()=>members(id);$('#enterProject').onclick=()=>{closeModal();sub='需求看板';render();toast('已打开 '+p.name+' 项目看板')}}
function members(id){const p=projects.find(p=>p.id===id);if(!p)return;showModal(`${p.name} · 成员`,`<div class="info">成员与权限示例，可继续扩展邀请、移除和角色授权。</div>${[['A','Ada','管理员'],['李','李明','项目成员'],['王','王芳','开发成员'],['张','张伟','项目成员']].map(([a,n,r])=>`<div class="member-row"><span style="display:flex;align-items:center;gap:12px"><span class="owner-avatar">${a}</span><strong>${n}</strong></span><small>${r}</small></div>`).join('')}`,`<button class="secondary" id="mCancel">关闭</button><button class="primary" id="invite">邀请成员</button>`);$('#mCancel').onclick=closeModal;$('#invite').onclick=()=>{showModal('邀请成员',`<label>成员邮箱</label><input class="field" id="inviteEmail" type="email" placeholder="name@example.com"/><div class="info">原型模式：仅展示邀请确认，不会发送真实邮件。</div>`,`<button class="secondary" id="inviteCancel">取消</button><button class="primary" id="inviteSubmit">发送邀请</button>`);$('#inviteCancel').onclick=closeModal;$('#inviteSubmit').onclick=()=>{if(!$('#inviteEmail').value.includes('@')){toast('请输入有效的邮箱');return}closeModal();toast('邀请已记录（原型演示）')}}}
function rename(id){let p=projects.find(p=>p.id===id);showModal('重命名项目',`<label>项目名称</label><input class="field" id="newName" value="${escapeHtml(p.name)}"/>`,`<button class="secondary" id="rCancel">取消</button><button class="primary" id="rSave">保存</button>`);$('#rCancel').onclick=closeModal;$('#rSave').onclick=()=>{let t=$('#newName').value.trim();if(t){p.name=t;closeModal();render();toast('名称已更新')}}}
$$('[data-area]').forEach(b=>b.onclick=()=>{area=b.dataset.area;sub=menus[area][0][0];if(area==='团队')teamUi.query='';searchText='';$('#search').value='';render()});$('#search').addEventListener('input',e=>{searchText=e.target.value;if(area==='团队')teamUi.query=e.target.value;render()});$('#createBtn').onclick=()=>area==='团队'?openTeamCreate():createProject();$('#theme').onclick=()=>document.body.classList.toggle('dark');$('#notice').onclick=()=>{$('#accountMenu').classList.add('hidden');$('#noticeMenu').classList.toggle('hidden')};$('#account').onclick=()=>{$('#noticeMenu').classList.add('hidden');$('#accountMenu').classList.toggle('hidden')};$$('#noticeMenu button,#accountMenu button').forEach(b=>b.onclick=()=>{b.closest('.popup').classList.add('hidden');toast(`${b.textContent}：原型操作演示`)});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}});document.addEventListener('click',e=>{if(!e.target.closest('.more')&&!e.target.closest('.project-card .popup'))$$('.project-card .popup').forEach(el=>el.classList.add('hidden'))});render();
</script><script>
/* Team workspace: local-first interaction prototype, no remote API, no actual invitations. */
const TEAM_STORAGE_KEY='aragonteam.team-prototype.v1';
const TEAM_TYPE_OPTIONS=['内部团队','产品团队','研发团队','设计团队','市场团队','研究团队'];
const TEAM_PALETTE=[['#fff0f0','#ff4c22'],['#e8f2ff','#2685df'],['#e6f9f2','#06996b'],['#f2eaff','#8157de'],['#fff1e8','#f47230'],['#eff2ff','#6e51d4']];
const teamSeedNames=['Ada','李明','张伟','王芳','陈磊','刘洋','赵敏','周杰','孙悦','林琳','何帆','张晨','王莉','郭峰','陈希','唐雪','郑磊','徐静','吴越','杜鹃','江涛','郭悦','许佳','蒋鑫','董博','苏青','叶辰','韩露','余华','林舟','贾宁','程琳','胡凯','姜颖','魏然','丁睿','罗敏','顾凡','郝宇','谢菲','马会','夏明'];
function seedTeamData(){
 const members=teamSeedNames.map((name,i)=>({id:i+1,name,email:`member${i+1}@example.com`,department:['产品','研发','设计','市场','运营'][i%5]}));
 const defs=[
 ['AragonTeam Platform','AI 时代的团队协作与研发管理平台。','内部团队','活跃',[1,2,3,4],Array.from({length:9},(_,i)=>i+1),3,0],
 ['Legallens','法律 AI 助手与知识管理产品团队。','产品团队','活跃',[2,5,6],Array.from({length:7},(_,i)=>i+9),1,1],
 ['Marketing','品牌、市场与用户增长团队。','市场团队','活跃',[7,8,9,10,11],Array.from({length:6},(_,i)=>i+15),2,2],
 ['Research','前沿技术研究与创新探索团队。','研究团队','空闲',[12,13],Array.from({length:5},(_,i)=>i+20),7,3],
 ['Design','产品设计与用户体验团队。','设计团队','活跃',[1,8,14],Array.from({length:8},(_,i)=>i+23),1,4],
 ['Engineering','核心研发与基础设施团队。','研发团队','活跃',[3,5,15,16,17,18],Array.from({length:11},(_,i)=>i+30),0,5],
 ['Operations','跨部门协作与日常运营支持。','内部团队','活跃',[4,11],[1,2,41,42],1,1],
 ['Growth Lab','小规模增长实验与策略验证。','研究团队','空闲',[13],[4,13,26,34,41],14,3]
 ];
 return {version:1, members,teams:defs.map((d,i)=>({id:i+1,name:d[0],description:d[1],type:d[2],status:d[3],projectIds:d[4],memberIds:d[5],days:d[6],colorIndex:d[7],archived:false,roles:Object.fromEntries(d[5].map((id,k)=>[id,k===0?'管理员':'成员']))})),invites:[],nextTeamId:9,nextMemberId:43,nextInviteId:1};}
function loadTeamData(){try{const raw=localStorage.getItem(TEAM_STORAGE_KEY);if(!raw)return seedTeamData();const data=JSON.parse(raw);if(data.version===1 && Array.isArray(data.teams)&&Array.isArray(data.members)&&Array.isArray(data.invites))return data;}catch(e){/* session-only fallback */}return seedTeamData()}
let teamData=loadTeamData();
const teamUi={query:'',status:'all',type:'all',sort:'default',view:'cards',showArchived:false,menuId:null,detailId:null,detailTab:'members'};
function persistTeams(){try{localStorage.setItem(TEAM_STORAGE_KEY,JSON.stringify(teamData));}catch(e){toast('浏览器未允许本地保存，本次修改仅在当前页面有效。')}}
function teamOf(id){return teamData.teams.find(t=>t.id===Number(id))}
function memberOf(id){return teamData.members.find(m=>m.id===Number(id))}
function allLiveTeams(){return teamData.teams.filter(t=>!t.archived)}
function teamMemberIds(){return [...new Set(allLiveTeams().flatMap(t=>t.memberIds))]}
function teamStat(){const ts=allLiveTeams();return {teams:ts.length,members:teamMemberIds().length,projects:new Set(ts.flatMap(t=>t.projectIds)).size,active:ts.filter(t=>t.status==='活跃').length}}
function teamIdentity(t){const [bg,fg]=TEAM_PALETTE[t.colorIndex%TEAM_PALETTE.length];return `<span class="team-avatar" style="--team-avatar-bg:${bg};--team-avatar-fg:${fg}" aria-hidden="true">${escapeHtml(t.name.slice(0,1).toUpperCase())}</span>`}
function teamPeers(t){return `<span class="team-peers" aria-label="${t.memberIds.length} 名成员">${t.memberIds.slice(0,4).map(id=>`<span class="team-peer" title="${escapeHtml(memberOf(id)?.name||'成员')}" aria-hidden="true">${escapeHtml((memberOf(id)?.name||'·').slice(0,1).toUpperCase())}</span>`).join('')}${t.memberIds.length>4?`<span class="team-peer-rest">+${t.memberIds.length-4}</span>`:''}</span>`}
function teamMobileNav(){return `<nav class="team-mobile-tabs" aria-label="团队二级导航">${menus['团队'].map(([label])=>`<button type="button" data-team-nav="${escapeHtml(label)}" class="${label===sub?'active':''}" ${label===sub?'aria-current="page"':''}>${escapeHtml(label)}</button>`).join('')}</nav>`}
function teamKicker(){return `<div class="team-kicker"><span>工作空间</span><span class="sep"></span><span>团队协作</span><span class="team-demo" title="本页面是本地可交互样例，没有连接真实组织数据">演示数据 · 仅本机保存</span></div>`}
function teamMetrics(){const s=teamStat();const vals=[['团队总数',s.teams,'users',''],['团队成员',s.members,'user',''],['关联项目',s.projects,'folder','amber'],['活跃团队',s.active,'board','sky']];return `<section class="team-stats" aria-label="团队概览">${vals.map(([label,n,ico,cls])=>`<div class="team-stat"><span class="team-stat-icon ${cls}">${icon(ico)}</span><div><div class="team-stat-label">${label}</div><div class="team-stat-value">${n}</div><div class="team-stat-note">${label==='活跃团队'?'当前标记为活跃':label==='团队成员'?'跨团队成员去重':'基于当前演示数据'}</div></div></div>`).join('')}</section>`}
function teamSearchToolbar(){return `<div class="team-filterbar" role="search" aria-label="团队列表筛选"><label class="team-filter-search">${icon('search')}<input id="teamQuery" type="search" aria-label="搜索团队名称、描述或成员" placeholder="搜索团队名称、描述或成员..." value="${escapeHtml(teamUi.query)}" autocomplete="off"/>${teamUi.query?'<button type="button" class="clear-search" data-team-action="clear-search" aria-label="清除搜索">×</button>':''}</label><select id="teamStatusFilter" aria-label="按团队状态筛选"><option value="all">全部状态</option><option value="活跃">活跃</option><option value="空闲">空闲</option></select><select id="teamTypeFilter" aria-label="按团队类型筛选"><option value="all">所有类型</option>${TEAM_TYPE_OPTIONS.map(t=>`<option value="${t}">${t}</option>`).join('')}</select><select id="teamSort" aria-label="团队排序"><option value="default">默认排序</option><option value="name">名称 A–Z</option><option value="members">成员最多</option><option value="recent">最近活跃</option></select><div class="team-view-toggle" role="group" aria-label="视图切换"><button data-team-view="cards" aria-pressed="${teamUi.view==='cards'}">▦ 卡片</button><button data-team-view="list" aria-pressed="${teamUi.view==='list'}">☷ 列表</button></div><label class="team-checklabel team-toggle-wrap"><input id="teamArchivedToggle" type="checkbox" ${teamUi.showArchived?'checked':''}/> 包含已归档</label></div>`}
function matchTeam(t){const hay=`${t.name} ${t.description} ${t.type} ${t.memberIds.map(i=>(memberOf(i)?.name||'')+' '+(memberOf(i)?.email||'')).join(' ')}`.toLocaleLowerCase();return (teamUi.showArchived||!t.archived)&&(!t.archived||teamUi.status==='all')&&(teamUi.status==='all'||teamUi.status===t.status)&&(teamUi.type==='all'||teamUi.type===t.type)&&(!teamUi.query||hay.includes(teamUi.query.trim().toLocaleLowerCase()))}
function visibleTeams(){const ts=teamData.teams.filter(matchTeam);if(teamUi.sort==='name')ts.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));if(teamUi.sort==='members')ts.sort((a,b)=>b.memberIds.length-a.memberIds.length);if(teamUi.sort==='recent')ts.sort((a,b)=>a.days-b.days);return ts}
function teamCard(t){return `<article class="team-card" data-team-id="${t.id}"><div class="team-card-header">${teamIdentity(t)}<div class="team-card-info"><button type="button" class="team-name" title="${escapeHtml(t.name)}" data-team-action="details" data-id="${t.id}">${escapeHtml(t.name)}</button><p class="team-descr" title="${escapeHtml(t.description)}">${escapeHtml(t.description)}</p><div class="team-badges"><span class="team-type">${escapeHtml(t.type)}</span><span class="team-status ${t.archived?'archived':t.status==='空闲'?'idle':''}"><i></i>${t.archived?'已归档':t.status}</span></div></div></div><button type="button" class="team-more" data-team-action="toggle-menu" data-id="${t.id}" aria-label="${escapeHtml(t.name)} 更多操作" aria-expanded="${teamUi.menuId===t.id}">${icon('more')}</button>${teamUi.menuId===t.id?`<div class="team-context-menu" role="menu"><button data-team-action="details" data-id="${t.id}">查看团队详情</button><button data-team-action="edit" data-id="${t.id}">编辑团队信息</button><button data-team-action="invite" data-id="${t.id}" ${t.archived?'disabled':''}>邀请成员</button><button class="${t.archived?'':'danger'}" data-team-action="${t.archived?'restore':'archive'}" data-id="${t.id}">${t.archived?'恢复团队':'归档团队'}</button></div>`:''}<div class="team-card-meta"><span>${icon('users')}${t.memberIds.length} 名成员</span><span>${icon('folder')}${t.projectIds.length} 个项目</span><span>${icon('board')}${t.archived?'已归档':t.days===0?'4 小时前活跃':`${t.days} 天前活跃`}</span></div><div class="team-card-foot">${teamPeers(t)}<button type="button" class="team-card-open" data-team-action="details" data-id="${t.id}">查看团队 →</button></div></article>`}
function teamTable(ts){return `<div class="team-plain-table"><table><thead><tr><th scope="col">团队</th><th scope="col">类型</th><th scope="col">状态</th><th scope="col">成员</th><th scope="col">项目</th><th scope="col">最近活跃</th><th scope="col">操作</th></tr></thead><tbody>${ts.map(t=>`<tr><td><button data-team-action="details" data-id="${t.id}">${escapeHtml(t.name)}</button></td><td>${escapeHtml(t.type)}</td><td><span class="team-status ${t.archived?'archived':t.status==='空闲'?'idle':''}">${t.archived?'已归档':t.status}</span></td><td>${t.memberIds.length}</td><td>${t.projectIds.length}</td><td>${t.days===0?'4 小时前':t.days+' 天前'}</td><td><button data-team-action="${t.archived?'restore':'details'}" data-id="${t.id}">${t.archived?'恢复':'查看'}</button></td></tr>`).join('')}</tbody></table></div>`}
function teamResults(){const ts=visibleTeams();return `<section class="team-results"><div class="team-listhead"><strong>所有团队 <span style="color:#7e91b6">(${ts.length})</span></strong><span>点击团队名称查看成员、权限与项目</span></div>${ts.length?(teamUi.view==='cards'?`<div class="team-card-grid">${ts.map(teamCard).join('')}</div>`:teamTable(ts)):`<div class="team-empty">${icon('search')}<h3>未找到符合条件的团队</h3><p>调整关键词或筛选条件，也可以创建新团队。</p><button type="button" data-team-action="reset-filters">清除筛选</button></div>`}</section>`}
function teamRightRail(){return `<aside class="team-side" aria-label="团队快捷信息"><section class="team-side-card"><h3>快捷操作</h3><button class="team-quick" data-team-action="create"><span class="quick-icon">${icon('plus')}</span>新建团队</button><button class="team-quick" data-team-action="invite"><span class="quick-icon">${icon('user')}</span>邀请成员</button><button class="team-quick" data-team-nav="成员管理"><span class="quick-icon">${icon('users')}</span>成员管理</button><button class="team-quick" data-team-nav="邀请记录"><span class="quick-icon">${icon('page')}</span>邀请记录 <span style="margin-left:auto;color:#f15c2f">${teamData.invites.filter(i=>i.status==='待接受').length||''}</span></button></section><section class="team-side-card"><h3>团队概况</h3><div class="team-info-entry"><span>当前活跃团队</span><strong>${teamStat().active} / ${teamStat().teams}</strong></div><div class="team-info-entry"><span>待处理邀请</span><strong>${teamData.invites.filter(i=>i.status==='待接受').length}</strong></div><div class="team-info-entry"><span>已归档团队</span><strong>${teamData.teams.filter(t=>t.archived).length}</strong></div><button class="team-side-link" data-team-nav="角色权限">查看角色权限说明 →</button></section><section class="team-side-card"><h3>需要帮助？</h3><p style="color:#7789ae;font-size:12px;line-height:1.8;margin:0">快速了解团队成员、权限和邀请流程。操作仅保存在当前浏览器。</p><button class="team-side-link" data-team-action="help">了解团队管理 →</button></section></aside>`}
function teamOverview(){return teamMetrics()+teamSearchToolbar()+`<div class="team-workspace"><div id="teamResults">${teamResults()}</div>${teamRightRail()}</div>`}
function teamMembersPage(){const ids=teamMemberIds().filter(id=>{const m=memberOf(id);return !teamUi.query||`${m?.name||''} ${m?.email||''} ${allLiveTeams().filter(t=>t.memberIds.includes(id)).map(t=>t.name).join(' ')}`.toLocaleLowerCase().includes(teamUi.query.toLocaleLowerCase())});const rows=ids.map(id=>{const m=memberOf(id);if(!m)return '';const ts=allLiveTeams().filter(t=>t.memberIds.includes(id));return `<tr><td><span class="team-mini-avatar">${escapeHtml(m.name.charAt(0))}</span>${escapeHtml(m.name)}</td><td>${escapeHtml(m.email)}</td><td>${ts.length} 个团队</td><td>${escapeHtml(ts.slice(0,3).map(t=>t.name).join('、'))}${ts.length>3?'…':''}</td><td><button data-team-action="member-detail" data-id="${id}">查看归属</button></td></tr>`}).join('');return `<div class="team-subpage"><div class="team-section-head"><div><h3>成员管理 <span style="font-size:13px;color:#7086b1">(${ids.length})</span></h3><p>跨团队去重，点击成员查看团队归属和角色。</p></div><button class="team-small-btn" data-team-action="invite">＋ 邀请成员</button></div><div class="team-plain-table team-table-scroll"><table><thead><tr><th>成员</th><th>邮箱</th><th>加入团队</th><th>团队归属</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
function teamRolesPage(){const roles=[['管理员','管理团队资料、成员与邀请；可调整其他成员权限','完整管理'],['成员','查看团队内容，参与团队项目和协作','日常协作'],['访客','仅限被授予的团队信息（原型说明）','只读访问']];return `<div class="team-subpage"><div class="team-section-head"><div><h3>角色与权限</h3><p>权限最小化：先明确角色，再邀请成员。</p></div><button class="team-small-btn" data-team-action="help">查看使用建议</button></div><div class="team-plain-table"><table><thead><tr><th>角色</th><th>团队管理</th><th>成员与邀请</th><th>浏览团队</th></tr></thead><tbody><tr><td><strong>管理员</strong></td><td>可管理</td><td>可管理</td><td>可查看</td></tr><tr><td><strong>成员</strong></td><td>不可管理</td><td>不可管理</td><td>可查看</td></tr><tr><td><strong>访客</strong></td><td>不可管理</td><td>不可管理</td><td>有限查看</td></tr></tbody></table></div><div class="team-type-guide">${roles.map(r=>`<h4>${r[0]} · ${r[2]}</h4><p>${r[1]}</p>`).join('')}<div class="team-modal-summary">这是产品设计原型中的权限定义。真实产品还需要服务端鉴权、审计日志和细粒度资源授权，不能仅依赖页面控制。</div></div></div>`}
function teamInvitesPage(){const matched=teamData.invites.filter(i=>!teamUi.query||`${i.email} ${teamOf(i.teamId)?.name||''} ${i.role}`.toLocaleLowerCase().includes(teamUi.query.toLocaleLowerCase()));return `<div class="team-subpage"><div class="team-section-head"><div><h3>邀请记录 <span style="font-size:13px;color:#7086b1">(${matched.length})</span></h3><p>所有记录保存在本机，未实际发送邮件。</p></div><button class="team-small-btn" data-team-action="invite">＋ 新建邀请</button></div>${matched.length?matched.slice().reverse().map(i=>`<article class="team-inv-card"><div><strong>${escapeHtml(i.email)}</strong> <span class="team-role-pill">${escapeHtml(i.role)}</span><div class="team-message">${escapeHtml(teamOf(i.teamId)?.name||'已归档团队')} · ${escapeHtml(i.status)} · ${new Date(i.createdAt).toLocaleDateString('zh-CN')}</div></div><div class="team-inv-actions">${i.status==='待接受'?`<button class="team-small-btn" data-team-action="resend-invite" data-id="${i.id}">重新记录</button><button class="team-small-btn" data-team-action="cancel-invite" data-id="${i.id}">取消邀请</button>`:'<span class="team-role-pill">已取消</span>'}</div></article>`).join(''):`<div class="team-empty"><h3>还没有邀请记录</h3><p>邀请成员后可以在这里查看和取消。</p><button data-team-action="invite">邀请第一位成员</button></div>`}</div>`}
function teamSettingsPage(){return `<div class="team-subpage"><div class="team-section-head"><div><h3>团队设置</h3><p>仅影响本机演示数据与当前浏览器。</p></div></div><div class="team-info-entry"><div><strong>下载团队数据</strong><div style="margin-top:4px">导出当前团队、成员与邀请的 JSON 备份。</div></div><button class="team-small-btn" data-team-action="export">导出 JSON</button></div><div class="team-info-entry"><div><strong>恢复演示数据</strong><div style="margin-top:4px">清空本机的团队修改并恢复初始样例，需二次确认。</div></div><button class="team-small-btn" data-team-action="reset-data">恢复初始数据</button></div><div class="team-modal-summary">本页没有连接真实组织后端，不会实际发送邀请、修改账号权限或更新项目数据库。</div></div>`}
function renderTeamSection(){
 $('#pageTitle').textContent=sub==='团队管理'?'团队':sub;
 $('#pageSubtitle').textContent=sub==='团队管理'?'组织你的成员，分配他们到项目中，高效协作。':({成员管理:'集中查看成员与所属团队',角色权限:'清晰的职责边界与权限设计',邀请记录:'管理待处理的团队邀请',团队设置:'管理团队原型和演示数据'}[sub]||'团队协作与成员管理');
 $('#createBtn').style.display='inline-flex';$('#createText').textContent='新建团队';
 $('#search').placeholder='搜索团队、成员或项目...';$('#search').setAttribute('aria-label','搜索团队或成员');
 const sections={'团队管理':teamOverview,'成员管理':teamMembersPage,'角色权限':teamRolesPage,'邀请记录':teamInvitesPage,'团队设置':teamSettingsPage};
 $('#content').innerHTML=`<div class="team-page">${teamMobileNav()}${teamKicker()}${(sections[sub]||teamOverview)()}</div>`;
 const s=$('#teamStatusFilter'),t=$('#teamTypeFilter'),o=$('#teamSort');if(s)s.value=teamUi.status;if(t)t.value=teamUi.type;if(o)o.value=teamUi.sort;
}
function repaintTeamResults(){const el=$('#teamResults');if(el)el.innerHTML=teamResults();const c=$('.team-filter-search .clear-search');if(!c && teamUi.query){const inp=$('#teamQuery');if(inp){const b=document.createElement('button');b.type='button';b.className='clear-search';b.dataset.teamAction='clear-search';b.setAttribute('aria-label','清除搜索');b.textContent='×';inp.parentElement.appendChild(b)}}else if(c&&!teamUi.query)c.remove()}
function resetTeamFilters(){teamUi.query='';teamUi.type='all';teamUi.status='all';teamUi.sort='default';teamUi.showArchived=false;teamUi.menuId=null;searchText='';$('#search').value='';renderTeamSection();toast('已清除团队筛选条件')}
function teamDialog(title,html,{wide=false}={}){if(!$('#modalContainer [role="dialog"]'))teamModalReturnFocus=document.activeElement;showModal(title,html);if(wide){const d=$('.modal');if(d)d.classList.add('team-modal-wide')}setTimeout(()=>{const focus=$('#modalContainer input:not([type="hidden"]),#modalContainer select,#modalContainer button');if(focus)focus.focus()},0)}
function openTeamCreate(){const memberOptions=teamData.members.slice(1,10).map(m=>`<label class="team-checklabel"><input type="checkbox" name="initialMembers" value="${m.id}"/> ${escapeHtml(m.name)}</label>`).join('');teamDialog('新建团队',`<form id="teamCreateForm"><label class="team-form-label" for="newTeamName">团队名称 *</label><input id="newTeamName" class="field" name="name" required maxlength="64" placeholder="例如：产品体验团队" autocomplete="off"/><label class="team-form-label" for="newTeamType">团队类型</label><select id="newTeamType" class="field" name="type">${TEAM_TYPE_OPTIONS.map(t=>`<option>${t}</option>`).join('')}</select><label class="team-form-label" for="newTeamDescription">团队简介</label><textarea class="field textarea" name="description" id="newTeamDescription" maxlength="160" placeholder="一句话说明团队的工作目标"></textarea><p class="team-form-subtitle">初始成员（可选） · 管理员 Ada 自动加入</p><div class="team-choice-group" style="gap:11px 14px">${memberOptions}</div><div class="team-modal-summary">创建后可以调整成员、关联项目与团队状态。这里仅保存到当前浏览器。</div><div class="team-error" id="teamCreateError" role="alert"></div><div class="modal-foot"><button class="secondary" type="button" data-team-action="close">取消</button><button class="primary" type="submit">创建团队</button></div></form>`,{wide:true})}
function teamEdit(id){const t=teamOf(id);if(!t)return;teamDialog('编辑团队',`<form id="teamEditForm" data-id="${id}"><label class="team-form-label" for="editTeamName">团队名称 *</label><input class="field" id="editTeamName" required maxlength="64" value="${escapeHtml(t.name)}"/><label class="team-form-label" for="editTeamType">团队类型</label><select class="field" id="editTeamType">${TEAM_TYPE_OPTIONS.map(o=>`<option ${o===t.type?'selected':''}>${o}</option>`).join('')}</select><label class="team-form-label" for="editTeamDesc">团队简介</label><textarea class="field textarea" id="editTeamDesc" maxlength="160">${escapeHtml(t.description)}</textarea><label class="team-form-label" for="editTeamStatus">团队状态</label><select class="field" id="editTeamStatus"><option ${t.status==='活跃'?'selected':''}>活跃</option><option ${t.status==='空闲'?'selected':''}>空闲</option></select><div class="team-error" id="teamEditError" role="alert"></div><div class="modal-foot"><button class="secondary" type="button" data-team-action="close">取消</button><button class="primary" type="submit">保存修改</button></div></form>`)}
function detailPane(t){const tab=teamUi.detailTab;const tabs=`<div class="team-choice-group" role="tablist" aria-label="团队详情"><button type="button" role="tab" data-team-action="detail-tab" data-tab="members" aria-selected="${tab==='members'}" aria-pressed="${tab==='members'}">成员 (${t.memberIds.length})</button><button type="button" role="tab" data-team-action="detail-tab" data-tab="projects" aria-selected="${tab==='projects'}" aria-pressed="${tab==='projects'}">关联项目 (${t.projectIds.length})</button><button type="button" role="tab" data-team-action="detail-tab" data-tab="access" aria-selected="${tab==='access'}" aria-pressed="${tab==='access'}">权限</button></div>`;
 let body='';if(tab==='members')body=`<div class="team-plain-table"><table style="min-width:430px"><thead><tr><th>成员</th><th>身份</th><th>操作</th></tr></thead><tbody>${t.memberIds.map(id=>{const m=memberOf(id);const role=t.roles[id]||'成员';return `<tr><td><span class="team-mini-avatar">${escapeHtml(m?.name[0]||'?')}</span>${escapeHtml(m?.name||'成员')}</td><td><span class="team-role-pill">${escapeHtml(role)}</span></td><td><span class="team-member-controls"><select data-team-role="${id}" data-team-id="${t.id}" aria-label="调整 ${escapeHtml(m?.name||'成员')} 的角色">${['管理员','成员','访客'].map(x=>`<option ${x===role?'selected':''}>${x}</option>`).join('')}</select><button type="button" data-team-action="remove-member" data-id="${t.id}" data-mid="${id}">移除</button></span></td></tr>`}).join('')}</tbody></table></div>`;else if(tab==='projects')body=`<div class="team-plain-table"><table style="min-width:380px"><thead><tr><th>项目编号</th><th>协作状态</th></tr></thead><tbody>${t.projectIds.map(id=>`<tr><td>项目 #${id}</td><td>已关联（演示关系）</td></tr>`).join('')||'<tr><td colspan="2">暂未关联项目</td></tr>'}</tbody></table></div><p class="team-field-help">项目编号是演示占位，不代表已经关联真实项目数据。</p>`;else body=`<div class="team-type-guide"><h4>团队权限规则</h4><p>管理员可管理团队资料、成员和邀请；成员可参与团队工作；访客仅有基本查看权限。</p><p style="margin-top:9px">调整成员角色会更新当前原型状态，不涉及服务端权限。</p></div>`;
 return tabs+body}
function teamDetails(id){const t=teamOf(id);if(!t)return;teamUi.detailId=t.id;teamUi.menuId=null;teamDialog(t.name,`<div style="display:flex;gap:14px;align-items:center">${teamIdentity(t)}<div><strong style="font-size:16px">${escapeHtml(t.name)}</strong><p class="team-modal-info">${escapeHtml(t.description)}</p><div class="team-badges"><span class="team-type">${escapeHtml(t.type)}</span><span class="team-status ${t.archived?'archived':t.status==='空闲'?'idle':''}">${t.archived?'已归档':t.status}</span></div></div></div><div id="teamDetailPane">${detailPane(t)}</div><div class="modal-foot"><button class="secondary" data-team-action="edit" data-id="${t.id}">编辑资料</button><button class="secondary" data-team-action="add-member" data-id="${t.id}" ${t.archived?'disabled':''}>添加成员</button><button class="primary" data-team-action="invite" data-id="${t.id}" ${t.archived?'disabled':''}>邀请成员</button></div>`,{wide:true})}
function addTeamMemberDialog(id){const t=teamOf(id);if(!t)return;const available=teamData.members.filter(m=>!t.memberIds.includes(m.id));if(!available.length){toast('现有成员已全部加入，可通过邀请增加新成员');return}teamDialog('添加现有成员',`<form id="teamAddMemberForm" data-id="${id}"><label class="team-form-label" for="addMemberSelect">选择成员</label><select class="field" id="addMemberSelect">${available.map(m=>`<option value="${m.id}">${escapeHtml(m.name)} · ${escapeHtml(m.email)}</option>`).join('')}</select><label class="team-form-label" for="addMemberRole">团队角色</label><select class="field" id="addMemberRole"><option>成员</option><option>管理员</option><option>访客</option></select><div class="modal-foot"><button class="secondary" type="button" data-team-action="details" data-id="${id}">取消</button><button class="primary" type="submit">添加到团队</button></div></form>`)}
function teamInvite(id){const eligible=allLiveTeams(),selected=Number(id)||eligible[0]?.id;if(!eligible.length){toast('请先创建团队');openTeamCreate();return}const t=teamOf(selected);teamDialog('邀请成员',`<form id="teamInviteForm"><label class="team-form-label" for="inviteTeam">所属团队</label><select class="field" name="teamId" id="inviteTeam">${eligible.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select><label class="team-form-label" for="teamInviteEmail">成员邮箱 *</label><input id="teamInviteEmail" class="field" required type="email" autocomplete="email" placeholder="name@example.com" maxlength="150"/><label class="team-form-label" for="teamInviteRole">邀请角色</label><select id="teamInviteRole" class="field"><option>成员</option><option>访客</option><option>管理员</option></select><p class="team-modal-summary">演示模式：此操作只会创建一条本地邀请记录，不会发送邮件或授予真实权限。</p><div class="team-error" id="teamInviteError" role="alert"></div><div class="modal-foot"><button type="button" class="secondary" data-team-action="close">取消</button><button type="submit" class="primary">记录邀请</button></div></form>`)}
function archiveTeam(id){const t=teamOf(id);if(!t||t.archived)return;teamDialog('归档团队',`<p class="team-modal-info">确定归档「${escapeHtml(t.name)}」吗？归档后默认列表将隐藏该团队。成员资料不会删除，你可以勾选“包含已归档”随时恢复。</p><div class="modal-foot"><button class="secondary" data-team-action="close">返回</button><button class="primary team-danger-btn" data-team-action="confirm-archive" data-id="${id}">确认归档</button></div>`)}
function confirmRemoveMember(id,mid){const t=teamOf(id),m=memberOf(mid);if(!t||!m)return;if((t.roles[mid]||'成员')==='管理员'&&t.memberIds.filter(k=>t.roles[k]==='管理员').length<=1){toast('至少保留一位管理员，无法移除最后的管理员');return}teamDialog('移除成员',`<p class="team-modal-info">从「${escapeHtml(t.name)}」移除 ${escapeHtml(m.name)}？其他团队中的成员身份不会改变。</p><div class="modal-foot"><button class="secondary" data-team-action="details" data-id="${id}">取消</button><button class="primary team-danger-btn" data-team-action="confirm-remove-member" data-id="${id}" data-mid="${mid}">确认移除</button></div>`)}
function teamHelp(){teamDialog('如何管理团队',`<div class="team-type-guide"><h4>1. 创建团队</h4><p>填写名称、类型和说明，管理员会默认加入。可以一次选入常用成员。</p><h4>2. 分配角色</h4><p>在团队详情中修改成员身份；最后一位管理员不能被移除或降级。</p><h4>3. 邀请成员</h4><p>原型将邀请记录留在本机，不会实际发信。邀请记录可查看与取消。</p><h4>4. 归档与恢复</h4><p>归档不会删除成员资料；勾选“包含已归档”后可恢复。</p><p class="team-modal-summary">这是验证体验的单文件原型：没有连接正式服务端。不同设备和浏览器之间的数据不会同步。</p></div><div class="modal-foot"><button class="primary" data-team-action="close">知道了</button></div>`,{wide:true})}
function showMemberDetails(mid){const m=memberOf(mid);if(!m)return;const ts=allLiveTeams().filter(t=>t.memberIds.includes(mid));teamDialog(m.name,`<div class="team-modal-info">邮箱：${escapeHtml(m.email)}</div><div class="team-plain-table" style="margin-top:13px"><table style="min-width:360px"><thead><tr><th>所属团队</th><th>角色</th></tr></thead><tbody>${ts.map(t=>`<tr><td><button data-team-action="details" data-id="${t.id}">${escapeHtml(t.name)}</button></td><td>${escapeHtml(t.roles[mid]||'成员')}</td></tr>`).join('')}</tbody></table></div><div class="modal-foot"><button class="primary" data-team-action="close">完成</button></div>`,{wide:true})}
function downloadTeamExport(){const content=JSON.stringify({exportedAt:new Date().toISOString(),note:'AragonTeam local demo data, not production records',...teamData},null,2);const blob=new Blob([content],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='aragonteam-team-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('已导出演示数据')}
function teamResetDialog(){teamDialog('恢复初始数据',`<p class="team-modal-info">此操作会覆盖本机的全部团队演示更改（含邀请和自建团队）。建议先导出备份。</p><div class="modal-foot"><button class="secondary" data-team-action="close">取消</button><button class="primary team-danger-btn" data-team-action="confirm-reset">确认恢复</button></div>`)}
const teamActions={
 'create':()=>openTeamCreate(),'close':()=>closeModal(),'help':()=>teamHelp(),'details':el=>teamDetails(el.dataset.id),'edit':el=>teamEdit(el.dataset.id),'invite':el=>teamInvite(el.dataset.id),
 'toggle-menu':el=>{const id=Number(el.dataset.id);teamUi.menuId=teamUi.menuId===id?null:id;repaintTeamResults()},
 'archive':el=>archiveTeam(el.dataset.id),'restore':el=>{const t=teamOf(el.dataset.id);if(!t)return;t.archived=false;persistTeams();teamUi.menuId=null;renderTeamSection();toast('团队已恢复')},
 'confirm-archive':el=>{const t=teamOf(el.dataset.id);if(!t)return;t.archived=true;teamUi.menuId=null;persistTeams();closeModal();renderTeamSection();toast('团队已归档，可从“包含已归档”恢复')},
 'clear-search':()=>{teamUi.query='';searchText='';$('#search').value='';const q=$('#teamQuery');if(q){q.value='';q.focus()}repaintTeamResults()},
 'reset-filters':()=>resetTeamFilters(),
 'detail-tab':el=>{teamUi.detailTab=el.dataset.tab;const t=teamOf(teamUi.detailId);if(t)$('#teamDetailPane').innerHTML=detailPane(t)},
 'add-member':el=>addTeamMemberDialog(el.dataset.id),
 'remove-member':el=>confirmRemoveMember(Number(el.dataset.id),Number(el.dataset.mid)),
 'confirm-remove-member':el=>{const t=teamOf(el.dataset.id),mid=Number(el.dataset.mid);if(!t)return;t.memberIds=t.memberIds.filter(id=>id!==mid);delete t.roles[mid];persistTeams();teamDetails(t.id);toast('成员已从该团队移除')},
 'member-detail':el=>showMemberDetails(el.dataset.id),
 'resend-invite':el=>{const i=teamData.invites.find(x=>x.id===Number(el.dataset.id));if(!i)return;i.createdAt=Date.now();persistTeams();renderTeamSection();toast('已更新本地提醒记录（未发送邮件）')},
 'cancel-invite':el=>{const i=teamData.invites.find(x=>x.id===Number(el.dataset.id));if(!i)return;i.status='已取消';persistTeams();renderTeamSection();toast('邀请已取消')},
 'export':()=>downloadTeamExport(),'reset-data':()=>teamResetDialog(),
 'confirm-reset':()=>{teamData=seedTeamData();persistTeams();closeModal();teamUi.query='';teamUi.showArchived=false;sub='团队管理';render();toast('初始演示数据已恢复')}
};

// Return keyboard focus to the opener after a team dialog closes (including Esc and backdrop).
let teamModalReturnFocus = null;
const closeModalBeforeTeamFocus = closeModal;
closeModal = function () {
 const target = teamModalReturnFocus;
 closeModalBeforeTeamFocus();
 teamModalReturnFocus = null;
 if (target && target.isConnected && typeof target.focus === 'function') target.focus({preventScroll:true});
};

// Event delegation: survives re-renders without accumulating duplicate handlers.
$('#content').addEventListener('click',event=>{const nav=event.target.closest('[data-team-nav]');if(nav){sub=nav.dataset.teamNav;teamUi.menuId=null;render();return}const target=event.target.closest('[data-team-action]');if(!target)return;const fn=teamActions[target.dataset.teamAction];if(fn){event.preventDefault();fn(target)}});
$('#modalContainer').addEventListener('click',event=>{const target=event.target.closest('[data-team-action]');if(!target)return;const fn=teamActions[target.dataset.teamAction];if(fn){event.preventDefault();fn(target)}});
$('#content').addEventListener('input',e=>{if(e.target.id==='teamQuery'){teamUi.query=e.target.value;searchText=e.target.value;$('#search').value=e.target.value;repaintTeamResults()}});
$('#content').addEventListener('change',e=>{const id=e.target.id;if(id==='teamStatusFilter')teamUi.status=e.target.value;else if(id==='teamTypeFilter')teamUi.type=e.target.value;else if(id==='teamSort')teamUi.sort=e.target.value;else if(id==='teamArchivedToggle')teamUi.showArchived=e.target.checked;else return;teamUi.menuId=null;renderTeamSection()});
$('#content').addEventListener('click',e=>{const b=e.target.closest('[data-team-view]');if(b){teamUi.view=b.dataset.teamView;teamUi.menuId=null;renderTeamSection()}});
$('#modalContainer').addEventListener('change',e=>{const el=e.target;if(!el.matches('[data-team-role]'))return;const t=teamOf(el.dataset.teamId),mid=Number(el.dataset.teamRole);if(!t)return;const current=t.roles[mid]||'成员';if(current==='管理员'&&el.value!=='管理员'&&t.memberIds.filter(id=>t.roles[id]==='管理员').length<=1){el.value=current;toast('每个团队至少需要一位管理员');return}t.roles[mid]=el.value;persistTeams();teamDetails(t.id);toast('成员角色已更新（本地演示）')});
$('#modalContainer').addEventListener('submit',e=>{
 const f=e.target;if(!['teamCreateForm','teamEditForm','teamInviteForm','teamAddMemberForm'].includes(f.id))return;
 e.preventDefault(); if(f.id==='teamCreateForm'){
  const name=$('#newTeamName').value.trim(),desc=$('#newTeamDescription').value.trim(),type=$('#newTeamType').value;
  if(name.length<2){$('#teamCreateError').textContent='团队名称至少需要 2 个字符';return}
  if(teamData.teams.some(t=>!t.archived&&t.name.toLocaleLowerCase()===name.toLocaleLowerCase())){$('#teamCreateError').textContent='已有同名团队，请使用不同名称';return}
  const chosen=[...f.querySelectorAll('input[name="initialMembers"]:checked')].map(n=>Number(n.value));
  const ids=[1,...chosen.filter(id=>id!==1)]; const id=teamData.nextTeamId++;
  teamData.teams.unshift({id,name,description:desc||'暂无团队简介',type,status:'活跃',projectIds:[],memberIds:ids,days:0,colorIndex:(id+1)%TEAM_PALETTE.length,archived:false,roles:Object.fromEntries(ids.map((x,i)=>[x,i===0?'管理员':'成员']))});
  persistTeams();closeModal();sub='团队管理';teamUi.query='';searchText='';$('#search').value='';render();toast('团队已创建（保存在本机）');return;
 }
 if(f.id==='teamEditForm'){
  const t=teamOf(f.dataset.id),name=$('#editTeamName').value.trim();if(!t)return;
  if(name.length<2){$('#teamEditError').textContent='团队名称至少需要 2 个字符';return}
  if(teamData.teams.some(x=>x.id!==t.id&&!x.archived&&x.name.toLocaleLowerCase()===name.toLocaleLowerCase())){$('#teamEditError').textContent='已有同名团队';return}
  t.name=name;t.type=$('#editTeamType').value;t.status=$('#editTeamStatus').value;t.description=$('#editTeamDesc').value.trim()||'暂无团队简介';persistTeams();closeModal();renderTeamSection();toast('团队资料已保存');return;
 }
 if(f.id==='teamInviteForm'){
  const id=Number($('#inviteTeam').value),t=teamOf(id),email=$('#teamInviteEmail').value.trim().toLowerCase(),role=$('#teamInviteRole').value;
  if(!t||t.archived){$('#teamInviteError').textContent='请选择有效团队';return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){$('#teamInviteError').textContent='请输入有效的邮箱地址';return}
  if(t.memberIds.some(mid=>memberOf(mid)?.email.toLowerCase()===email)){$('#teamInviteError').textContent='该邮箱已是此团队成员';return}
  if(teamData.invites.some(i=>i.teamId===id&&i.email===email&&i.status==='待接受')){$('#teamInviteError').textContent='该邮箱已有一条待接受的邀请';return}
  teamData.invites.push({id:teamData.nextInviteId++,teamId:id,email,role,status:'待接受',createdAt:Date.now()});persistTeams();closeModal();sub='邀请记录';render();toast('邀请已记入本机（未实际发邮件）');return;
 }
 if(f.id==='teamAddMemberForm'){
  const t=teamOf(f.dataset.id),mid=Number($('#addMemberSelect').value),role=$('#addMemberRole').value;
  if(!t||t.memberIds.includes(mid))return;t.memberIds.push(mid);t.roles[mid]=role;persistTeams();teamDetails(t.id);toast('成员已添加至团队');
 }
});
// Escape/backdrop behavior is shared with existing project dialogs; prevent focus from leaving active team modal.
document.addEventListener('keydown',e=>{const dlg=$('#modalContainer [role="dialog"]');if(!dlg||e.key!=='Tab')return;const items=[...dlg.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]')].filter(x=>x.getClientRects().length);if(items.length<1)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
document.addEventListener('click',e=>{if(!e.target.closest('.team-context-menu')&&!e.target.closest('.team-more')&&teamUi.menuId!==null&&area==='团队'){teamUi.menuId=null;repaintTeamResults()}});

</script></body></html>
