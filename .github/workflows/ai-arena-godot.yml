name: AI Arena Godot 3D

on:
  push:
    branches:
      - feat/ai-arena-godot-3d-experience-v01
    paths:
      - "11-ai-arena/godot/**"
      - ".github/workflows/ai-arena-godot.yml"
  pull_request:
    branches:
      - feat/ai-arena-independent-agent-workspace-v04
    paths:
      - "11-ai-arena/godot/**"
      - ".github/workflows/ai-arena-godot.yml"
  workflow_dispatch:
    inputs:
      rebuild_blender_assets:
        description: "Rebuild the editable Blender source and all GLB assets"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ai-arena-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-and-blender:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install Blender when the source builder is present
        if: hashFiles('11-ai-arena/godot/assets/generated/agents/value.glb') == '' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_blender_assets == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[rebuild-ai-arena-assets]'))
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy

      - name: Build Blender source and GLB assets
        id: build_assets
        if: hashFiles('11-ai-arena/godot/assets/generated/agents/value.glb') == '' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_blender_assets == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[rebuild-ai-arena-assets]'))
        working-directory: 11-ai-arena/godot
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --factory-startup --python-exit-code 1 --python blender/build_ai_arena_assets.py -- --output assets
          find assets/source -type f -name '*.blend1' -delete
          find assets/source -type f -name '*.blend2' -delete
          find assets/source assets/generated -maxdepth 3 -type f -printf '%p %s bytes\n'

      - name: Install Godot 4.7.1 stable
        run: |
          mkdir -p /tmp/godot
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Run Python asset contract
        working-directory: 11-ai-arena/godot
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Import project and parse all scenes
        working-directory: 11-ai-arena/godot
        run: bash tools/run_godot_check.sh /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 import --headless --editor --path . --quit

      - name: Run simulation contract
        working-directory: 11-ai-arena/godot
        run: bash tools/run_godot_check.sh /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 simulation --headless --path . --script res://tests/test_arena.gd

      - name: Run 3D world contract
        working-directory: 11-ai-arena/godot
        run: bash tools/run_godot_check.sh /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 world --headless --path . --script res://tests/test_world_contract.gd

      - name: Run responsive UI contract
        working-directory: 11-ai-arena/godot
        run: bash tools/run_godot_check.sh /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 ui --headless --path . --script res://tests/test_ui_contract.gd

      - name: Run main scene smoke test
        working-directory: 11-ai-arena/godot
        run: bash tools/run_godot_check.sh /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 smoke --headless --path . --quit-after 4

      - name: Capture desktop and mobile visual QA
        working-directory: 11-ai-arena/godot
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 bash tools/run_godot_check.sh /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 visual --path . --script res://tests/capture_visual.gd
          test -s visual-qa/arena-desktop.png
          test -s visual-qa/investor-desktop.png
          test -s visual-qa/investor-mobile.png

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-investment-arena-visual-qa
          path: 11-ai-arena/godot/visual-qa/*.png
          if-no-files-found: error

      - name: Verify generated Blender assets
        if: hashFiles('11-ai-arena/godot/tools/verify_generated_assets.py') != ''
        working-directory: 11-ai-arena/godot
        run: python3 tools/verify_generated_assets.py --require-generated

      - name: Commit generated Blender assets to the feature branch
        if: steps.build_assets.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 11-ai-arena/godot/assets/source 11-ai-arena/godot/assets/generated
          if ! git diff --cached --quiet; then
            git commit -m "build(ai-arena): add Blender 3D source assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Package Godot project
        if: success()
        run: |
          cd 11-ai-arena/godot
          zip -qr /tmp/ai-investment-arena-godot.zip . -x ".godot/*" ".venv/*" "*/.venv/*" "__pycache__/*" "*/__pycache__/*" "visual-qa/*" "*.pyc" "*.pyo" "*.blend1" "*.blend2"

      - name: Upload Godot project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-investment-arena-godot
          path: /tmp/ai-investment-arena-godot.zip
          if-no-files-found: warn
