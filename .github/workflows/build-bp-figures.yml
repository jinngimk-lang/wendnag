name: Build BP figures

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - bp/code-drawn-figures-v1
    paths:
      - '04-assets/figures/src/draw_bp_figures.py'
      - '.github/workflows/build-bp-figures.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install drawing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install matplotlib

      - name: Render deterministic figures
        run: python 04-assets/figures/src/draw_bp_figures.py

      - name: Verify expected outputs
        run: |
          test "$(find 04-assets/figures/png -maxdepth 1 -name '*.png' | wc -l)" -eq 8
          test "$(find 04-assets/figures/svg -maxdepth 1 -name '*.svg' | wc -l)" -eq 8
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected = {
            'fig01-three-layer-enterprise-intelligence-base.png': (3194,1758),
            'fig02-enterprise-agentic-ai-market.png': (2360,1840),
            'fig03-enterprise-ai-four-level-ladder.png': (3194,1636),
            'fig10-three-delivery-models.png': (3194,1450),
            'fig11-legallens-four-layer-architecture.png': (3194,1820),
            'fig12-revenue-and-customer-replication.png': (3194,1636),
            'fig15-funding-use-structure.png': (2716,1004),
            'fig16-three-year-milestones.png': (3194,1020),
          }
          for name, size in expected.items():
              got = Image.open(Path('04-assets/figures/png') / name).size
              assert got == size, (name, got, size)
          print('figure verification passed')
          PY

      - name: Commit rendered figures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 04-assets/figures/png 04-assets/figures/svg
          if git diff --cached --quiet; then
            echo 'No figure changes to commit.'
          else
            git commit -m 'build: render code-drawn BP figures'
            git push
          fi
