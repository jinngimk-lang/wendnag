name: Research video probe

on:
  push:
    branches:
      - research/video-content-deep-dive-20260923
    paths:
      - ".github/workflows/research-video-probe.yml"

permissions:
  contents: read

jobs:
  probe-public-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg aria2 jq curl
          python -m pip install --upgrade yt-dlp
          git clone --depth 1 https://github.com/zyipeng/video-downloader.git /tmp/video-downloader
          mkdir -p "$GITHUB_WORKSPACE/results"

      - name: Probe and sample Douyin and Kuaishou links
        shell: bash
        run: |
          set +e
          TOOL=/tmp/video-downloader
          OUT="$GITHUB_WORKSPACE/results"

          cat > /tmp/links.tsv <<'EOF'
          20260615_dy	https://v.douyin.com/1K9W0DPXTLk/	dy
          20260615_ks	https://v.kuaishou.com/K72MuhI9	ks
          20260616_dy	https://v.douyin.com/iIlQN970zYE/	dy
          20260616_ks	https://v.kuaishou.com/njcJZm1T	ks
          20260617_dy	https://v.douyin.com/Qt2PcG-mF3c/	dy
          20260617_ks	https://v.kuaishou.com/Jn7T9JDc	ks
          20260619a_dy	https://v.douyin.com/bGF3BJdJ9LY/	dy
          20260619a_ks	https://v.kuaishou.com/nUbXP6Ht	ks
          20260619b_dy	https://v.douyin.com/I5KkpBlXrSg/	dy
          20260619b_ks	https://v.kuaishou.com/KdtJ9SWP	ks
          EOF

          while IFS=$'\t' read -r id url platform; do
            echo "==== $id ===="
            mkdir -p "$OUT/$id/media"
            printf '%s\n' "$url" > "$OUT/$id/input_url.txt"

            resolved=$(curl -A 'Mozilla/5.0' -Ls -o /dev/null -w '%{url_effective}' --max-time 20 "$url")
            printf '%s\n' "$resolved" > "$OUT/$id/resolved_url.txt"
            target="$resolved"
            [ -z "$target" ] && target="$url"

            if [ "$platform" = "dy" ]; then
              bash "$TOOL/scripts/download-douyin.sh" --probe-only speed "$target" "$OUT/$id/media" > "$OUT/$id/probe.json" 2> "$OUT/$id/probe.stderr"
              prc=$?
              echo "probe_rc=$prc" > "$OUT/$id/status.txt"
              if [ "$prc" -eq 0 ]; then
                bash "$TOOL/scripts/download-douyin.sh" speed "$target" "$OUT/$id/media" > "$OUT/$id/download.stdout" 2> "$OUT/$id/download.stderr"
              fi
            else
              bash "$TOOL/scripts/download-kuaishou.sh" --probe-only speed "$target" "$OUT/$id/media" > "$OUT/$id/probe.json" 2> "$OUT/$id/probe.stderr"
              prc=$?
              echo "probe_rc=$prc" > "$OUT/$id/status.txt"
              if [ "$prc" -eq 0 ]; then
                bash "$TOOL/scripts/download-kuaishou.sh" speed "$target" "$OUT/$id/media" > "$OUT/$id/download.stdout" 2> "$OUT/$id/download.stderr"
              fi
            fi

            drc=$?
            echo "download_rc=$drc" >> "$OUT/$id/status.txt"
            media=$(find "$OUT/$id/media" -type f \( -name '*.mp4' -o -name '*.mkv' -o -name '*.webm' \) | head -1)
            if [ -n "$media" ]; then
              ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json "$media" > "$OUT/$id/ffprobe.json"
              dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$media")
              python - "$dur" > "$OUT/$id/times.txt" <<'PY'
          import sys
          try:
              d=float(sys.argv[1])
          except:
              d=0
          for i,p in enumerate([0.02,0.08,0.16,0.28,0.42,0.58,0.74,0.88,0.97],1):
              print(f"{i}\t{max(0,d*p):.3f}")
          PY
              while IFS=$'\t' read -r n t; do
                ffmpeg -loglevel error -ss "$t" -i "$media" -frames:v 1 -q:v 3 "$OUT/$id/frame_$n.jpg"
              done < "$OUT/$id/times.txt"
              ffmpeg -loglevel error -i "$media" -vn -ac 1 -ar 16000 -b:a 48k "$OUT/$id/audio.mp3"
              rm -f "$media"
            fi
          done < /tmp/links.tsv

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-probe-results-v2
          path: results/
          if-no-files-found: error
          retention-days: 3
